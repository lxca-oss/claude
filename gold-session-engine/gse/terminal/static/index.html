<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Session Engine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9b45a'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='700' text-anchor='middle' fill='%231a1406'%3EAu%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try { const t = localStorage.getItem("gse-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">Au</div>Gold Session Engine<small>XAU/USD</small></div>
      <div class="quote" id="top-quote"><span class="px">—</span><span class="sp"></span></div>
      <span class="pill idle" id="top-status">Stopped</span>
      <div class="clocks" id="clocks"></div>
      <div class="top-actions">
        <button class="btn sm" id="btn-pause" title="Stop new entries (open trades keep their stops)">Pause</button>
        <button class="btn sm danger" id="btn-flatten" title="Close every bot position and cancel its orders">Flatten</button>
        <button class="btn sm ghost" id="btn-theme" title="Light/dark" aria-label="Switch light/dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      </div>
    </header>
    <nav class="nav" id="nav">
      <button data-tab="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-4H3z"/></svg>Dashboard</button>
      <button data-tab="strategy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19l5-6 4 3 7-9"/><path d="M20 7h-4M20 7v4"/></svg>Strategy</button>
      <button data-tab="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Trade log</button>
      <button data-tab="backtest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Backtest</button>
      <button data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data &amp; news</button>
      <button data-tab="connection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>cTrader</button>
      <div class="spacer"></div>
      <div class="foot" id="nav-foot">v0.1 · not financial advice</div>
    </nav>
    <main id="main"></main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
