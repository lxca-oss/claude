improved workplace safety: mandatory WH&amp;S (PPE, adjusted layouts), fewer accidents, lower compensation claims and absenteeism costs</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>compliance costs: staff time and resources for paperwork and record keeping (e.g. Fair Work Act)</li>\n<li>minimum wage and entitlement increases raise wage expenses, worse for labour-intensive businesses</li>\n<li>policies restricting materials (e.g. Plastic Reduction Act) may force new suppliers, higher costs and lead times</li>\n</ul><h3>Legal Regulations</h3><p><span class=\"lb def\">Def</span> laws passed by government that a business must comply with</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>compliance costs: expenses incurred to comply</li>\n<li>must refer to specific legislation or marks are capped:\n<ul>\n<li>Work Health and Safety Act 2011 (NSW): safety training, protective clothing, hazardous materials procedures</li>\n<li>Environmental Protection and Biodiversity Conservation Act 1999: waste management, minimal impact operations</li>\n<li>Competition and Consumer Act 2010 (Cth): fair competition (marketing)</li>\n<li>Food Act 2003 (NSW): food health standards</li>\n<li>Fair Work Act 2009 (Cth): National Minimum Wage, NES, Modern Awards</li>\n</ul></li>\n<li>think about which processes/strategies it influences</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>improved workplace safety (PPE, layouts), fewer accidents, lower compensation and absenteeism costs</li>\n<li>better brand reputation and customer trust through consistent compliance, competitive advantage (link to differentiation)</li>\n<li>avoided penalties: protects from fines, litigation and sanctions, improves long-term profitability</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>compliance costs: paperwork, reporting, record keeping</li>\n<li>minimum wage and entitlement increases raise wage expenses</li>\n<li>fines and legal costs for non-compliance (e.g. Fair Work Act or WH&amp;S breaches)</li>\n</ul><h3>Environmental Sustainability</h3><p><span class=\"lb def\">Def</span> ensuring current resources and practices do not impact future generations' ability to meet their needs</p>\n<p><span class=\"lb how\">How</span> minimise pollution and waste; use lower energy (lighting, heat, machinery); recycle materials (glass, paper, metal); sustainably use renewables, reduce non-renewables</p>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>stronger brand image and competitive advantage, differentiates from competitors</li>\n<li>cost savings from green initiatives (e.g. solar panels cut electricity expenses), better long-term profitability</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>large upfront capital outlays, pressure on finances, higher overall costs</li>\n<li>staff re-training adds time and cost, can reduce speed and flexibility</li>\n</ul>", "related": []}, {"id": "operations-i2", "t": "Corporate social responsibility", "rest": "", "subs": ["the difference between legal compliance and ethical responsibility", "environmental sustainability and social responsibility"], "mn": "", "html": "<p><span class=\"lb def\">Def</span> open and accountable business actions that are ethical and respectful to society and the environment, going BEYOND complying with laws</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>closely linked with ethical responsibility, often called triple bottom line (financial, social, environmental)</li>\n<li>businesses increasingly scrutinised by stakeholders; failure to show ethical behaviour hurts performance and brand image</li>\n<li>in responses, consider how the \"how\" helps wider society</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th></th>\n<th>Legal compliance</th>\n<th>Ethical responsibility</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Def</td>\n<td>standards of behaviour that must be met</td>\n<td>going BEYOND regulations, wider focus on social and environmental outcomes</td>\n</tr>\n<tr>\n<td>Effect</td>\n<td>• compliance costs<br />\n• penalties for non-compliance</td>\n<td>shows the business values more than profit</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>How #1: WHS Act 2011 (protects health, safety and welfare of employees, volunteers and others)</strong></p>\n<ul>\n<li>Legal compliance: costs to train staff, risk mitigation, WHS committee</li>\n<li>Ethical: additional training (First Aid/CPR, discrimination and bullying seminars), on-site counsellors</li>\n<li>Wider society: trained employees act quickly in emergencies, better health outcomes</li>\n</ul>\n<p><strong>How #2: EPBC Act 1999 (protects biodiversity and important natural and cultural places)</strong></p>\n<ul>\n<li>Legal compliance: costs to change operations (e.g. mining spending to minimise run-off pollution)</li>\n<li>Ethical 1: renewable energy (e.g. solar panels)\n<ul>\n<li>Advantage: lower carbon emissions and long-term operating costs</li>\n<li>Disadvantage: large initial capital outlay</li>\n<li>Wider society: fewer pollutants, cleaner air, fewer pollution-related health issues</li>\n</ul></li>\n<li>Ethical 2: extensive recycling programs (paper, soft plastics, batteries)\n<ul>\n<li>Advantage: positive culture valuing the environment, may attract employees</li>\n<li>Disadvantage: extra expenses (bins, labour)</li>\n<li>Wider society: toxic substances safely handled, less ecosystem contamination</li>\n</ul></li>\n</ul>\n<p><strong>How #3: National Employment Standards (all employees get NMW and NES rights)</strong></p>\n<ul>\n<li>Legal compliance: costs to raise wages if NMW rises, provide annual and sick leave</li>\n<li>Ethical 1: exceed NES (e.g. extra maternity/paternity leave or paid community service leave)\n<ul>\n<li>Wider society: healthier families, lower long-term societal costs</li>\n</ul></li>\n<li>Ethical 2: ISO 26000 certification (social responsibility; international standards on labour, human rights, fair operating procedures)\n<ul>\n<li>Advantage: improved brand image, more transparency</li>\n<li>Disadvantage: certification compliance costs</li>\n<li>Wider society: promotes a global movement toward social responsibility</li>\n</ul></li>\n</ul>\n<p><span class=\"lb k\">Other ways to demonstrate CSR</span> greenhouse abatement; new and better products made in an ecologically sustainable manner; reducing wastage and harmful materials; onshore instead of offshore outsourcing</p>\n<p><span class=\"lb k\">Measuring CSR</span> trends in business practices (e.g. carbon footprint/emission tracking); benchmarking against best-practice CSR businesses; ISO 26000 adherence (7 areas: accountability, transparency, ethical behaviour, respect for stakeholder interests, laws, international norms, human rights)</p>\n<p><span class=\"lb k\">Implications</span></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>increased employee interest and retention (more attractive employment)</li>\n<li>increased customer loyalty and brand image</li>\n<li>long-term costs may decrease (e.g. solar panels)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>compliance costs to meet legal regulations</li>\n<li>initial costs to exceed regulations</li>\n<li>poor brand image if not ethically responsible</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "P", "name": "Processes", "mn": "MIC HF, VVVV, FOPP", "intro": "", "pts": [{"id": "operations-p1", "t": "Inputs", "rest": "", "subs": ["transformed resources (materials, information, customers)", "transforming resources (human resources, facilities)"], "mn": "MIC, HF", "html": "<p><span class=\"lb def\">Def</span> basic resources used in the transformation (production) process, classified as transforming or transformed</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Transformed resources: Materials, Information, Customers (MIC)</li>\n<li>Transforming resources: Human resources, Facilities (HF)</li>\n</ul><h3>Transforming Resources (carry out the transformation, enabling change and value-adding)</h3><p><strong>Human Resources</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> individuals providing mental and physical labour in exchange for income</li>\n<li>Features: use skills, knowledge and effort to transform inputs; must be trained, motivated, attracted and retained</li>\n<li><span class=\"lb pos\">Positives</span> skilled, motivated employees enhance efficiency, speed, productivity and quality</li>\n<li><span class=\"lb neg\">Negatives</span> cost and time intensive to train</li>\n</ul>\n<p><strong>Facilities</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> the plant (office or factory) and machinery used in operations</li>\n<li>Features: design layout, number of facilities, location, capacity</li>\n<li><span class=\"lb pos\">Positives</span> well-designed plant layout improves productivity, efficiency and speed</li>\n<li><span class=\"lb neg\">Negatives</span> time and cost intensive to buy/rent facilities and change layout</li>\n</ul><h3>Transformed Resources (changed or converted in the process)</h3><p><strong>Materials</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> basic elements used in production, including raw materials and intermediate goods</li>\n<li>Features: availability and cost influence ability to manufacture</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>high-quality materials improve standard and consistency, meet expectations, fewer returns</li>\n<li>durable materials minimise defects and waste, support efficiency and sustainability</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>scarcity or delays halt production, longer lead times, lower satisfaction</li>\n<li>premium materials raise input costs, harder to achieve cost leadership</li>\n</ul></li>\n</ul>\n<p><strong>Information</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> knowledge from research, investigation and instruction supporting operations decisions</li>\n<li>Features: external (ABS, industry and market reports); internal (financial reports, KPIs); goods: how to produce efficiently, technical knowledge (critical path analysis, design specifications); services: information used to give personalised, accurate services</li>\n<li><span class=\"lb pos\">Positives</span> tailored services and efficient methods raise satisfaction and competitive advantage</li>\n<li><span class=\"lb neg\">Negatives</span> time and cost to gather, process and maintain reliable information, especially external</li>\n</ul>\n<p><strong>Customers</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> individuals who buy goods or services to satisfy needs and wants</li>\n<li>Features: choices, preferences, tastes and feedback shape design and production; may be physically or mentally changed by the process (haircut, travel, education)</li>\n<li><span class=\"lb pos\">Positives</span> feedback keeps businesses competitive and responsive to trends</li>\n<li><span class=\"lb neg\">Negatives</span> varied preferences complicate production and raise costs</li>\n</ul>", "related": []}, {"id": "operations-p2", "t": "Transformation processes", "rest": "", "subs": ["the influence of volume, variety, variation in demand and visibility (customer contact)", "sequencing and scheduling – Gantt charts, critical path analysis", "technology, task design and process layout", "monitoring, control and improvement"], "mn": "VVVV, FOPP", "html": "<h3>Transformation Processes: Influence of the 4Vs (VVVV)</h3><p><span class=\"lb def\">Def</span> converting inputs into outputs (goods and/or services)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Manufacturing: inputs into tangible goods, often highly mechanised, focus on flow of materials</li>\n<li>Service: inputs into intangible outputs, more labour-intensive, focus on flow of customers or information</li>\n<li>4Vs: Volume, Variety, Variation in demand, Visibility; they affect cost and complexity, and are INFLUENCES within the process</li>\n<li>influenced by the PLC: establishment (slow demand growth, higher customisation and design changes), growth (demand and volume increase)</li>\n<li>cover BOTH high and low of each V in 5 or 6 mark responses</li>\n</ul>\n<p><strong>Volume</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> quantity of products made or services provided; businesses decide how much to produce and how quickly to adjust, to minimise lead time</li>\n<li>High volume:\n<ul>\n<li>Positive: standardise, technology assists, lower unit cost via economies of scale (bulk buying, specialisation)</li>\n<li>Negative: significant capital in machinery and technology, high fixed costs regardless of sales</li>\n</ul></li>\n<li>Low volume:\n<ul>\n<li>Positive: customise to needs, less technology if hand-made or bespoke</li>\n<li>Negative: inefficient inventory management, excess stock if demand does not match production (wastage)</li>\n</ul></li>\n</ul>\n<p><strong>Variety</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> range of different products or services offered; more variety needs more flexibility (complex machinery, more inputs)</li>\n<li>Low variety:\n<ul>\n<li>Positive: simpler production, easier to automate and standardise, economies of scale</li>\n<li>Negative: less competitive, struggles to respond to changing trends</li>\n</ul></li>\n<li>High variety:\n<ul>\n<li>Positive: broader appeal, caters to different needs, higher sales and loyalty (customisation)</li>\n<li>Negative: more complex process (speed), higher costs as inputs to buy and store increase (cost)</li>\n</ul></li>\n</ul>\n<p><strong>Variation in Demand</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> fluctuations in customer demand over time; operations must adjust inputs, HR, machinery capacity, energy; forecast changes (e.g. Christmas, seasons) and stay flexible</li>\n<li>Low variation (steady, predictable; like low variety and high volume):\n<ul>\n<li>Positive: stable operations, easier planning of schedules, staffing and inventory, lower holding costs</li>\n<li>Negative: limited innovation, over-reliance on certain products/markets, missed diversification</li>\n</ul></li>\n<li>High variation (fluctuating, unpredictable):\n<ul>\n<li>Negative: extra capacity (staff, machines) for peaks, higher fixed and labour costs when underused</li>\n<li>Negative: complex inventory (stockouts in peaks, excess in troughs), working capital tied up in stock</li>\n</ul></li>\n</ul>\n<p><strong>Visibility (Customer Contact)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> exposure of internal operations to customers; services are high visibility, manufacturing is low</li>\n<li>customer feedback can directly affect the process: direct (surveys, interviews, warranty claims, verbal contact), indirect (sales, market-share data, observation)</li>\n<li>Low visibility:\n<ul>\n<li>Positive: operational efficiency, fewer interruptions, higher productivity</li>\n</ul></li>\n<li>High visibility:\n<ul>\n<li>Positive: immediate feedback, issues resolved quickly, transparency builds trust and loyalty, personalised service</li>\n<li>Negative: higher operational costs (staff, systems, fit-outs), pressure on staff under constant observation needing extensive training</li>\n</ul></li>\n</ul><h3>Sequencing and Scheduling</h3><ul>\n<li>Sequencing: the order of operations processes</li>\n<li>Scheduling: the timing of operations processes</li>\n<li>two tools: Gantt charts, critical path analysis; assist planning, organisation and implementation</li>\n</ul>\n<p><strong>Gantt Charts</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> horizontal bar charts showing activities, their order and expected duration</li>\n<li>Features: show overlap, start and end date; used for simple routines (homework) and complex projects (building a dam); useful for multi-step projects</li>\n<li><span class=\"lb pos\">Positives</span> useful monitoring tool, clear comparison of actual and planned progress</li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>does not show relationships and interdependence between activities</li>\n<li>does not show the most efficient way to complete a project</li>\n</ul></li>\n</ul>\n<p><strong>Critical Path Analysis (CPA)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> scheduling method showing the activities, their order and the time each takes</li>\n<li>Features: finds the shortest time to complete a project; shows where remedial action is needed; every activity must be completed, different paths show simultaneous activities; the critical path is always the path that TAKES THE LONGEST</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>shows which tasks can run simultaneously to improve efficiency</li>\n<li>highlights bottlenecks to address</li>\n<li>overview of tasks and timing</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>does not account for production delays</li>\n<li>time for each activity must be estimated</li>\n<li>depends on dependencies (labour availability, resources, seasonal factors such as dry weather)</li>\n</ul></li>\n</ul><h3>Technology, Task Design and Process Layout</h3><h4>Technology (Transformation Process)</h4><ul>\n<li><span class=\"lb def\">Def</span> application of science or knowledge enabling new tasks or established tasks to be done more effectively and efficiently</li>\n<li>Features: manufacturing (robotics, CAD/CAM, 3D printing, AI/machine learning, autonomous vehicles, RPA); service (software, computers, EFT)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>efficiency and productivity: automation streamlines production, more output per worker (Speed)</li>\n<li>accuracy and precision, no human error: consistent standards, fewer warranty claims (Quality and Cost)</li>\n<li>capital-labour substitution: lower ongoing wages (Cost)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>large upfront capital and ongoing retraining, hard for SMEs (Cost)</li>\n<li>replaces jobs: redundancy costs, staff fear for roles, lower morale (Quality and Cost)</li>\n<li>maintenance and downtime: breakdowns halt production, delayed outputs (Speed and Flexibility)</li>\n</ul></li>\n</ul><h4>Task Design</h4><ul>\n<li><span class=\"lb def\">Def</span> classifying job activities so an employee can easily perform and complete the task</li>\n<li><span class=\"lb how\">How (3 steps)</span> determine what tasks need performing → how they will be performed (steps) → labour requirements (skills audit: present skill level and shortfalls to fix by recruitment or training)</li>\n<li>Summary: task design → job description → recruitment</li>\n<li>Why important: avoids confusion over responsibilities, helps HR screen for skills, improves productivity, competitiveness and efficiency</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>easier for employees to perform tasks efficiently (Speed)</li>\n<li>matches skilled labour to tasks needing skills (Quality)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost: task design, skills audit, finding a candidate (Cost/Speed)</li>\n<li>skills audit may cause redundancies/turnover: lower morale, redundancy or recruitment costs (Cost)</li>\n</ul></li>\n</ul><h4>Process Layout (FOPP)</h4><p><span class=\"lb def\">Def</span> physical arrangement of equipment and people, typically grouped by function/process</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Layout</th>\n<th>Features</th>\n<th>Examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Process</td>\n<td>• machinery grouped by function<br />\n• high-variety, low-volume<br />\n• creates work teams</td>\n<td>gyms, hospitals</td>\n</tr>\n<tr>\n<td>Product</td>\n<td>• machinery arranged by task sequence<br />\n• uniform quality, high-volume (mass) production<br />\n• assembly lines</td>\n<td>car manufacturing</td>\n</tr>\n<tr>\n<td>Fixed-position</td>\n<td>• product stays in one location, people, machinery and materials brought to it<br />\n• heavy, bulky or immobile products</td>\n<td>planes, ships, buildings, bridges</td>\n</tr>\n<tr>\n<td>Office</td>\n<td>• desks and workstations arranged by function<br />\n• encourages communication, collective thinking and problem solving<br />\n• consider equipment size, work areas, storage</td>\n<td>offices</td>\n</tr>\n</tbody>\n</table></div>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>increases teamwork, efficiency and productivity</li>\n<li>improved efficiency can cut costs (fewer staff in a collaborative layout), raising profitability and speed</li>\n<li>promotes positive culture and morale through collaboration</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>time intensive to organise layouts</li>\n<li>large initial capital for structural reorganisation</li>\n<li>disrupts routines, employment changes/redundancies if skill needs change</li>\n</ul><h3>Monitoring, Control and Improvement (MCI)</h3><p><strong>Monitoring</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> measuring actual against planned performance</li>\n<li><span class=\"lb how\">How</span> statistical data analysis (KPIs and SLAs)</li>\n<li>Features: efficiency/time indicators (lead times, inventory turnover, defect rates, process flow rates, capacity/volume rates); cost indicators (direct and indirect costs, IT and maintenance costs); SLA: level of service expected from a supplier, sets metrics and remedies or penalties</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>finds underperformance and bottlenecks early (Speed)</li>\n<li>data informs decisions, planning, forecasting and continuous improvement (Dependability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>reactionary, not proactive: acts after a bottleneck</li>\n<li>time and cost: management time, monitoring technology, can slow production (Cost and Speed)</li>\n</ul></li>\n</ul>\n<p><strong>Controlling</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> assessing KPIs against targets and taking corrective action to achieve performance objectives</li>\n<li><span class=\"lb how\">How (corrective action)</span> redesign facility layout; new technology; specialist staff; better quality inputs; CPA/Gantt charts to fix efficiency and speed issues</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>supports continuous improvement of productivity, quality and efficiency (Quality)</li>\n<li>identifies deviations early: quick response to rising costs, quality issues, delays (Speed and Dependability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost of control systems (dashboards, KPI reviews) (Cost)</li>\n<li>resistance to change as workloads or responsibilities change (Quality)</li>\n</ul></li>\n</ul>\n<p><strong>Improvement</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> systematic processes, strategies and culture used to eliminate bottlenecks and achieve performance objectives</li>\n<li>Features: bottleneck: part of the process that slows overall speed and creates a backlog; areas: wastage, inefficiencies, process flows, time, quality, cost</li>\n<li><span class=\"lb how\">How</span> Six Sigma approach: management techniques to systematically reduce inefficiencies by reducing the probability of an error/defect</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>boosts competitiveness: continuously enhancing quality, speed, cost, innovation</li>\n<li>more efficiency, less waste: eliminates non-value-adding processes</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>ongoing investment: technology, training, redesign</li>\n<li>change fatigue: burnout or resistance if poorly communicated</li>\n</ul></li>\n</ul>", "related": []}, {"id": "operations-p3", "t": "Outputs", "rest": "", "subs": ["customer service", "warranties"], "mn": "", "html": "<p><span class=\"lb def\">Def</span> the result of business efforts, the good or service provided to the customer</p>\n<p><strong>Customer Service</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> how well a business meets and exceeds customer expectations</li>\n<li>Features: before, during and after a sale; many defects, complaints and long waits show service needs improving (interdependence with Marketing)</li>\n<li><span class=\"lb how\">How</span> complaints department; customer service training; minimise defects; reduce waiting times</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>customer satisfaction and loyalty: trust, repeat purchases</li>\n<li>competitive advantage through strong service</li>\n<li>fewer complaints and returns</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high labour and training costs</li>\n<li>time-consuming, diverts time from core operations</li>\n</ul></li>\n</ul>\n<p><strong>Warranties</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> promise to repair or replace defective products</li>\n<li>Features: under ACL products must be fit for purpose, durable, free from defects, of merchantable quality; gives consumers confidence in quality (interdependence with Marketing)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>consumer confidence: the business stands behind its quality</li>\n<li>competitive positioning: strong warranties differentiate</li>\n<li>quality control tool: high claims reveal recurring production issues</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>higher operational costs (repairs, replacements, refunds)</li>\n<li>claims divert resources from core production</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "S", "name": "Strategies", "mn": "", "intro": "", "pts": [{"id": "operations-s1", "t": "Performance objectives", "rest": "quality, speed, dependability, flexibility, customisation, cost", "subs": [], "mn": "CDF CSQ", "html": "<p><strong>Quality</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> standard of product design, manufacturing and service applied to meet consumer expectations</li>\n<li><span class=\"lb how\">How</span> quality of design (standard to which a product is designed, built or delivered based on customer preferences; influences materials and process); quality of conformance (how well the product meets a design's standards); quality of service (reliability, meeting needs, timeliness)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces costs (fewer defects, warranty claims, wastage)</li>\n<li>better reliability and reputation</li>\n<li>customer satisfaction and loyalty</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>quality management is cost intensive (e.g. more inspections need labour)</li>\n<li>quality assurance may slow the process</li>\n</ul></li>\n</ul>\n<p><strong>Speed</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> time for production and operations to respond to changes in market demand</li>\n<li><span class=\"lb how\">How</span> change input levels and processing times in response to demand</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces wait times</li>\n<li>shorter lead times</li>\n<li>faster processing</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>higher initial costs (new machinery to increase speed and reduce bottlenecks)</li>\n<li>quality issues if done poorly</li>\n</ul></li>\n</ul>\n<p><strong>Dependability</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> consistency and reliability of products in performing their intended purpose</li>\n<li>Features: goods: durable and long-lasting (a perishable good is dependable if consistent and satisfactory); services: consistent standards and reliability; measured by warranty claims (goods) and complaints (services)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>improved brand image</li>\n<li>customer satisfaction</li>\n<li>competitive advantage</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> raising standards may need technology and quality management, increasing costs</li>\n</ul>\n<p><strong>Flexibility</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> how quickly processes adjust to market changes</li>\n<li>Features: ability to change goods and services offered (variety and volume) and delivery speed</li>\n<li><span class=\"lb how\">How (services)</span> more service providers; higher skill level; more technology</li>\n<li><span class=\"lb how\">How (goods)</span> more efficient production; more flexible technology; alter product design</li>\n<li><span class=\"lb pos\">Positives (Flexibility)</span>\n<ul>\n<li>improved efficiency</li>\n<li>improved brand image</li>\n<li>improved customer satisfaction</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>may need new technology, large upfront capital raises costs</li>\n</ul></li>\n</ul>\n<p><strong>Customisation</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> individualised products for specific customer needs</li>\n<li>Features: usually a compromise between volume production cost advantages and variety to meet needs (customisation vs standardisation), e.g. colour, size, functionality; mass customisation: a standard mass-produced item personally modified to customer requirements</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>closely aligns with customer needs and wants</li>\n<li>improves satisfaction</li>\n<li>competitive advantage</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>may lack appropriate inputs, knowledge, systems or technology</li>\n<li>equipment, technology or labour skills may be limited</li>\n<li>time and cost to understand needs and translate into design/service requirements</li>\n</ul></li>\n</ul>\n<p><strong>Cost</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> minimising expenses so processes are as cheap as possible</li>\n<li>Features: cost leadership (strategic role) maximises profits</li>\n<li><span class=\"lb how\">How</span> waste minimisation; new technologies; more efficient use of inputs; efficient inventory management; increased flexibility; efficient logistics</li>\n<li>Lower quality products:\n<ul>\n<li>Positive:\n<ul>\n<li>decreased costs and COGS, higher gross profit</li>\n<li>lower prices stimulate sales (link to Marketing: Price)</li>\n</ul></li>\n<li>Negative:\n<ul>\n<li>loses consumers who prefer high quality, lower sales</li>\n<li>may damage brand image</li>\n</ul></li>\n</ul></li>\n<li>Higher quality products:\n<ul>\n<li>Positive: may increase sales and improve brand image</li>\n<li>Negative: higher costs, lower gross profit, higher prices may lower sales</li>\n</ul></li>\n</ul>", "related": []}, {"id": "operations-s2", "t": "New product or service design and development", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Goods: 2 approaches:\n<ul>\n<li>Consumer approach: consumer preferences and taste found through market research, market-orientated products</li>\n<li>Changes and innovations in technology: leading-edge technology for design, functionality, performance and appeal, competitive advantage</li>\n</ul></li>\n<li>Product utility: usefulness and value from the consumer's point of view</li>\n<li>Services: usually customised; can be standardised if limited customer interaction (e.g. shelf packing at Coles); may involve physical goods (e.g. surgeon using bandages)</li>\n<li>Explicit services: tangible aspect (time, expertise, skill, effort)</li>\n<li>Implicit services: based on a feeling, intangible (e.g. feeling satisfied)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>addresses products becoming obsolete in the decline stage of the PLC</li>\n<li>entices existing customers to repurchase, increases sales</li>\n<li>may satisfy new customers</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>may make existing products obsolete, lowering their sales</li>\n<li>cost of research and development</li>\n<li>process layout and task design changes are time and cost intensive</li>\n</ul>", "related": []}, {"id": "operations-s3", "t": "Supply chain management", "rest": "logistics, e-commerce, global sourcing", "subs": [], "mn": "DTSM, LEG", "html": "<p><span class=\"lb def\">Def</span> managing the flow of supplies through inputs, transformation and outputs to meet consumer needs</p>\n<p><span class=\"lb k\">Characteristics and features</span> 3 elements: Logistics, E-commerce, Global sourcing</p>\n<p><strong>Logistics (DTSM)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> managing distribution, transportation, storage, materials handling and packaging of goods</li>\n<li><span class=\"lb how\">How</span>\n<ul>\n<li>Distribution: delivering to the consumer, direct or indirect (interdependence with Marketing)</li>\n<li>Transportation: time and cost-efficient modes suited to the product</li>\n<li>Storage: warehousing (storing and protecting goods, Automated Warehouse Trucks replace forklifts); distribution centres (short-term storage near stores, often perishables, cold storage)</li>\n<li>Materials handling and packaging: care for fragile or hazardous goods, specific packaging or regulations</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>efficient distribution: timely delivery, optimised routes, satisfaction (Speed, Dependability)</li>\n<li>cost-effective transport: less fuel, lower costs (Cost)</li>\n<li>optimised storage: AWTs reduce labour costs (Quality, Cost)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high setup costs: infrastructure, ongoing maintenance and upgrades (Cost)</li>\n</ul></li>\n</ul>\n<p><strong>E-Commerce</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> buying and selling goods and services via the internet</li>\n<li><span class=\"lb how\">How</span> through a website, supported by e-procurement: online order system lets suppliers see the business's supply levels, so when stock hits a set level the supplier automatically supplies a quantity (requires a B2B arrangement)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>efficient ordering: streamlined supply, fewer errors, quicker inputs (Speed)</li>\n<li>cost savings: lower admin, better inventory management, automated ordering, less paperwork (Cost)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>initial setup: investment in technology and training (Cost)</li>\n<li>security risks: online transactions exposed to cyber threats (Cost)</li>\n</ul></li>\n</ul>\n<p><strong>Global Sourcing</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> purchasing inputs in international markets</li>\n<li><span class=\"lb how\">How</span> global web of suppliers (multiple international suppliers for steady, reliable supply); choose by quality, quantity, cost, reliability, flexibility, responsiveness; keep a global lens in each point</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>cost reduction: cheaper inputs cut expenses (Cost, Cost Leadership)</li>\n<li>higher quality and unique inputs unavailable domestically (Quality, G/S differentiation)</li>\n<li>greater volume and flexibility, less reliance on one supplier, lower shortage risk (Flexibility)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>higher transport costs than domestic (Cost)</li>\n<li>complex to manage a global web: shipments, customs, delays (Flexibility, Cost)</li>\n<li>unfavourable AUD movements may erase savings (Cost)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "operations-s4", "t": "Outsourcing", "rest": "advantages and disadvantages", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> using external providers (onshore or offshore) to perform business activities</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>also called business process outsourcing (BPO): specialists perform the activity at lower cost and more effectively</li>\n<li>commonly outsourced: manufacturing, logistics and/or distribution</li>\n</ul>\n<p><span class=\"lb how\">How</span> build-operate-transfer: business establishes operations offshore (build and operate), later transferred to an external vendor under contract (transfer)</p>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>lower costs: specialisation, economies of scale, local regulations (Cost Leadership)</li>\n<li>access to expertise: better technology and specialised labour (Quality, Speed)</li>\n<li>focus on core activities, competitive advantage (Quality, G/S Differentiation)</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>loss of control over quality and service standards (minimised through SLAs), hurts service and repeat sales (Quality)</li>\n<li>communication and cultural barriers offshore (time zone, language): delays or output issues (Quality, Speed, Flexibility)</li>\n<li>security risks: shared data and processes may leak, reducing competitive advantage</li>\n</ul>", "related": []}, {"id": "operations-s5", "t": "Technology", "rest": "leading edge, established", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> application of science or knowledge enabling new or established tasks to be done more effectively and efficiently</p>\n<p><span class=\"lb how\">How</span></p>\n<ul>\n<li>leading-edge: most advanced at any point in time (AI/machine learning, autonomous and drone delivery, lasers in manufacturing, RPA)</li>\n<li>established: widely adopted (CAD/CAM, barcoding, IT systems and software, EFT)</li>\n</ul>\n<p><span class=\"lb k\">Positives and negatives</span> as for Technology (Transformation Process) in Processes (efficiency, accuracy and capital-labour substitution; upfront cost, job losses, downtime)</p>", "related": []}, {"id": "operations-s6", "t": "Inventory management", "rest": "advantages and disadvantages of holding stock, LIFO (last-in-first-out), FIFO (first-in-first-out), JIT (just-in-time)", "subs": [], "mn": "HS, JIT, FIFO, LIFO", "html": "<p><span class=\"lb def\">Def</span> managing the storage of raw materials, semi-finished and finished goods</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>3 methods: Holding stock (HS), Just-in-time (JIT), combination of HS and JIT (usually ideal)</li>\n<li>challenges: adequate inventory, tracking changes, valuation</li>\n<li>management methods differ from valuation methods: for valuation focus on FIFO or LIFO; for inventory management generally JIT is usually best</li>\n</ul>\n<p><strong>Holding Stock</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> storing inventory on hand to meet demand without delay</li>\n<li><span class=\"lb how\">How</span> order from suppliers and store in warehouses until needed</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>faster response to demand, fewer shortages, satisfaction (Speed)</li>\n<li>buffer against supply disruptions and demand spikes (Flexibility)</li>\n<li>stock on shelves aids visual merchandising and promotion (G/S Differentiation)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>holding costs and tied up capital (warehousing, insurance) limit liquidity (Cost, Flexibility)</li>\n<li>obsolescence in fast-moving industries (technology) (Cost)</li>\n<li>wastage of perishables (Cost)</li>\n</ul></li>\n</ul>\n<p><strong>Just-in-Time (JIT)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> inputs delivered only as needed in production</li>\n<li>Features: most effective for perishables or products prone to obsolescence (less wastage, shrinkage, storage costs); needs flexible operations and reliable suppliers who deliver at short notice</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>lower holding costs (storage, insurance, security, stocktaking) (Cost)</li>\n<li>improved cash flow, less capital tied up</li>\n<li>less wastage and shrinkage (Cost)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>limited flexibility for demand spikes (Flexibility)</li>\n<li>high dependence on suppliers: delays halt production (Speed)</li>\n<li>needs accurate forecasting and strong supplier relationships (Cost)</li>\n</ul></li>\n</ul>\n<p><strong>Inventory Valuation and Rotation: LIFO and FIFO</strong></p>\n<ul>\n<li>Example (bananas): Batch A (Jan) 1000 x $100 = $100,000; Batch B (Feb) 1000 x $110 = $110,000; Batch C (Mar) 200 x $120 = $24,000; total $234,000; sells 1,200 at $165 (revenue $198,000)\n<ul>\n<li>FIFO: COGS (1000 x $100) + (200 x $110) = $122,000; gross profit $76,000; expenses $30,000; net profit $46,000</li>\n<li>LIFO: COGS (200 x $120) + (1,000 x $110) = $134,000; gross profit $64,000; expenses $30,000; net profit $34,000</li>\n</ul></li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th></th>\n<th>LIFO</th>\n<th>FIFO</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Def</td>\n<td>last goods purchased are first sold</td>\n<td>first goods purchased are first sold</td>\n</tr>\n<tr>\n<td>Used when</td>\n<td>product is not perishable, long-life</td>\n<td>• perishable or at risk of obsolescence<br />\n• appeals to investors (higher net profit, more dividends)</td>\n</tr>\n<tr>\n<td>Cost basis</td>\n<td>new inventory costs more at year end as prices rise</td>\n<td>older inventory costs less at start of year</td>\n</tr>\n<tr>\n<td>COGS</td>\n<td>overstated</td>\n<td>understated</td>\n</tr>\n<tr>\n<td>Gross and net profit</td>\n<td>understated</td>\n<td>overstated</td>\n</tr>\n<tr>\n<td>Other</td>\n<td>• reduces taxes paid<br />\n• inventory (current assets) undervalued</td>\n<td>inventory (current assets) overvalued</td>\n</tr>\n</tbody>\n</table></div>", "related": []}, {"id": "operations-s7", "t": "Quality management", "rest": "", "subs": ["control", "assurance", "improvement"], "mn": "", "html": "<p><span class=\"lb def\">Def</span> strategy to ensure consistency, reliability, safety and fit-for-purpose</p>\n<p><span class=\"lb k\">Characteristics and features</span> 3 approaches: Quality control, Quality assurance, Quality improvement (do not mix them up)</p>\n<p><strong>Quality Control (QC)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> inspections at various points in production to check for defects</li>\n<li><span class=\"lb how\">How</span> sampling; X-rays and infrared photography; other imaging; services: observing employee performance</li>\n<li>Features: reactive (product inspected before distribution); tip: use the word \"inspections\" in definition, positives and negatives</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>consistent standards, fewer defects, fit for purpose (Quality, Dependability)</li>\n<li>less waste and fewer warranty claims through early detection (Cost)</li>\n<li>customer satisfaction and loyalty, differentiation</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>QC technology, hiring and training inspectors (Cost)</li>\n<li>extra inspection steps slow operations, longer lead times, bottlenecks (Speed)</li>\n</ul></li>\n</ul>\n<p><strong>Quality Assurance (QA)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> a system ensuring set standards or benchmarks are achieved in production</li>\n<li><span class=\"lb how\">How</span> series of measurements assessed against pre-determined standards, e.g. ISO 9000 series quality certifications:\n<ul>\n<li>ISO 9001: product design and development</li>\n<li>ISO 9002: manufacturing</li>\n<li>ISO 9003: service-based industries</li>\n</ul></li>\n<li>Features: ISO is voluntary but sustains competitive advantage locally and internationally; certifies quality management processes, not the business's quality; any QA response must reference an ISO standard; tip: use \"set standards/benchmarks\" in the definition, positives and negatives</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>proactive: prevents defects during production, meets standards from the outset (Quality)</li>\n<li>customer trust, loyalty and brand perception (G/S differentiation)</li>\n<li>lower long-term costs: finds inefficiencies early, fewer recalls or repairs (Cost)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high accreditation costs: training, capital equipment, specialised staff (Cost)</li>\n<li>standards need constant monitoring and updating, less focus on core activities (Cost and Speed)</li>\n</ul></li>\n</ul>\n<p><strong>Quality Improvement (QI)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> processes ensuring consistency, reliability, safety and fit-for-purpose through continuous improvement and total quality management</li>\n<li><span class=\"lb how\">How</span>\n<ul>\n<li>continuous improvement: ongoing commitment to improve products and efficiency; Six Sigma (identify and eliminate operational problems); Kaizen (small incremental changes for high quality across the business)</li>\n<li>total quality management (TQM): every employee responsible for high quality; benchmarking, employee involvement, customer-orientated approach; quality circles: employees meet regularly to solve process, design and quality problems</li>\n<li>other: training programs; employee Think Tanks; time and motion studies; surveys</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>better quality and consistency: fewer defects (Quality, Dependability)</li>\n<li>lower costs and waste: fewer warranty claims (Cost)</li>\n<li>customer satisfaction and loyalty (G/S differentiation)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cost and time: investment in training, technology and hiring (Cost)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "operations-s8", "t": "Overcoming resistance to change", "rest": "financial costs, purchasing new equipment, redundancy payments, retraining, reorganising plant layout, inertia", "subs": [], "mn": "PIF RRR", "html": "<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>resistance can be financial or psychological</li>\n<li>Financial: Purchasing new equipment, Redundancy payments, Retraining, Reorganising plant layout</li>\n<li>Psychological: Inertia</li>\n</ul>\n<p><strong>Financial costs</strong></p>\n<ul>\n<li>Purchasing new equipment: buying plant, machinery, robotics, office equipment; high cost but benefits include flexibility, lead times, consistency, quality, less wastage; leasing prevents high initial costs but may cost more long term</li>\n<li>Redundancy payments: loss of work from job skills no longer required; required by employment legislation for full and part-time employees; can be high (length of employment, pay level, unused leave)</li>\n<li>Retraining: teaching new skills for a different role; cost and time intensive; required if roles change, new technology is acquired or the hierarchy is reorganised</li>\n<li>Reorganising plant layout: structural or physical reorganisation; downtime and costs can be substantial</li>\n</ul>\n<p><strong>Psychological costs: Inertia</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> natural tendency to resist change from uncertainty or fear of the unknown</li>\n<li>Features: change of job role, adapting to technology, fear of lost career opportunity; management may also resist; slows implementation; hard to quantify, may harm competitive advantage</li>\n</ul>\n<p><strong>Change management strategies</strong></p>\n<ul>\n<li>identify sources of change and whether processes need adjusting</li>\n<li>communicate the need for change and build a culture of change (included staff support it)</li>\n<li>use change agents: a person or group acting as catalysts, responsible for managing the change</li>\n<li>apply change models such as Kurt Lewin's unfreeze, change, refreeze</li>\n</ul>", "related": []}, {"id": "operations-s9", "t": "Global factors", "rest": "global sourcing, economies of scale, scanning and learning, research and development", "subs": [], "mn": "REGS", "html": "<p><span class=\"lb def\">Def</span> ways of improving the competitive position of the business in a global environment</p>\n<p><span class=\"lb k\">Characteristics and features</span> Research and development, Economies of scale, Global sourcing, Scanning and learning</p>\n<p><strong>Global Sourcing</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> purchasing inputs in international markets (see Globalisation Influence and Supply Chain Management)</li>\n<li><span class=\"lb how\">How</span> global web of suppliers (steady, reliable supply)</li>\n<li>Positives and negatives: as in Supply Chain Management (cheaper, higher quality and unique inputs, flexibility; higher transport costs, complexity, currency fluctuations)</li>\n</ul>\n<p><strong>Economies of Scale (EOS)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> cost advantages from increasing the scale of production, lowering per-unit costs</li>\n<li><span class=\"lb how\">How</span> spreading fixed costs over a larger volume of output</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>lower per-unit costs: fixed costs spread over more units, bulk-buying (Cost)</li>\n<li>improved competitiveness: lower costs and better margins allow lower prices or better value (Cost Leadership)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>coordination and management challenges: diseconomies of scale (inefficiencies that raise costs if unmanaged) (Cost)</li>\n</ul></li>\n</ul>\n<p><strong>Scanning and Learning</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> observation strategies used to find and adopt best practice operations processes</li>\n<li><span class=\"lb how\">How</span> observing industry and business associations, conferences and forums; analysing and benchmarking against leading global businesses; employing the most skilled labour from other firms/industries</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>more efficient production by learning best practice (Cost, Quality)</li>\n<li>encourages innovation: new technologies and methods (G/S Differentiation, Speed)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cost and time: research, observation and analysis (Cost)</li>\n<li>risk of misapplication: practices may not suit the firm (Quality, Dependability)</li>\n</ul></li>\n</ul>\n<p><strong>Research and Development (R&amp;D)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> systematic effort to innovate, improve and develop new products or processes to maintain or enhance competitive advantage</li>\n<li>Features: creates leading-edge technologies and innovative products (links to New Product or Service Design and Development)</li>\n<li><span class=\"lb how\">How</span> connect with research institutions, universities or global R&amp;D firms</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>drives innovation and competitiveness: unique products expand range or improve quality, new revenue streams (Quality, Customisation)</li>\n<li>process design innovations reduce waste, time and costs (Cost, Speed)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>significant, sustained investment with no guaranteed return (Cost)</li>\n</ul></li>\n</ul>", "related": []}]}]}, {"id": "hr", "name": "Human Resources", "short": "HR", "secs": [{"key": "R", "name": "Role", "mn": "", "intro": "", "pts": [{"id": "hr-r1", "t": "Strategic role of human resources", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> management of the total relationship between employer and employee (acquisition, development, maintenance, separation) to achieve strategic goals</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>holistic strategic approach: an effective workforce adds value to all areas; specific HR strategies retain, reward and motivate skilled employees</li>\n<li>key challenges: developing and retaining talent; leadership development; ageing workforce; increasing role of technology; increasing outsourcing and contractors; ethics and CSR</li>\n</ul>\n<p><span class=\"lb pos\">Positives (effective HRM)</span></p>\n<ul>\n<li>highly skilled workforce, improving efficiency</li>\n<li>motivated workforce, improving productivity</li>\n<li>lower levels of workplace disputes</li>\n</ul>\n<p><span class=\"lb neg\">Negatives (ineffective HRM)</span></p>\n<ul>\n<li>worker dissatisfaction, lower morale</li>\n<li>unmotivated workforce, lower productivity</li>\n<li>costs of high staff turnover, accidents and disputes</li>\n</ul>", "related": []}, {"id": "hr-r2", "t": "Interdependence with other key business functions", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> two-way relationship where HR helps/relies on another KBF and that KBF helps/relies on HR</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>must show both directions; one-way detail is only dependence</li>\n<li>Operations: manufacturing, services, value-adding, turning raw materials into goods, domestic/global</li>\n<li>Marketing: product design, sales, advertising, strategies (4Ps, segmentation)</li>\n<li>Finance: administration, financial management, financial planning</li>\n<li>HR: industrial relations, HRM, recruitment</li>\n</ul><h3>HR and Marketing</h3><ul>\n<li>Marketing to HR:\n<ul>\n<li>new product range → HR hires (Acquisition) a new product/brand manager</li>\n<li>Marketing communicates skills, qualifications, experience needed → HR includes them in job design and description → acquisition more effective</li>\n<li>Marketing needs skills (e-marketing, website design, market research) → skills audit → training (Development)</li>\n</ul></li>\n<li>HR to Marketing:\n<ul>\n<li>product deletion or decline stage of PLC → positions not required → HR adjusts job design, uses involuntary redundancy if no other positions, or re-skills (Development)</li>\n</ul></li>\n</ul><h3>HR and Operations</h3><ul>\n<li>Operations to HR:\n<ul>\n<li>new leading-edge technology → separation (involuntary redundancy) or retraining (Development)</li>\n<li>inertia that resists change → higher turnover and disputes → lower worker satisfaction and corporate culture</li>\n<li>global sourcing and outsourcing → must consider skills, cost and supply of global human resources</li>\n</ul></li>\n<li>HR to Operations:\n<ul>\n<li>HR is a transforming resource</li>\n<li>leadership style and maintenance (rewards) → motivation (corporate culture, worker satisfaction) → efficient, skilled workers (with development and acquisition) → better speed, cost and quality</li>\n<li>Operations employees must meet WHS legislation → training and development (HR)</li>\n</ul></li>\n</ul><h3>HR and Finance</h3><ul>\n<li>Finance to HR:\n<ul>\n<li>allocates funds (budgets from financial needs) → rewards (incentives), acquisition, training and development</li>\n<li>cost controls (cost centres) → high wage costs → may prompt involuntary separation → lower expenses → higher net profit</li>\n</ul></li>\n<li>HR to Finance:\n<ul>\n<li>HR needs (acquisition, development, maintenance, separation) → affect Finance decisions (budgets, financial institutions for sources of finance)</li>\n<li>pay rises (rewards) → affect budgeting → impact income statement and cash flow statement</li>\n</ul></li>\n</ul>", "related": []}, {"id": "hr-r3", "t": "Outsourcing", "rest": "", "subs": ["human resource functions", "using contractors – domestic, global"], "mn": "", "html": "<h3>Human Resource Functions</h3><ul>\n<li><span class=\"lb def\">Def</span> using external providers to perform business activities</li>\n<li>Features:\n<ul>\n<li>WHY: HR commonly outsourced to specialist firms (contractors) which perform at lower cost and more effectively, letting the business focus on core activities</li>\n<li>HOW: process outsourcing (repetitive, direct work, e.g. payroll, customer complaints); project outsourcing (intellectual property and strategic knowledge, e.g. change management, changing HRM systems)</li>\n<li>usually outsourced: recruitment, induction, leadership training, mediation, outplacement (support for employees leaving)</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>focus resources on core activities</li>\n<li>access to expertise in support and compliance (e.g. payroll)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>loss of control over HRM and service quality; breach of contract may be complex to remedy under foreign legal systems</li>\n<li>privacy issues sharing confidential information, may lead to client poaching</li>\n<li>possible retrenchment of internal HR employees</li>\n</ul></li>\n</ul><h3>Using Contractors</h3><p><span class=\"lb def\">Def</span> contractors are external providers of services to a business; HR is typically outsourced to domestic or global contractors</p>\n<p><strong>Domestic contractors</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> onshore external providers</li>\n<li>Why: avoids in-house staff, reducing costs and overheads</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>fewer communication and cultural misunderstandings than global</li>\n<li>familiarity with local laws</li>\n<li>focus on core competencies</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>potential loss of customer contact</li>\n<li>loss of internal expertise</li>\n<li>information security risks</li>\n<li>hard to control quality and reliability</li>\n</ul></li>\n</ul>\n<p><strong>Global contractors</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> offshore external providers</li>\n<li>Why: globalisation gives access to low-cost labour in countries with a comparative advantage</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>cost saving from lower minimum wages</li>\n<li>specialist labour</li>\n<li>faster through more advanced HR technology</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>complex coordination</li>\n<li>ethical issues may affect CSR</li>\n<li>language or cultural differences affect customer service</li>\n<li>communication issues and time differences affect efficiency</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "I", "name": "Influences", "mn": "SLEETS", "intro": "", "pts": [{"id": "hr-i1", "t": "Stakeholders", "rest": "employers, employees, employer associations, unions, government organisations, society", "subs": [], "mn": "UGEESE", "html": "<p><span class=\"lb def\">Def</span> any individual or group with an interest in or affected by the operations of a business</p>\n<p><span class=\"lb k\">Characteristics and features</span> employers, employees, employer associations, unions, government organisations, society</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Stakeholder</th>\n<th>Def</th>\n<th>How they influence HRM / features</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Employers</td>\n<td>those who control employees, responsible for paying wages and with power to dismiss</td>\n<td>• manage employees (motivation, productivity, feedback, income)<br />\n• implement policies to meet legal regulations (physical and mental duty of care)<br />\n• negotiate agreements, resolve disputes<br />\n• aims: flexibility, customer service, productivity, retention, lower turnover</td>\n</tr>\n<tr>\n<td>Employees</td>\n<td>individuals who provide labour for wages or salaries</td>\n<td>• influence performance, productivity, culture, quality<br />\n• pressure for higher wages, non-monetary benefits, conditions and flexibility, job security, involvement in decisions<br />\n• rights: work, income, duty of care<br />\n• responsibilities: care, skill, good faith, obey reasonable and lawful commands</td>\n</tr>\n<tr>\n<td>Employer associations</td>\n<td>organisations representing and assisting employers</td>\n<td>• advice on awards, unfair dismissal, discrimination<br />\n• act in collective bargaining<br />\n• submissions to FWC on the national minimum wage<br />\n• lobby government<br />\n• e.g. Australian Chamber of Commerce, AMA, Australian Industry Group</td>\n</tr>\n<tr>\n<td>Unions</td>\n<td>employee organisations in an industry, trade or occupation improving wages and conditions</td>\n<td>• promote employee interests<br />\n• negotiate contracts (more favourable)<br />\n• represent in tribunals and courts<br />\n• membership declining (fewer manufacturing jobs, poorly unionised service sector)<br />\n• e.g. NSW Teachers Federation, TWU, AEU</td>\n</tr>\n<tr>\n<td>Government organisations (LEGJI)</td>\n<td>federal and state departments overseeing employment legislation</td>\n<td>• Legislation<br />\n• Economic policies (growth, unemployment, inflation, wage growth)<br />\n• Government agencies (enforce)<br />\n• Judicial system (Federal Court hears industrial action and breaches)<br />\n• Industrial tribunals (unfair dismissal, discrimination)</td>\n</tr>\n<tr>\n<td>Society</td>\n<td>broader community interested in social, environmental and economic impact</td>\n<td>• pressure on gender split, diversity, equal pay<br />\n• demands ethical, fair treatment<br />\n• unresolved disputes affect society (e.g. Qantas pilots' dispute disrupted tourism and the economy)<br />\n• views on discrimination, harassment, unfair conditions</td>\n</tr>\n</tbody>\n</table></div>\n<p><span class=\"lb k\">Government legislation (how)</span></p>\n<ul>\n<li>statutes: laws of Federal and State parliaments framing awards and agreements (WHS, workers' compensation, pay and leave, no discrimination)</li>\n<li>Fair Work Act 2009 (Cth): legislates Fair Work Australia, the FWO and the FWC</li>\n<li>WHS Act 2011 (NSW): protects health, safety and welfare of workers and others in NSW workplaces</li>\n<li>Modern Award: from 2010, minimum terms and conditions (in addition to NES) in an industry (pay, hours, leave)</li>\n<li>Paid Parental Leave Scheme: children born from 1 July 2023, up to 100 days (110 after July 2024) at the national minimum wage ($882 per week)</li>\n</ul>", "related": []}, {"id": "hr-i2", "t": "Legal", "rest": "the current legal framework", "subs": ["the employment contract – common law (rights and obligations of employers and employees), minimum employment standards, minimum wage rates, awards, enterprise agreements, other employment contracts", "occupational health and safety and workers compensation", "antidiscrimination and equal employment opportunity"], "mn": "LEGJI", "html": "<h3>Legal: The Current Legal Framework</h3><p><span class=\"lb def\">Def</span> the law within which businesses operate, led by the Fair Work Act 2009 (Cth)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>primary legislation governing Australian workplaces, foundation for all employment standards</li>\n<li>includes: 12 National Employment Standards (NES); compliance and enforcement (FWC and FWO); rights and responsibilities; terms of unfair dismissal, industrial action and contracts (modern awards, enterprise agreements)</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th></th>\n<th>Fair Work Commission (FWC)</th>\n<th>Fair Work Ombudsman (FWO)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Def</td>\n<td>independent IR tribunal (formerly Fair Work Australia)</td>\n<td>IR regulator that ENFORCES compliance with the Act, related laws, awards and agreements</td>\n</tr>\n<tr>\n<td>Role includes</td>\n<td>• workplace determinations (minimum wages via Minimum Wage Panel)<br />\n• helps bargain in good faith for enterprise agreements<br />\n• hears unfair dismissal claims<br />\n• orders to stop bullying<br />\n• orders on industrial action (strikes, work bans, lock outs)<br />\n• mediation and conciliation</td>\n<td>• information<br />\n• educating on rights and obligations<br />\n• promotes and monitors compliance<br />\n• enforces laws and seeks penalties<br />\n• enforces certain FWC orders</td>\n</tr>\n<tr>\n<td>Role does NOT include</td>\n<td>• advice on award or agreement entitlements<br />\n• enforcing minimum pay and award entitlements</td>\n<td>• unfair dismissal and unlawful termination applications<br />\n• changing legislation, awards or agreements<br />\n• bullying and harassment complaints</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>learn what each can and cannot do: the FWC cannot do what the FWO can, and vice versa</li>\n</ul><h4>The Employment Contract</h4><ul>\n<li><span class=\"lb def\">Def</span> legally binding, formal agreement outlining rights and obligations between employer and employee</li>\n<li>Features: individual or collective (enterprise) agreements; must meet the 12 NES (administered by the FWO); key features: hours, role, remuneration including super, leave, confidentiality (NDAs), grievance procedures</li>\n</ul><h4>Common Law (Rights and Obligations)</h4><ul>\n<li><span class=\"lb def\">Def</span> common law is law made by courts and judges; statute law is made by parliament</li>\n<li>Features: all businesses operate within common and statute law; common law decides if workplace rights and obligations are broken or unfair\n<ul>\n<li>Centralised IR system: disputes go to tribunals such as the FWC for conciliation and arbitration (one entity, usually government)</li>\n<li>Decentralised IR system: wages and conditions negotiated at workplace level by collective or individual bargaining</li>\n</ul></li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th></th>\n<th>Employer</th>\n<th>Employee</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Obligations</td>\n<td>• provide work (pay income even if no work)<br />\n• pay income and reimburse expenses<br />\n• meet IR legislation (EEO, super, anti-discrimination)<br />\n• duty of care (WHS Act 2011: reasonable care, safe system of work)</td>\n<td>• obey lawful and reasonable commands<br />\n• use due care and skill (no negligence)<br />\n• act in good faith (e.g. not taking confidential information to another employer)</td>\n</tr>\n<tr>\n<td>Rights</td>\n<td>• work with care and skill<br />\n• contract conditions met<br />\n• appropriate notice of leave<br />\n• notice periods when leaving</td>\n<td>• paid for time worked<br />\n• paid and unpaid leave<br />\n• at least award or NMW minimums<br />\n• NES minimums</td>\n</tr>\n</tbody>\n</table></div><h4>Minimum Employment Standards (NES)</h4><p><span class=\"lb def\">Def</span> 12 minimum standards under the Fair Work Act that all contracts must meet</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>NES</th>\n<th>Detail</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Maximum weekly hours</td>\n<td>38 hours full-time plus reasonable additional hours</td>\n</tr>\n<tr>\n<td>2 Flexible work requests</td>\n<td>e.g. parents or carers of children under 18</td>\n</tr>\n<tr>\n<td>3 Casual to permanent conversion</td>\n<td>after 12 months employers must offer conversion (small business exempt under 15 employees)</td>\n</tr>\n<tr>\n<td>4 Parent leave</td>\n<td>• 12 months unpaid plus right to request another 12<br />\n• maternity, paternity, adoption leave<br />\n• 26 weeks government Paid Parental Leave at NMW from 1 July 2026</td>\n</tr>\n<tr>\n<td>5 Annual leave</td>\n<td>4 weeks paid per year (certain shift workers get an additional week)</td>\n</tr>\n<tr>\n<td>6 Personal/carer's, compassionate, family and domestic violence leave</td>\n<td>• 10 days paid personal/carer's leave a year<br />\n• 2 days unpaid carer's leave as required<br />\n• 2 days compassionate leave (unpaid for casuals)<br />\n• 5 days unpaid family and domestic violence leave in 12 months</td>\n</tr>\n<tr>\n<td>7 Community service leave</td>\n<td>• unpaid for voluntary emergency activities<br />\n• 10 days paid jury duty (after 10 days unpaid)</td>\n</tr>\n<tr>\n<td>8 Long service leave</td>\n<td>after continuous employment (NSW: 10 years, 8 weeks paid)</td>\n</tr>\n<tr>\n<td>9 Public holidays</td>\n<td>paid day off</td>\n</tr>\n<tr>\n<td>10 Notice of termination and redundancy pay</td>\n<td>• based on length of service<br />\n• up to 4 weeks notice, up to 16 weeks redundancy pay</td>\n</tr>\n<tr>\n<td>11 Superannuation</td>\n<td>right to super contributions, recovery of unpaid super under the Act</td>\n</tr>\n<tr>\n<td>12 Fair Work Information Statement</td>\n<td>given to all new employees about rights and entitlements</td>\n</tr>\n</tbody>\n</table></div><h4>Minimum Wage Rates</h4><ul>\n<li><span class=\"lb def\">Def</span> minimum pay an employer can pay for hours worked, generally set by a modern award, enterprise agreement or the national minimum wage (NMW)</li>\n<li>Features: NMW reviewed yearly by the FWC Minimum Wage Panel; no agreement below it; from 1 July 2026: $26.44 per hour or $1004.90 a week (38 hours)</li>\n<li>Effect: contracts must be updated so pay is not below the new NMW order</li>\n</ul><h4>Awards</h4><ul>\n<li><span class=\"lb def\">Def</span> (modern award) legally binding document with minimum pay and conditions at industry level</li>\n<li>Features: FWC is reducing the number of awards to cut compliance costs; currently 122; e.g. Fast Food Industry Award 2020 (Level 1 $24.73 per hour; under 16 is 40% of adult rate), Medical Practitioners Award 2020 (interns $29.89 per hour, about $59,000 a year)</li>\n</ul><h4>Enterprise Agreements</h4><ul>\n<li><span class=\"lb def\">Def</span> employment contract negotiated between a group of employees (union) and employers at enterprise level</li>\n<li>Features:\n<ul>\n<li>details pay, conditions, dispute resolution</li>\n<li>types: single-enterprise (one employer and its employees); multi-enterprise (two or more employers); greenfields (genuine new enterprise before employees are employed)</li>\n<li>must be approved by the FWC and pass the Better Off Overall Test (BOOT): each employee better off overall than under the modern award</li>\n<li>often depends on the economy (e.g. in a recession usually 1 or 2 years)</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>based on the specific needs of the business, improves flexibility</li>\n<li>gives employees ownership and incentive, improving productivity</li>\n<li>business determines remuneration sizes, reducing costs</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>hard to change once agreed, unresponsive to labour quality or inflation</li>\n<li>negotiation can be lengthy, costly and break down into disputes</li>\n</ul></li>\n</ul><h4>Other Employment Contracts</h4><ul>\n<li>Individual common law contracts: employer and individual negotiate pay and conditions; used by executives and managers in award-free sectors, employers with few employees, sole traders, partnerships, state public services, customised arrangements; cannot be below legislation, award, enterprise agreement or NMW</li>\n<li>Independent contractors: freelancers not legally employees (no leave entitlements, pay own tax); e.g. UberEats drivers</li>\n<li>Casual contracts: short-term, irregular, uncertain; no paid holiday or sick leave; receive a loading</li>\n<li>Part-time contracts: continuing employment, less than 35 hours per week</li>\n</ul><h3>Legal: Occupational Health and Safety and Workers Compensation</h3><h4>Work Health and Safety (WHS)</h4><ul>\n<li><span class=\"lb def\">Def</span> protecting the health and safety of all workplace stakeholders from hazards and risks of work activities</li>\n<li>Features:\n<ul>\n<li>WHS Act 2011 (NSW) introduced due to concerns about high injuries, accidents and diseases</li>\n<li>Safe Work Australia (est. 2009, Safe Work Australia Act 2008): national standards and common approaches, improves WHS and workers' compensation</li>\n<li>SafeWork NSW: state regulator focused on harm prevention and safety culture, gives advice</li>\n<li>businesses must provide: safe premises and facilities; safe machinery and substances; safe systems of work; information, instruction, training, supervision; workers' compensation insurance</li>\n</ul></li>\n<li>How businesses respond: WHS committee meeting regularly; periodic training on reporting and responding to breaches; PPE</li>\n</ul><h4>Workers Compensation</h4><ul>\n<li><span class=\"lb def\">Def</span> benefits for an employee with injury or disease due to work</li>\n<li>Features: enforced through SafeWork NSW\n<ul>\n<li>employers must: take out insurance (premiums rise with claims, so aim for high WHS); keep time and wage records and register injuries; notify insurers within 48 hours; establish injury management and return-to-work plans</li>\n<li>employees must notify the employer as soon as possible</li>\n</ul></li>\n<li>Effects: employer and insurer provide benefits and assistance to recover and return to safe, durable work: weekly payments, medical expenses, lost wages, permanent injury payments, payments to family if the employee dies; common law action possible if negligence caused serious injury or death</li>\n</ul><h3>Legal: Antidiscrimination and Equal Employment Opportunity</h3><h4>Anti-discrimination</h4><ul>\n<li><span class=\"lb def\">Def</span> measures to eliminate unjust treatment of groups based on race, gender, age, sexual preference, religion and disability</li>\n<li>Features: Australian Human Rights Commission can receive, investigate and conciliate complaints</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Act</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Racial Discrimination Act 1975</td>\n<td>illegal to treat unfairly due to race, colour, descent, national or ethnic origin, immigrant status</td>\n</tr>\n<tr>\n<td>Age Discrimination Act 2004</td>\n<td>illegal to treat a person less favourably due to age</td>\n</tr>\n<tr>\n<td>Sex Discrimination Act 1984</td>\n<td>prohibits discrimination by sex, marital or relationship status, pregnancy, sexual orientation, gender identity, intersex status, breastfeeding</td>\n</tr>\n<tr>\n<td>Disability Discrimination Act 1992</td>\n<td>protects everyone against discrimination based on disability</td>\n</tr>\n</tbody>\n</table></div><h4>Equal Employment Opportunity (EEO)</h4><ul>\n<li><span class=\"lb def\">Def</span> equitable policies and practices in recruitment, selection, development and promotion</li>\n<li>Features:\n<ul>\n<li>employers over 100 employees must have an affirmative action program and report to the Workplace Gender Equality Agency (WGEA)</li>\n<li>affirmative action: measures to eliminate direct and indirect discrimination and overcome lack of EEO for women</li>\n<li>employers must follow EEO legislation (Workplace Gender Equality Act 2012, Human Rights and Equal Opportunity Commission Act 1986, Affirmative Action (EEO for Women) Act 1986) and give equal pay and conditions for work of similar value</li>\n<li>the Affirmative Action Act 1986 was replaced by the Workplace Gender Equality Act 2012 (multiple-choice may use either, textbook outdated)</li>\n<li>WGE Act applies to businesses and universities over 100 employees; promotes gender equality (the Sex and Racial Discrimination Acts focus on breaches); promotes positive discrimination (a female may be chosen even if not the best candidate)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "hr-i3", "t": "Economic", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> changes in the level of spending in an economy due to recessions and booms</p>\n<p><span class=\"lb k\">Characteristics and features</span> impacts HRM through the economic cycle, structural changes and globalisation</p>\n<p><strong>The Economic Cycle</strong></p>\n<ul>\n<li>Expansion (boom): demand for labour up (more production); wage growth up as employers compete, employees have more bargaining power</li>\n<li>Contraction (recession): demand for labour down; wage growth falls; employers may downsize workforce or hours</li>\n</ul>\n<p><strong>Structural Changes</strong></p>\n<ul>\n<li>growth in services sector → training and development to upskill in service and customer service (Development)</li>\n<li>ageing population → demand for flexible arrangements and casualisation (Maintenance, non-monetary benefits)</li>\n<li>decline in manufacturing (less government protection) → lower employment and wage growth → Separation, involuntary redundancies</li>\n</ul>\n<p><strong>Globalisation</strong></p>\n<ul>\n<li>greater integration → more competition: firms must attract and retain skills, lift productivity and customer service, cut costs</li>\n<li>allows offshore outsourcing of HR functions: monitor contractors for skills, training and exploitation (reputation risk)</li>\n</ul>", "related": []}, {"id": "hr-i4", "t": "Technological", "rest": "", "subs": [], "mn": "HEAD", "html": "<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>technology increases productivity and communication\n<ul>\n<li>staff need training (WHS compliance)</li>\n<li>may replace labour (robotics) → redundancy payments</li>\n</ul></li>\n<li>enables telecommuting and work from home\n<ul>\n<li>HR must keep work-life balance; clear, flexible WFH policies (non-monetary benefits) can raise productivity, cut costs and lift profitability</li>\n</ul></li>\n<li>can use Operations knowledge but MUST explicitly link to HR processes</li>\n</ul>", "related": []}, {"id": "hr-i5", "t": "Social", "rest": "changing work patterns, living standards", "subs": [], "mn": "CL", "html": "<p><strong>Changing Work Patterns</strong></p>\n<ul>\n<li>Movement away from full-time work: services sector (86% of workforce) → more part-time and casual work; employees want work-life balance; employers avoid on-costs (annual and sick leave) with casuals</li>\n<li>Increased participation rates for women: larger workforce and applicant pool</li>\n<li>Career flexibility and job mobility: employees work across businesses and industries → firms need to retain staff and cut turnover</li>\n<li>Ageing population: labour shortage → train younger staff, offer flexibility to retain older staff</li>\n</ul>\n<p><strong>Living Standards</strong></p>\n<ul>\n<li>HRM influences living standards through wage increases, performance bonuses, fringe benefits, leave entitlements</li>\n<li>casualisation and offshore outsourcing to cut costs face resistance from unions and others (lowers domestic employees' living standards)</li>\n<li>2010 Australian Government report concerns: rising income inequality (real wage growth slower than profits); gender pay gap of 16%; casualisation (16% part-time or casual) hurting incomes</li>\n</ul>\n<p><span class=\"lb how\">How HRM manages social influences</span></p>\n<ul>\n<li>workplace flexibility; childcare facilities, WFH, childcare discounts; job-sharing</li>\n<li>target females during acquisition and development to improve equity in senior roles</li>\n<li>career flexibility and career breaks; transition of older workers (training, development, flexibility)</li>\n</ul>", "related": []}, {"id": "hr-i6", "t": "Ethics and corporate social responsibility", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> open and accountable business actions that are ethical and respectful to society, doing more than just legal compliance</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>HOW 1 (pay): legal: pay at or above the modern award (accounts for NMW and NES); ethical: enterprise agreement, employee involvement in negoti
