<title>HSC Business Hub</title>

<style>
/* Layout: Notion-style workspace (shared with the English hub). Quiet grey sidebar page tree, white page with a
   centred 720px reading column, page properties, callouts, toggles and table views. */
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --hover:rgba(55,53,47,.06); --active:rgba(55,53,47,.09);
  --line:rgba(55,53,47,.12); --ink:#37352F; --muted:rgba(55,53,47,.62); --faint:rgba(55,53,47,.42);
  --callout:#F1F1EF; --link:#2F6E9E; --shadow:rgba(15,15,15,.12);
  /* Notion-style tag colours: background / text */
  --t-gray:#E3E2E0;   --tx-gray:#32302C;
  --t-brown:#EEE0DA;  --tx-brown:#442A1E;
  --t-orange:#FADEC9; --tx-orange:#49290E;
  --t-yellow:#FDECC8; --tx-yellow:#402C1B;
  --t-green:#DBEDDB;  --tx-green:#1C3829;
  --t-blue:#D3E5EF;   --tx-blue:#183347;
  --t-purple:#E8DEEE; --tx-purple:#412454;
  --t-pink:#F5E0E9;   --tx-pink:#4C2337;
  --t-red:#FFE2DD;    --tx-red:#5D1715;
  --f-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
  --f-quote: "Iowan Old Style", Charter, "Bitstream Charter", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09); --ink:rgba(255,255,255,.86); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.34);
  --callout:#252525; --link:#79B4E0; --shadow:rgba(0,0,0,.5);
  --t-gray:#373737;   --tx-gray:rgba(255,255,255,.86);
  --t-brown:#4A3A31;  --tx-brown:#E6D3C7;
  --t-orange:#5C3B23; --tx-orange:#F2CDAE;
  --t-yellow:#564328; --tx-yellow:#F1DFB4;
  --t-green:#243D30;  --tx-green:#C3E3CC;
  --t-blue:#143A4E;   --tx-blue:#BDDCEE;
  --t-purple:#3C2D49; --tx-purple:#DCCBEB;
  --t-pink:#4E2C3C;   --tx-pink:#F0C9DA;
  --t-red:#522E2A;    --tx-red:#F5C9C2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09); --ink:rgba(255,255,255,.86); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.34);
  --callout:#252525; --link:#79B4E0; --shadow:rgba(0,0,0,.5);
  --t-gray:#373737;   --tx-gray:rgba(255,255,255,.86);
  --t-brown:#4A3A31;  --tx-brown:#E6D3C7;
  --t-orange:#5C3B23; --tx-orange:#F2CDAE;
  --t-yellow:#564328; --tx-yellow:#F1DFB4;
  --t-green:#243D30;  --tx-green:#C3E3CC;
  --t-blue:#143A4E;   --tx-blue:#BDDCEE;
  --t-purple:#3C2D49; --tx-purple:#DCCBEB;
  --t-pink:#4E2C3C;   --tx-pink:#F0C9DA;
  --t-red:#522E2A;    --tx-red:#F5C9C2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--link);outline-offset:1px;border-radius:4px}
mark{background:var(--t-yellow);color:inherit;border-radius:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:10px 8px 24px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;border-radius:6px}
.ws .av{width:22px;height:22px;border-radius:4px;background:var(--t-brown);color:var(--tx-brown);display:grid;place-items:center;font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:4px 8px;border-radius:6px;text-decoration:none;color:var(--muted);text-align:left}
.row:hover{background:var(--hover)}
.row[aria-current="page"]{background:var(--active);color:var(--ink);font-weight:500}
.row .kbd{margin-left:auto;font-size:12px;color:var(--faint)}
.row .sw{margin-left:auto;width:26px;height:15px;border-radius:999px;background:var(--active);position:relative;transition:background .15s}
.row .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px var(--shadow);transition:transform .15s}
.row[aria-pressed="true"] .sw{background:var(--link)}
.row[aria-pressed="true"] .sw::after{transform:translateX(11px)}
.grp{font-size:12px;font-weight:500;color:var(--faint);padding:14px 8px 4px}
.row .pg{color:var(--ink)}
.row .sub{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:4;background:var(--bg);height:45px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{text-decoration:none;padding:2px 6px;border-radius:4px}
.crumbs a:hover{background:var(--hover)}
.crumbs .cur{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;padding:4px;border-radius:4px;color:var(--muted)}
.menu-btn:hover{background:var(--hover)}

/* Page */
.page{max-width:720px;margin:0 auto;padding:56px 24px 120px}
.page h1.title{font-size:40px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
.props{display:grid;gap:2px;margin-bottom:20px;font-size:14px}
.prop{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:34px}
.prop .k{display:flex;align-items:center;gap:6px;color:var(--muted)}
.prop .k svg.i{width:15px;height:15px}
.prop .v{padding:4px 6px;min-width:0}
.divider{border:0;border-top:1px solid var(--line);margin:8px 0 22px}

.page h2{font-size:24px;margin:32px 0 6px;scroll-margin-top:60px}
.page h3{font-size:19px;margin:22px 0 4px}
.page p{margin:3px 0}
.muted{color:var(--muted)}

.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:13px;line-height:1;white-space:nowrap;margin:2px 4px 2px 0}

.callout{display:flex;gap:10px;background:var(--callout);border-radius:4px;padding:16px 16px 16px 12px;margin:10px 0}
.callout .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted)}
.callout .ct{min-width:0;display:grid;gap:4px}
.callout b.lbl{font-weight:600}

.quote{border-left:3px solid currentColor;padding:2px 14px;margin:8px 0;font-family:var(--f-quote);font-size:18px}

ol.num,ul.num{margin:6px 0 4px;padding-left:26px;display:grid;gap:4px}
ol.num li::marker,ul.num li::marker{color:var(--muted)}

/* Toggle blocks */
details.tg{margin:2px 0;border-radius:4px}
details.tg>summary{list-style:none;display:flex;gap:6px;align-items:flex-start;cursor:pointer;padding:3px 2px;border-radius:4px}
details.tg>summary::-webkit-details-marker{display:none}
details.tg>summary:hover{background:var(--hover)}
details.tg>summary .tri{flex:none;width:22px;height:24px;display:grid;place-items:center;color:var(--ink);transition:transform .15s}
details.tg[open]>summary .tri{transform:rotate(90deg)}
details.tg>summary .sm{min-width:0}
details.tg>summary .sm b{font-weight:600}
details.tg>summary .sm .q{font-family:var(--f-quote);font-size:17px}
details.tg>.body{padding:2px 0 10px 30px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:15px}
.kv .k{color:var(--muted);font-size:14px;padding-top:1px}
.line{font-family:var(--f-quote);font-size:17px;background:var(--callout);border-radius:4px;padding:10px 14px}

/* Table view */
.tbl-wrap{overflow-x:auto;margin:8px 0 4px}
table.db{width:100%;border-collapse:collapse;font-size:14px}
table.db th{font-weight:400;color:var(--muted);text-align:left;padding:7px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.db th svg.i{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
table.db td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.db th+th,table.db td+td{border-left:1px solid var(--line)}
table.db.two td:first-child{width:32%}
table.db td.q{font-family:var(--f-quote);font-size:15.5px;width:38%}
table.db td.e{width:38%}
table.db .ctx{display:block;margin-top:4px;color:var(--muted);font-size:13px}
table.db tbody tr:hover{background:var(--hover)}

/* Home: database list */
.list{border-top:1px solid var(--line);margin:6px 0 4px}
.list a{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.list a:hover{background:var(--hover)}
.list .nm{font-weight:500;flex:none}
.list .ds{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.list .tag{flex:none}

/* Empty */
.empty{color:var(--faint);padding:6px 2px}

/* Recall mode: blur analysis until clicked */
body.recall .rv{filter:blur(5px);opacity:.6;cursor:pointer;transition:filter .15s,opacity .15s;user-select:none}
body.recall .rv.shown{filter:none;opacity:1;user-select:auto}

/* Search modal */
.scrim[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(15,15,15,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.modal{background:var(--bg);width:100%;max-width:620px;border-radius:10px;box-shadow:0 12px 40px var(--shadow),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.modal .inp{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.modal input{flex:1;min-width:0;font:17px var(--f-ui);color:var(--ink);background:none;border:0;outline:none}
.modal .res{overflow-y:auto;padding:6px}
.modal .hd{font-size:12px;color:var(--faint);padding:8px 10px 4px}
.hit{display:grid;gap:2px;padding:8px 10px;border-radius:6px;text-decoration:none}
.hit:hover,.hit.sel{background:var(--hover)}
.hit .t{font-weight:500;font-size:14.5px}
.hit .w{font-size:12px;color:var(--faint)}
.hit .s{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,85vw);z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
  body.nav-open .side{transform:none}
  .menu-btn{display:block}
  .topbar{top:env(safe-area-inset-top,0px)}
  .page{padding:28px 16px 100px}
  .page h1.title{font-size:32px}
  .prop{grid-template-columns:110px minmax(0,1fr)}
  table.db thead{display:none}
  table.db,table.db tbody,table.db tr,table.db td{display:block;width:auto!important}
  table.db tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.db td{border:0!important;padding:3px 0}
  .list .ds{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Business hub additions ---- */
.row.sub-row{padding-left:34px;min-height:26px;font-size:13.5px}
.row .ltr{width:18px;text-align:center;font-weight:600;color:var(--faint);flex:none}
.row[aria-current="page"] .ltr{color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:6px;padding:8px 10px;text-decoration:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs b{font-weight:700}

.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:14px;color:var(--muted)}
.tools button{padding:3px 8px;border-radius:4px;color:var(--muted)}
.tools button:hover{background:var(--hover);color:var(--ink)}

details.pt{border-bottom:1px solid var(--line)}
details.pt>summary{list-style:none;display:flex;gap:6px;align-items:flex-start;cursor:pointer;padding:10px 2px;border-radius:4px}
details.pt>summary::-webkit-details-marker{display:none}
details.pt>summary:hover{background:var(--hover)}
details.pt>summary .tri{flex:none;width:22px;height:26px;display:grid;place-items:center;transition:transform .15s}
details.pt[open]>summary .tri{transform:rotate(90deg)}
details.pt .st{min-width:0;flex:1;display:grid;gap:2px}
details.pt .st .t{font-size:18px;font-weight:600;line-height:1.35}
details.pt .st .r{font-size:14px;color:var(--muted)}
details.pt .st .meta{display:flex;flex-wrap:wrap;gap:0 4px;align-items:center}
details.pt .cnt{font-size:12px;color:var(--faint)}
.pt-body{padding:2px 0 22px 28px;min-width:0}
.syl{background:var(--callout);border-radius:4px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.syl .h{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.syl ul{margin:0;padding-left:18px}

.notes{font-size:15px;min-width:0}
.notes h3{font-size:17px;font-weight:600;margin:22px 0 6px}
.notes h4{font-size:15px;font-weight:600;margin:16px 0 4px}
.notes>h3:first-child,.notes>h4:first-child{margin-top:4px}
.notes p{margin:6px 0}
.notes ul{margin:4px 0;padding-left:22px}
.notes li{margin:2px 0}
.notes li::marker{color:var(--faint)}
.notes table.db td{font-size:14px}
.notes table.db th{white-space:normal}
.notes .callout{margin:10px 0}

.lb{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:12.5px;font-weight:500;line-height:1;white-space:nowrap;margin-right:6px;vertical-align:1px}
.lb.def{background:var(--t-blue);color:var(--tx-blue)}
.lb.how{background:var(--t-yellow);color:var(--tx-yellow)}
.lb.pos{background:var(--t-green);color:var(--tx-green)}
.lb.neg{background:var(--t-red);color:var(--tx-red)}
.lb.k{background:var(--t-gray);color:var(--tx-gray)}
.lb.tip{background:var(--t-purple);color:var(--tx-purple)}

.gap{color:var(--faint);font-size:15px;display:grid;gap:6px}
.gap a{color:var(--link);text-decoration:none}
.intro{font-size:15px}
.intro ul{margin:4px 0;padding-left:22px}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:10px 0 20px}
.kcard{display:grid;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:14px 16px;transition:background .12s}
.kcard:hover{background:var(--hover)}
.kcard .n{font-weight:600;font-size:16px}
.kcard .secs{display:flex;flex-wrap:wrap;gap:4px}
.kcard .secs a,.kcard .secs span{font-size:13px}
.kcard .c{font-size:13px;color:var(--muted)}
.lb{white-space:normal;height:auto;min-height:20px;padding-block:2px;line-height:1.25}
@media (max-width:860px){
  .notes table.db{display:table;min-width:560px}
  .notes table.db thead{display:table-header-group}
  .notes table.db tbody{display:table-row-group}
  .notes table.db tr{display:table-row;padding:0}
  .notes table.db td{display:table-cell;border-bottom:1px solid var(--line)!important;padding:8px!important}
  .notes table.db td+td,.notes table.db th+th{border-left:1px solid var(--line)!important}
  .pt-body{padding-left:8px}
}
</style>

<script>

const KBFS = [{"id": "finance", "name": "Finance", "short": "Finance", "secs": [{"key": "R", "name": "Role", "mn": "", "intro": "", "pts": [{"id": "finance-r1", "t": "Strategic role of financial management", "rest": "", "subs": [], "mn": "PEGSL, PEGL, PEGS", "html": "<p><span class=\"lb def\">Def</span> determining and managing the financial resources needed to achieve short-term and long-term objectives (PEGSL)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Key areas: sourcing of finance, budgeting and cash flow, audited financial statements</li>\n<li>Other KBFs are interdependent on Finance to achieve their objectives</li>\n</ul>", "related": []}, {"id": "finance-r2", "t": "Objectives of financial management", "rest": "", "subs": ["profitability, growth, efficiency, liquidity, solvency", "short-term and long-term"], "mn": "", "html": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> link explicitly to these objectives in Section III and IV responses</p></div></div>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Objective</th>\n<th>Def</th>\n<th>How / features</th>\n<th>Measured by</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Profitability (ST and LT)</td>\n<td>money made from operations after all expenses</td>\n<td>increase revenue: change marketing or pricing policies</td>\n<td>• Gross Profit Ratio = Gross Profit ÷ Sales<br />\n• Net Profit Ratio = Net Profit ÷ Sales</td>\n</tr>\n<tr>\n<td>Efficiency (ST and LT)</td>\n<td>maximising return from assets with minimal costs</td>\n<td>minimise expenses: processes that avoid wasting resources</td>\n<td>• Expense Ratio = Expenses ÷ Revenue<br />\n• Accounts Receivable Turnover = Sales ÷ Accounts Receivable</td>\n</tr>\n<tr>\n<td>Growth (LT)</td>\n<td>ability to expand activities</td>\n<td>• increased production, higher sales, expanded product range<br />\n• organically or by merging/acquiring</td>\n<td>links: bigger premises (Sources of Finance), increasing sales (Sources of Finance, Marketing), market share (Marketing), exporting (Sources of Finance, GFM)</td>\n</tr>\n<tr>\n<td>Solvency (LT)</td>\n<td>ability to meet financial commitments in the long term (over 12 months)</td>\n<td>reliance on debt over equity = \"highly geared\" = reduced solvency</td>\n<td>• Gearing Ratio = Debt ÷ Equity<br />\n• benchmark 1:1</td>\n</tr>\n<tr>\n<td>Liquidity (ST)</td>\n<td>enough cash for day-to-day activities and short-term debts (under 12 months)</td>\n<td>• quicker an asset turns into cash = more liquid<br />\n• cash in bank is most liquid</td>\n<td>• Liquidity Ratio = Current Assets ÷ Current Liabilities<br />\n• benchmark 2:1</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Tip:</b> knowing the formula is good, interpreting the ratio is what matters</p></div></div><h3>Short-term vs Long-term Objectives</h3><ul>\n<li>short-term: one to two years, reviewed regularly</li>\n<li>long-term: more than five years, broader goals, reviewed annually</li>\n<li>ST and LT: Profitability, Efficiency; LT only: Growth, Solvency; ST only: Liquidity</li>\n</ul><h3>Conflicts Between Objectives</h3><ul>\n<li>Short-term Profitability vs Growth: growth costs a lot short term (e.g. R&amp;D) → expenses up → profitability down → positive for growth in the long term</li>\n<li>Solvency vs Growth: borrow (more debt) to expand → achieves growth → increasing reliance on debt → solvency down</li>\n</ul>", "related": []}, {"id": "finance-r3", "t": "Interdependence with other key business functions", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> HR, Operations and Marketing rely on Finance for funding and financial information</p>\n<ul>\n<li>Finance and Operations:\n<ul>\n<li>funds production (raw materials, inputs, equipment) → Operations can produce</li>\n<li>sets production targets and costs → Operations works to them → profits achieved</li>\n<li>monitors efficiency and expenses → Operations adjusts</li>\n</ul></li>\n<li>Finance and Marketing:\n<ul>\n<li>provides sales data and reports → Marketing analyses the market</li>\n<li>sets budgets → funds advertising and promotions</li>\n<li>sets sales targets → Marketing works to them → profit achieved</li>\n</ul></li>\n<li>Finance and HR:\n<ul>\n<li>provides funds → HR runs recruitment</li>\n<li>budget for wages and bonuses → HR rewards staff</li>\n<li>funds training and development → HR performs or organises it</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "I", "name": "Influences", "mn": "", "intro": "", "pts": [{"id": "finance-i1", "t": "Internal sources of finance", "rest": "retained profits", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> funds from the business owners or from business activities (retained profits)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Retained profits: profits reinvested rather than paid out as dividends</li>\n<li>Owner's equity: funds contributed by owners to establish or grow the business</li>\n<li>link to PEGSL</li>\n</ul>\n<p><span class=\"lb k\">Retained profits</span></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>no interest repayments (lower expenses)</li>\n<li>improves gearing and solvency</li>\n<li>does not dilute ownership</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>limited as it depends on profits</li>\n<li>less dividends (shareholders dissatisfied), discourages new investment</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-i2", "t": "External sources of finance", "rest": "", "subs": ["debt – short-term borrowing (overdraft, commercial bills, factoring), long-term borrowing (mortgage, debentures, unsecured notes, leasing)", "equity – ordinary shares (new issues, rights issues, placements, share purchase plans), private equity"], "mn": "COF, MUDL, NSPR, PE", "html": "<p><span class=\"lb def\">Def</span> funds obtained from outside the business</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Debt: short-term (COF) and long-term (MUDL)</li>\n<li>Equity: ordinary shares (SPRN) and private equity</li>\n<li>short-term: generally 1 to 2 years</li>\n<li>long-term: generally more than 2 years, usually for real estate, factory, offices, capital equipment</li>\n</ul><h3>Debt</h3><p><span class=\"lb def\">Def</span> funds borrowed from a creditor, short-term or long-term</p>\n<p><span class=\"lb pos\">Generic positives (any debt)</span></p>\n<ul>\n<li>funds readily available (given bank approval)</li>\n<li>interest is tax deductible</li>\n<li>does not dilute ownership</li>\n</ul>\n<p><span class=\"lb neg\">Generic negatives (any debt)</span></p>\n<ul>\n<li>must be repaid</li>\n<li>interest paid regardless of profitability, reduces profitability</li>\n<li>increases gearing, decreases solvency</li>\n</ul>\n<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Tip:</b> prioritise specific points over generic ones where possible</p></div></div><h4>Short-term Debt (COF)</h4><p><strong>Commercial Bills</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> short-term debt instrument issued by financial institutions for amounts over $100k, for an agreed interest rate and period</li>\n<li>Features: usually 30 to 180 days; interest relatively high at 3 to 4% (higher with bank's perceived risk); assists purchase of inventory and paying overdue suppliers</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>substantial funding for large amounts</li>\n<li>cheapest form of ST finance (lower than overdrafts)</li>\n<li>flexible repayment (principal and term adjusted at each rollover)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high interest and establishment fees, especially without a track record</li>\n<li>missed payments hurt credit rating</li>\n</ul></li>\n</ul>\n<p><strong>Overdraft</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> short-term debt allowing a business to overdraw its account to a predetermined limit for an agreed period</li>\n<li>Features: usually under $100k; high interest (over 10%); overcomes short-term liquidity problems; assists purchase of inventory and paying overdue suppliers</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>available at short notice (given bank approval) for cash flow gaps or urgent expenses</li>\n<li>interest paid only on the amount drawn (cost-effective if managed well)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>very high interest (especially unsecured) plus establishment fees</li>\n<li>missed payments hurt credit rating</li>\n</ul></li>\n</ul>\n<p><strong>Factoring</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> selling accounts receivable to a factoring/finance company at a discounted price</li>\n<li><span class=\"lb how\">How</span> immediate cash from unpaid invoices instead of waiting for debtors; factoring company collects payment</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>instant cash for obligations</li>\n<li>avoids cost of chasing bad debt</li>\n<li>focus on core functions (outsources collection)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>receives only 80 to 90% of AR (sacrifices profit for speed)</li>\n<li>aggressive collection may harm customer relationships</li>\n</ul></li>\n</ul><h4>Long-term Debt (MUDL)</h4><p><strong>Mortgage</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> long-term debt secured by the borrower's property</li>\n<li>Features: used to buy premises, factory, office; usually 15 to 30 years</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>large capital for property, production and expansion</li>\n<li>lower interest (secured against property)</li>\n<li>asset appreciation increases capital, positive for solvency and borrowing capacity</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> exposed to interest rate changes (especially variable), harder to forecast cash flow</li>\n</ul>\n<p><strong>Debenture</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> long-term debt issued to public investors at a specific interest rate and fixed loan period</li>\n<li>Features: usually secured by company assets; prospectus (use of funds, borrowing terms) lodged with ASIC</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>significant funds for expansion</li>\n<li>does not dilute ownership</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> prospectus reveals intended use of funds, can expose strategic plan to competitors</li>\n</ul>\n<p><strong>Unsecured Notes</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> long-term debt issued to public investors, not secured by an asset</li>\n<li>Features: fund acquisitions or share repurchases; credit rating and reputation critical; higher interest than debentures; prospectus required</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>significant funds for expansion</li>\n<li>no security required</li>\n<li>does not dilute ownership</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>higher interest (no security)</li>\n<li>undersubscription may occur (credit rating important)</li>\n</ul></li>\n</ul>\n<p><strong>Leasing</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> payment for the use of assets owned by another party for an agreed period</li>\n<li>Features: equipment, property, motor vehicles; financial lease (ownership transferred at end) vs operating lease (use only); assume operating unless specified</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>use of asset without large initial outlay</li>\n<li>easier to upgrade at end</li>\n<li>lease payments tax deductible</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>no ownership, no benefit from appreciation</li>\n<li>total long-term cost may exceed buying</li>\n<li>breaking early may mean paying the whole term</li>\n</ul></li>\n</ul><h3>Equity (SPRN and Private Equity)</h3><p><span class=\"lb def\">Def</span> funds raised by selling ownership shares, often to the public through the ASX</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>ordinary shares: New Issue, Rights Issue, Placements, Share Purchase Plan; plus private equity</li>\n</ul>\n<p><span class=\"lb pos\">Generic positives (any equity)</span></p>\n<ul>\n<li>does not have to be repaid (unless owner leaves)</li>\n<li>no interest, dividends optional</li>\n<li>increases equity, decreases gearing, improves solvency (lower risk)</li>\n</ul>\n<p><span class=\"lb neg\">Generic negatives (any equity)</span></p>\n<ul>\n<li>undersubscription may leave insufficient capital to expand</li>\n<li>dilutes ownership, may lead to loss of control</li>\n</ul>\n<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Tip:</b> prioritise specific points over generic ones where possible</p></div></div>\n<p><strong>New Issue</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> shares issued and sold for the first time on the primary market (ASX)</li>\n<li>Features: IPO is the first public offering; existing companies may do additional new issues; prospectus lodged with ASIC</li>\n<li><span class=\"lb pos\">Positives</span> access to significant funds for growth</li>\n<li><span class=\"lb neg\">Negatives</span> prospectus and IPO cost and time intensive</li>\n</ul>\n<p><strong>Rights Issue</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> new shares offered to existing shareholders in proportion to current ownership</li>\n<li>Features: occurs after IPOs; requires a prospectus; often discounted</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>no shareholder approval if under 15% of market value</li>\n<li>easier and faster (shareholders already know the business)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>value of each share reduced</li>\n<li>prospectus cost and time intensive</li>\n</ul></li>\n</ul>\n<p><strong>Placements</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> additional shares offered to specific institutions or corporate investors targeted by the business</li>\n<li>Features: no prospectus; no shareholder approval if under 15% of market value</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>no prospectus or approval hurdles</li>\n<li>can prevent hostile takeover bids</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>value of each share reduced</li>\n<li>not favoured by existing shareholders (dilutes them)</li>\n</ul></li>\n</ul>\n<p><strong>Share Purchase Plan</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> existing shareholders in a listed company offered more shares without brokerage fees</li>\n<li>Features: no prospectus (under $30k per shareholder); shares often discounted</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>no prospectus under $30k per investor</li>\n<li>less cost and time than IPOs</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>brokerage costs increase expenses</li>\n<li>dilutes existing large shareholders</li>\n</ul></li>\n</ul>\n<p><strong>Private Equity</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> funds invested in a private company (not listed on ASX)</li>\n<li>Features: venture capitalists, PE firms or partners; private companies only</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>potential for significant funds</li>\n<li>less cost and time than IPOs</li>\n<li>PE firms offer advice and expertise</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>dilution and loss of control</li>\n<li>conflict in strategic direction with PE firm</li>\n<li>partners may have limited funds</li>\n</ul></li>\n</ul><h3>Summary: Debt vs Equity</h3><div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th></th>\n<th>Debt</th>\n<th>Equity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Risk</td>\n<td>higher risk, higher gearing, negative for solvency</td>\n<td>lower risk, lower gearing, positive for solvency</td>\n</tr>\n<tr>\n<td>Repayments</td>\n<td>compulsory interest and principal regardless of profitability</td>\n<td>none compulsory (unless owner leaves), dividends voluntary</td>\n</tr>\n<tr>\n<td>Control</td>\n<td>owners keep control, ownership unchanged</td>\n<td>dilutes ownership, may hurt control</td>\n</tr>\n</tbody>\n</table></div>\n<p><span class=\"lb k\">Similarities</span> both give access to significant funds for operations and expansion; both require convincing external parties of viability (prospectus to public investors, loan application to a financial institution)</p>", "related": []}, {"id": "finance-i3", "t": "Financial institutions", "rest": "banks, investment banks, finance companies, superannuation funds, life insurance companies, unit trusts and the Australian Securities Exchange", "subs": [], "mn": "BUSFAIL", "html": "<p><span class=\"lb def\">Def</span> 7 key institutions that provide finance and services to businesses</p>\n<p><span class=\"lb how\">How they influence businesses</span> provide debt and equity finance for establishment or expansion (Growth)</p>\n<p><span class=\"lb k\">Why</span> earn income through interest and fees; provide returns to businesses through investment profit and dividends</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Institution</th>\n<th>Def</th>\n<th>Features and examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Banks</td>\n<td>short and long-term debt finance</td>\n<td>• loans, credit cards, deposit accounts<br />\n• profit from low-interest savings and higher-rate lending<br />\n• CBA, Westpac, NAB, ANZ</td>\n</tr>\n<tr>\n<td>Investment Banks</td>\n<td>specialist banks providing debt and equity financing</td>\n<td>• trade money, securities, financial futures<br />\n• assist mergers and acquisitions<br />\n• long-term finance for expansion<br />\n• Macquarie, Goldman Sachs, JPMorgan</td>\n</tr>\n<tr>\n<td>Finance Companies</td>\n<td>non-bank intermediaries for smaller business finance (short to medium-term debt)</td>\n<td>• raise money via share issues and debentures<br />\n• personal and secured loans, lease financing, factoring<br />\n• GE Capital, Latitude<br />\n• positive: fast access<br />\n• negative: interest higher than banks</td>\n</tr>\n<tr>\n<td>Life Insurance Companies</td>\n<td>non-bank intermediaries giving cover and a lump sum on death or TPD</td>\n<td>• lend to corporates using premiums (commercial bills, debentures, leasing)<br />\n• equity and debt, interest higher than banks<br />\n• AMP, AIA, MLC</td>\n</tr>\n<tr>\n<td>Superannuation Funds</td>\n<td>invest Australians' compulsory retirement savings</td>\n<td>• long-term securities: shares, government and company debt (bonds)<br />\n• compulsory super 11% from July 2023 (12% by 2025)<br />\n• AustralianSuper, UniSuper</td>\n</tr>\n<tr>\n<td>Unit Trusts</td>\n<td>pool small investors' funds into specific financial assets (money market, shares, property)</td>\n<td>• trustee controls the trust<br />\n• property, fixed interest, equity, mortgage trusts<br />\n• Vanguard</td>\n</tr>\n<tr>\n<td>Australian Securities Exchange (ASX)</td>\n<td>largest stock exchange in Australia: shares, futures, ETFs</td>\n<td>• primary market: initial sale of instruments<br />\n• secondary market: trading between shareholders<br />\n• positives: large funds, no extra gearing<br />\n• negatives: IPO expenses, prospectus time and cost</td>\n</tr>\n</tbody>\n</table></div>", "related": []}, {"id": "finance-i4", "t": "Influence of government", "rest": "Australian Securities and Investment Commission, company taxation", "subs": [], "mn": "AC", "html": "<p><span class=\"lb how\">How</span> regulations and policies affect the finance function through ASIC and changes to company tax</p><h3>Australian Securities and Investments Commission (ASIC)</h3><ul>\n<li><span class=\"lb def\">Def</span> independent government body regulating corporations, markets and financial services by enforcing the Corporations Act 2001</li>\n<li>Features: protects consumers in investment, insurance, super and banking</li>\n<li><span class=\"lb how\">How</span> government gives it powers to investigate matters and determine remedies (fines, imprisonment); enforces disclosure, share issue and takeover procedures</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>timely, accurate financial statements</li>\n<li>reduces fraudulent or unfair practices</li>\n<li>transparency in financial reporting</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>non-compliance means fines and negative corporate image</li>\n<li>compliance costs</li>\n</ul></li>\n</ul><h3>Company Tax</h3><ul>\n<li><span class=\"lb def\">Def</span> direct tax of 30% on incorporated companies (revenue over $50m); under $50m is 25%</li>\n<li><span class=\"lb how\">How</span> government changes tax legislation through parliament; ATO collects tax and administers GST, corporate tax and super; the tax rate itself can be the \"how\"</li>\n<li>MAAL (Multinational Anti-Avoidance Law): targets TNCs over $1b suspected of diverting profits to low-tax countries → ATO audits → company tax, withholding tax and penalties if proven</li>\n<li>Diverted Profits Tax (DPT): 40% on diverted profits, TNCs with global turnover over $1b</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>tax funds infrastructure, may improve operations</li>\n<li>high rates encourage legal tax minimisation, may free resources for expansion</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>less retained profits and lower dividends</li>\n<li>failure to pay may mean fines, fees or imprisonment</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-i5", "t": "Global market influences", "rest": "economic outlook, availability of funds, interest rates", "subs": [], "mn": "IEA", "html": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> GLOBAL market influences, so economic outlook must be the GLOBAL economic outlook</p></div></div>\n<p><strong>Interest Rates</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> cost of borrowing money, or return on investment; global rates differ, AU traditionally higher</li>\n<li>global rates lower than domestic:\n<ul>\n<li>Positive: borrow overseas → lower interest repayments → higher profits</li>\n<li>Negative: exposed to exchange rate movements, may offset the lower rate</li>\n</ul></li>\n<li>global rates higher than domestic:\n<ul>\n<li>Positive: borrow domestically → lower interest repayments → higher profits</li>\n<li>Negative: more borrowing → more debt → worse solvency</li>\n</ul></li>\n</ul>\n<p><strong>Global Economic Outlook</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> expected changes in economic growth worldwide affecting local business decisions</li>\n<li>negative outlook:\n<ul>\n<li>Negative: ↓ consumer confidence → ↓ demand → ↓ sales → ↓ production and expansion</li>\n<li>Negative: ↓ business confidence → ↓ capital investment and foreign expansion</li>\n<li>Positive: interest rates may fall in contractions, cheaper loans</li>\n</ul></li>\n<li>positive outlook:\n<ul>\n<li>Positive: ↑ consumer confidence → ↑ demand → ↑ sales → ↑ production and expansion</li>\n<li>Positive: ↑ business confidence → ↑ capital investment and foreign expansion (Growth)</li>\n<li>Negative: interest rates may rise in booms, higher repayments</li>\n</ul></li>\n</ul>\n<p><strong>Availability of Funds</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> ease of accessing funds from international financial markets; affected by risk, supply of funds and economic conditions (e.g. GFC, COVID)</li>\n<li>low availability:\n<ul>\n<li>Negative: harder to access debt for expansion (Growth)</li>\n<li>Negative: higher interest, higher borrowing cost, lower profits (Profitability)</li>\n</ul></li>\n<li>high availability:\n<ul>\n<li>Positive: lower interest (high supply, bank competition) (Profitability)</li>\n<li>Positive: more funds for growth and expansion (Growth)</li>\n<li>Negative: encourages debt, may worsen gearing (Solvency)</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "P", "name": "Processes", "mn": "", "intro": "", "pts": [{"id": "finance-p1", "t": "Planning and implementing", "rest": "financial needs, budgets, record systems, financial risks, financial controls", "subs": ["debt and equity financing – advantages and disadvantages of each", "matching the terms and source of finance to business purpose"], "mn": "FOP", "html": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> remember the planning cycle syllabus points in order</p></div></div><h3>Financial Needs</h3><ul>\n<li><span class=\"lb def\">Def</span> determining what financial resources are needed to meet goals</li>\n<li>determined by: size of business, current phase of the business cycle, future plans (growth and development), capacity to source finance</li>\n<li>financial statements provide information to help determine needs</li>\n</ul><h3>Developing Budgets</h3><ul>\n<li><span class=\"lb def\">Def</span> quantitative information about requirements to achieve a purpose, so resources are allocated efficiently</li>\n<li>can show: cash requirements, capital expenditure cost vs earning capacity, estimated raw material costs, resource allocation</li>\n<li>types: operating, project (capital expenditure), financial (cash flow, income statement, balance sheet)</li>\n<li>why important: framework for allocating resources efficiently across the firm; assists forecasting</li>\n</ul><h3>Record Systems</h3><ul>\n<li><span class=\"lb def\">Def</span> mechanisms ensuring data is recorded and accurate, reliable, efficient and accessible</li>\n<li>small business: MYOB; large business: SAP or Oracle (JD Edwards)</li>\n<li>double-entry accounting is an important control, minimises errors</li>\n</ul><h3>Financial Risks</h3><ul>\n<li><span class=\"lb def\">Def</span> likelihood of being unable to cover financial obligations such as short and long-term debt</li>\n<li>caused by: fluctuating interest and exchange rates, insolvency, large interest repayments, stringent debt terms</li>\n<li>how to minimise: hedging and derivatives; fixed rather than variable rates; sufficient working capital; debt repayment strategies (early payment discounts)</li>\n</ul><h3>Financial Controls</h3><ul>\n<li><span class=\"lb def\">Def</span> policies and procedures ensuring plans are achieved in the most efficient way</li>\n<li>used to mitigate: theft and fraud, damage or loss of assets, errors in record systems</li>\n<li>how: clear authorisation and responsibility; separation of duties; control of cash (secure registers, no cash overnight); control of credit (follow up overdue accounts)</li>\n</ul><h3>Debt and Equity Financing (extra points, see Debt vs Equity table)</h3><ul>\n<li>Debt: faster and more straightforward than an IPO; changing interest rates complicate forecasting</li>\n<li>Equity: cheaper (no interest); dividends detract from retained profits</li>\n</ul><h3>Matching the Terms and Source of Finance to Business Purpose</h3><ul>\n<li><span class=\"lb def\">Def</span> matching principle: choose the term and source of finance that suits the purpose of the funds</li>\n<li>how: short-term needs (inventory, suppliers) → short-term finance; long-term needs (premises, capital equipment) → long-term finance</li>\n</ul>", "related": []}, {"id": "finance-p2", "t": "Monitoring and controlling", "rest": "cash flow statement, income statement, balance sheet", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> gathering historical and real-time financial data, establishing and interpreting financial statements, and implementing strategies as required</p>\n<p><span class=\"lb k\">Characteristics and features</span> done using the Balance Sheet, Income Statement and Cash Flow Statement</p><h3>Cash Flow Statement</h3><ul>\n<li><span class=\"lb def\">Def</span> movement of cash inflows and outflows from transactions over a period</li>\n<li>shows whether the business has sufficient funds to meet obligations</li>\n<li>organised under operating, investing and financing activities</li>\n</ul><h3>Income Statement</h3><ul>\n<li><span class=\"lb def\">Def</span> income and expenses incurred over a period</li>\n</ul><h3>Balance Sheet</h3><ul>\n<li><span class=\"lb def\">Def</span> what the business owns (assets), owes (liabilities) and has invested (equity)</li>\n<li>Assets = Liabilities + Equity (ALOE)</li>\n<li>Assets: current (cash, accounts receivable, inventory); non-current (furniture and fittings, equipment, motor vehicles)</li>\n<li>Liabilities: current (accounts payable); non-current (mortgage)</li>\n<li>Equity: capital + net profit less drawings</li>\n</ul>", "related": []}, {"id": "finance-p3", "t": "Financial ratios", "rest": "", "subs": ["liquidity – current ratio (current assets ÷ current liabilities)", "gearing – debt to equity ratio (total liabilities ÷ total equity)", "profitability – gross profit ratio (gross profit ÷ sales); net profit ratio (net profit ÷ sales); return on equity ratio (net profit ÷ total equity)", "efficiency – expense ratio (total expenses ÷ sales), accounts receivable turnover ratio (sales ÷ accounts receivable)", "comparative ratio analysis – over different time periods, against standards, with similar businesses"], "mn": "WAO", "html": "<h3>Financial Ratios</h3><p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Liquidity: Current Ratio</li>\n<li>Gearing: Debt-to-Equity Ratio</li>\n<li>Profitability: Gross Profit, Net Profit, Return on Equity</li>\n<li>Efficiency: Expense Ratio, Accounts Receivable Turnover</li>\n</ul>\n<p><span class=\"lb k\">Linked strategies</span> Liquidity (leasing, sale and leaseback, control of CA or CL); Gearing (leasing, sale and leaseback); Profitability (cost and revenue controls); Efficiency (cash flow statements, distribution of payments, early payment discounts, factoring)</p><h4>Liquidity: Current Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> ability to pay short-term debts (under 12 months), also called working capital</li>\n<li>Formula: Current Assets ÷ Current Liabilities</li>\n<li>Interpretation: \"for every dollar of current liabilities, the business has $___ of current assets\"; ideal 2:1 if no benchmark</li>\n<li>Below ideal (e.g. 1:1): not liquid, cannot meet short-term debts</li>\n<li>Above ideal (e.g. 4:1): assets not used efficiently, missing growth and investment opportunities</li>\n<li>Improve: leasing, sale and leaseback, control of CA, control of CL</li>\n<li><span class=\"lb tip\">Note</span> a high ratio is not liquid if most current assets are tied up in inventory or accounts receivable</li>\n</ul><h4>Gearing: Debt-to-Equity Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> proportion of debt (external finance) to equity (internal finance) used to finance activities</li>\n<li>Formula: Total Liabilities ÷ Total Equity</li>\n<li>Interpretation: \"for every dollar of equity, the business has used $___ of debt\"; ideal 1:1 if no benchmark</li>\n<li>Low ratio: low gearing, less reliance on debt, improves solvency</li>\n<li>High ratio: high gearing, more reliance on debt, worsens solvency</li>\n<li>Improve: increase owner's equity (retain profits, sell shares, attract private equity)</li>\n</ul><h4>Profitability: Gross Profit Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> margin between production costs (COGS) and selling price</li>\n<li>Formula: Gross Profit ÷ Sales</li>\n<li>Interpretation: \"for every dollar of sales, $___ of gross profit\"; aim for highest possible</li>\n<li>If lower than benchmark: pricing too low or paying too much for inputs</li>\n<li>Improve: COGS minimisation</li>\n</ul><h4>Profitability: Net Profit Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> return to owners after COGS and other expenses (\"profit margin\")</li>\n<li>Formula: Net Profit ÷ Sales</li>\n<li>Interpretation: \"for every dollar of sales, $___ of net profit\"</li>\n<li>Improve: decrease expenses (including COGS) through expense minimisation</li>\n</ul><h4>Profitability: Return on Equity Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> how effectively owners' funds generate profit and a return on investment</li>\n<li>Formula: Net Profit ÷ Total Equity</li>\n<li>Interpretation: \"for every dollar of equity, owners receive $___ of net profit\"; ideal 10% or higher, or higher than last year or industry; ideally above other investments (e.g. bank deposits)</li>\n<li>Improve: increase net profit (marketing objectives for sales, expense minimisation)</li>\n<li><span class=\"lb tip\">Note</span> if ROE rises because of more debt (less equity), the improvement carries more risk</li>\n</ul><h4>Efficiency: Expense Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> how effective expenses are in generating sales; day-to-day efficiency in keeping selling, administrative and operational expenses reasonable</li>\n<li>Formula: Total Expenses ÷ Sales</li>\n<li>Interpretation: \"each dollar of sales was generated by $___ of expenses\"; lower = more efficient; ideal lower than previous years and/or industry</li>\n<li>Improve: expense minimisation</li>\n</ul><h4>Efficiency: Accounts Receivable Turnover Ratio</h4><ul>\n<li><span class=\"lb def\">Def</span> effectiveness of credit policy and how efficiently debts are collected</li>\n<li>Formula (times): Sales ÷ Accounts Receivable; times AR is converted to cash over a year; ideal higher than prior year or benchmark</li>\n<li>Formula (days): Accounts Receivable ÷ Sales × 365; how quickly debts are collected; ideal lower than prior year or benchmark, otherwise under 30 days</li>\n<li>Improve: check customer credit ratings; tighter credit policies; late fees; follow up unpaid accounts</li>\n</ul><h3>Comparative Ratio Analysis (LIT)</h3><p><span class=\"lb def\">Def</span> comparing ratios over Time, against Industry standards, against 'Like' businesses</p>\n<p><span class=\"lb k\">Why</span> single ratios do not give a complete picture; enables corrective action (e.g. change marketing strategies, adjust strategic direction)</p>\n<ul>\n<li>Over Time: compare budget (predicted) to actual, or different periods (e.g. 2022 vs 2023) → trends evident (profitability, costs) → corrective action (e.g. new supplier to cut costs)</li>\n<li>Industry Standards: compare against standards for the industry (Australian, often international due to globalisation; e.g. ATO small business benchmarks) → shows best practice → guides strategic direction</li>\n<li>'Like' Businesses: benchmark against similar businesses (aim: be above competitors) → e.g. 15% growth seems strong but similar businesses grew 25%, so corrective action needed → if below, analyse reasons then act\n<ul>\n<li>example: Pizza Hut vs Domino's (sales growth 2013 to 2018: 0.4% vs 4.6%; NPR 2018: 35.2% vs 37.9%; stores 2018: 18,400 vs 15,900)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-p4", "t": "Limitations of financial reports", "rest": "normalised earnings, capitalising expenses, valuing assets, timing issues, debt repayments, notes to the financial statements", "subs": [], "mn": "CNN DTV", "html": "<p><span class=\"lb k\">Characteristics and features</span> 6 limitations: Timing issues, Valuing assets, Capitalising expenses, Normalised earnings, Notes to the financial statements, Debt repayments</p>\n<ul>\n<li>Normalised Earnings:\n<ul>\n<li><span class=\"lb def\">Def</span> removal of one-off items so profit reflects true earnings (recorded in the Notes)</li>\n<li>Limitation: may NOT be applied when statements are drafted, leaving profit artificially inflated</li>\n<li>e.g. one-off \"Sale of Land\" gain inflates profit (Income Statement), cash flow and liquidity (Balance Sheet)</li>\n<li>Why: more accurate year-on-year and peer comparison</li>\n</ul></li>\n<li>Capitalising Expenses:\n<ul>\n<li><span class=\"lb def\">Def</span> recording an expense as an asset on the balance sheet instead of an expense on the income statement (commonly R&amp;D)</li>\n<li>Limitation: understates expenses (inflates profit), overstates assets, misleads investors</li>\n</ul></li>\n<li>Valuing Assets:\n<ul>\n<li><span class=\"lb def\">Def</span> estimating asset values for the balance sheet</li>\n<li>Historical cost (original purchase value): can be verified (tax invoice); may differ from market value, distorts balance sheet</li>\n<li>Depreciation (straight-line, diminishing value): an estimate, may under or overstate assets</li>\n<li>Intangibles (goodwill, patents, trademarks): values are estimates, hard to value accurately</li>\n<li>Limitation: does not reflect true value, misleads investors</li>\n</ul></li>\n<li>Timing Issues:\n<ul>\n<li><span class=\"lb def\">Def</span> reports cover only a specific period, usually 1 year (1 July to 30 June)</li>\n<li>Limitation: inappropriate cut-off periods mislead; business may manipulate timing to overstate assets or profits to attract investors or M&amp;As</li>\n<li>businesses must apply the matching principle (revenues and expenses matched to the period in which they occur)</li>\n</ul></li>\n<li>Debt Repayments:\n<ul>\n<li><span class=\"lb def\">Def</span> specific details of debt (AR and AP) may not be disclosed</li>\n<li>Limitation: no due dates, recovery time, debtor capacity or extent of delayed payments; misleads when interpreting gearing (solvency)</li>\n</ul></li>\n<li>Notes to the Financial Statements:\n<ul>\n<li><span class=\"lb def\">Def</span> additional information left out of the main statements (specific accounting methods and calculations, information relevant to stakeholders)</li>\n<li>Limitation: the three statements lack the specific details needed to show current financial position</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-p5", "t": "Ethical issues related to financial reports", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> 3 key ethical issues: Record keeping, Audited accounts, Reporting practices</p>\n<p><span class=\"lb k\">To be ethical, a business should</span></p>\n<ul>\n<li>go beyond legal requirements for transparency</li>\n<li>avoid \"creative accounting\" (favourable but inaccurate portrayal)</li>\n<li>value assets appropriately, normalise earnings, avoid over-capitalising expenses</li>\n<li>disclose debt repayment details; keep notes accurate and objective</li>\n</ul>\n<p><span class=\"lb k\">Why important</span> stakeholders (shareholders, public) get an accurate picture, avoiding misleading decisions</p>\n<ul>\n<li>Record Keeping:\n<ul>\n<li>all transactions (inflows and outflows) must be accurate and honest; all accounting depends on it</li>\n<li>falsifying is a legal matter (ATO requires records for up to 5 years)</li>\n<li>ethical: consistently accurate, truthful records; procedures keep all staff accountable</li>\n</ul></li>\n<li>Audited Accounts:\n<ul>\n<li><span class=\"lb def\">Def</span> independent check of the accuracy of financial and accounting procedures</li>\n<li>Internal audit (own employees); Management audit (reviews strategic plan, whether changes needed); External audit (Corporations Act 2001 for public companies, usually CPAs or Chartered Accountants; ensures compliance with IFRS: AASB Australia, GAAP US)</li>\n<li>ethical issue: going above the mandatory external audit (disclosing internal and management audits)</li>\n</ul></li>\n<li>Reporting Practices:\n<ul>\n<li>must be accurate for tax regardless of legal structure</li>\n<li>public companies must report to shareholders and public (legal)</li>\n<li>private companies (Pty Ltd) have no requirement to publish but can act ethically by doing so</li>\n<li>others (suppliers, banks, ATO) use the information to decide</li>\n<li>ethical: maintain transparency and trust</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "S", "name": "Strategies", "mn": "", "intro": "", "pts": [{"id": "finance-s1", "t": "Cash flow management", "rest": "", "subs": ["cash flow statements", "distribution of payments, discounts for early payment, factoring"], "mn": "DDF", "html": "<h3>Cash Flow Statements</h3><p><span class=\"lb def\">Def</span> movement of cash receipts (inflows) and payments (outflows) from transactions over a period</p>\n<ul>\n<li>What: details inflows and outflows so the business can plan cash to pay liabilities when due</li>\n<li>Why: prevents liquidity issues (defaulting from lack of cash), informs strategies to improve liquidity</li>\n<li><span class=\"lb how\">How</span> using budgets to manage cash flow</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>predicts and forecasts change</li>\n<li>informs spending decisions (e.g. lower spending in low-inflow seasons)</li>\n<li>plans cash so debts are met when due</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>negative cash flow may reduce shareholder confidence</li>\n<li>lenders less likely to lend</li>\n<li>cost and time to construct</li>\n</ul></li>\n</ul><h3>Distribution of Payments</h3><p><span class=\"lb def\">Def</span> managing payments through the year so large expenses do not coincide, preventing cash shortfalls</p>\n<p><span class=\"lb how\">How</span> insurance monthly not annual; wages fortnightly not monthly; rent weekly or fortnightly; suppliers settled monthly with credit terms reviewed (longer periods, payment plans)</p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>avoids large simultaneous outflows, stable cash balance, obligations met (Liquidity)</li>\n<li>may prevent need for debt (e.g. overdrafts), avoiding interest and fees (Profitability)</li>\n<li>better forecasting and budgeting, lower shortfall risk (Liquidity)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>more payment dates add complexity and admin; some suppliers charge for payment plans (Profitability)</li>\n<li>frequent payments raise risk of missed payments and penalties (Liquidity and Profitability)</li>\n</ul></li>\n</ul><h3>Discounts for Early Payment</h3><p><span class=\"lb def\">Def</span> debtors receive a discount for paying accounts early</p>\n<p><span class=\"lb how\">How</span> set clear discount terms on invoices and contracts (percentage off, timeframe)</p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>faster payment, AR converted to cash earlier, improves ART ratio (Efficiency)</li>\n<li>more short-term cash to meet obligations (Liquidity)</li>\n<li>reduces bad debt risk</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cash received is less than AR, reduces net profit (Profitability)</li>\n<li>AR not fully converted to cash, lowers current assets and working capital (Liquidity)</li>\n</ul></li>\n</ul><h3>Factoring</h3><p><span class=\"lb def\">Def</span> selling accounts receivable at a discount to a finance or factoring company (also short-term debt finance)</p>\n<p><span class=\"lb how\">How</span> factoring company collects payment; business gets immediate cash, typically 70 to 90% of invoice value</p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>immediate funds, no waiting for debtors (Liquidity)</li>\n<li>reduces collection costs, time and effort (Profitability)</li>\n<li>recovers AR faster, improves ART ratio (Efficiency)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>does not get full AR and may pay fees, lowers net profit (Profitability)</li>\n<li>aggressive third-party collection strains customer relationships, affects long-term growth (Growth)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-s2", "t": "Working capital management", "rest": "", "subs": ["control of current assets – cash, receivables, inventories", "control of current liabilities – payables, loans, overdrafts", "strategies – leasing, sale and lease back"], "mn": "RIC, LOP, SL", "html": "<p><span class=\"lb def\">Def</span> working capital is the money available for day-to-day operations (Current Assets minus Current Liabilities)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>WCM: the ideal mix of CA and CL to achieve objectives</li>\n<li>\"working capital ratio\" and \"liquidity ratio\" are other names for the Current Ratio</li>\n</ul><h3>Control of Current Assets</h3><p><span class=\"lb def\">Def</span> managing short-term assets (cash, receivables, inventories) to ensure sufficient working capital</p>\n<p><strong>Cash</strong></p>\n<ul>\n<li><span class=\"lb how\">How</span> budgets; managing timing of receipts and payments; building cash reserves</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>meets short-term debts through forecasting and planned spending (Liquidity, improved WC)</li>\n<li>reserves protect against sudden shortfalls (Liquidity, improved WC)</li>\n<li>can avoid short-term finance (COF), minimising expenses (Profitability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>budgets rely on information quality, hard to budget for the unexpected (Liquidity, deteriorated WC)</li>\n<li>excess cash earns a low return, impacts growth (Growth)</li>\n</ul></li>\n</ul>\n<p><strong>Receivables</strong></p>\n<ul>\n<li>Features: monitor AR so timing gives enough cash</li>\n<li><span class=\"lb how\">How</span> check credit rating of prospective customers; follow up overdue accounts; set a payment period (usually 30 days); bad debt policies (e.g. collection agency)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>timely collection improves cash flow (Liquidity, improved WC)</li>\n<li>credit checks avoid bad debts, preserve current assets (Liquidity)</li>\n<li>can avoid COF, minimising expenses (Profitability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>excess monitoring and collection resources raise costs, may offset gains (Profitability)</li>\n<li>strict AR policies or collection agencies discourage customers and damage loyalty and brand image, lowering sales and working capital</li>\n</ul></li>\n</ul>\n<p><strong>Inventory</strong></p>\n<ul>\n<li>Features: goods not yet sold, need turning into cash quickly to pay debts</li>\n<li><span class=\"lb how\">How</span> reduce storage and handling costs (Just-In-Time); select stock that sells easily; stocktakes</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>less unnecessary stock frees working capital (Liquidity, improved WC)</li>\n<li>JIT cuts management costs (less warehouse space, less obsolescence) and wastage, especially perishables (Profitability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>insufficient inventory if demand underestimated, JIT needs accurate forecasts (Liquidity, worsened WC)</li>\n<li>tracking technology and staff training means higher upfront costs (Profitability)</li>\n<li>reliance on suppliers for timely delivery (supply chain disruptions)</li>\n</ul></li>\n</ul><h3>Control of Current Liabilities</h3><p><span class=\"lb def\">Def</span> managing short-term liabilities (payables, loans, overdrafts) to ensure sufficient working capital</p>\n<p><span class=\"lb pos\">Generic positives</span></p>\n<ul>\n<li>improves liquidity and cash flow (funds for short-term obligations)</li>\n<li>reduces overall financing cost</li>\n</ul>\n<p><span class=\"lb neg\">Generic negatives</span></p>\n<ul>\n<li>increased operating costs (interest and fees), possible cash shortages</li>\n<li>needs careful tracking, mismanagement means missed payments and penalties</li>\n<li>significant liabilities hurt creditworthiness, harder to secure future loans or investment</li>\n</ul>\n<p><strong>Payables</strong></p>\n<ul>\n<li><span class=\"lb how\">How</span> use early payment discounts, interest-free credit periods and extended payment terms</li>\n<li>Specific positive: reduces financing cost through early payment discounts</li>\n</ul>\n<p><strong>Loans</strong></p>\n<ul>\n<li><span class=\"lb how\">How</span> compare sources, interest and fees to get a lower interest rate</li>\n<li>Specific positive: reduces financing cost through lower interest rates</li>\n<li><span class=\"lb tip\">Note</span> think commercial bills (this dot point focuses on current liabilities)</li>\n</ul>\n<p><strong>Overdraft</strong></p>\n<ul>\n<li><span class=\"lb how\">How</span> budget so the overdraft is used to a minimum; source from the institution with the lowest interest and fees; have the facility pre-approved so access is immediate</li>\n<li>Specific positive: reduces financing cost (lowest cost institution)</li>\n</ul><h3>Leasing</h3><p><span class=\"lb def\">Def</span> payment for the use of equipment owned by another party</p>\n<p><span class=\"lb how\">How</span> use non-current assets for a set period with regular payments instead of buying outright</p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>lower upfront costs improve working capital, outflows spread over years</li>\n<li>lease payments tax deductible, improves profitability</li>\n<li>access to new, efficient equipment, upgrade at end, less obsolescence</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>may cost more long-term (interest embedded in payments)</li>\n<li>no ownership: limited control, no appreciation</li>\n<li>early exit penalties and use restrictions</li>\n</ul></li>\n</ul><h3>Sale and Leaseback</h3><p><span class=\"lb def\">Def</span> selling an asset to a lessor and immediately leasing it back, accessing funds while keeping use of the asset</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>may require normalised earnings, depending on the value of the sale</li>\n<li>use leasing over sale and leaseback where possible</li>\n</ul>\n<p><span class=\"lb how\">How</span> sell equipment, vehicles or property to a finance or leasing company → lease it back over a set period with regular rental payments</p>\n<ul>\n<li>process: sell the NCA (e.g. building) → pay back the mortgage → remaining funds are a cash injection (↑ CA) → improves current ratio</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>large cash injection improves working capital and liquidity (much higher than periodic lease payments)</li>\n<li>lease payments tax deductible</li>\n<li>keeps use of the asset, minimal disruption, continued growth</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>loses ownership: misses appreciation, lease restrictions</li>\n<li>may cost more long-term; early exit penalties and use restrictions (as for leasing)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-s3", "t": "Profitability management", "rest": "", "subs": ["cost controls – fixed and variable, cost centres, expense minimisation", "revenue controls – marketing objectives"], "mn": "FEC", "html": "<h3>Cost Controls: Fixed and Variable</h3><ul>\n<li>Fixed costs: do not vary with output (rent, salaries, insurance, lease payments)</li>\n<li>Variable costs: vary with output (wages, utilities, inventory)</li>\n<li>How to control fixed: negotiate a better lease; relocate to cheaper premises; review and renegotiate service contracts (insurance, maintenance)</li>\n<li>How to control variable: negotiate supplier discounts; match staff scheduling to demand (fewer casuals); supplier consolidation (fewer suppliers, bulk buying, economies of scale)</li>\n</ul><h3>Cost Controls: Cost Centres</h3><ul>\n<li><span class=\"lb def\">Def</span> attributing costs to specific areas, departments or sections, where the manager and employees take responsibility for their costs</li>\n<li>Features: direct and indirect costs placed within cost centres for easy analysis; usually the 2nd best option\n<ul>\n<li>direct: allocated to a specific product, activity or department (e.g. billboard ad to Marketing)</li>\n<li>indirect: shared across more than one (e.g. electricity)</li>\n</ul></li>\n<li><span class=\"lb how\">How</span> set budgets for departments; target departments with the largest costs to reduce waste</li>\n</ul><h3>Cost Controls: Expense Minimisation</h3><ul>\n<li><span class=\"lb def\">Def</span> the most cost-effective way of delivering goods or services to the required quality</li>\n<li>Features: usually the best and easiest to recommend for Profitability Management (COGS, expenses, net profit)</li>\n<li><span class=\"lb how\">How</span>\n<ul>\n<li>economies of scale: bulk buying for a discounted per-unit price</li>\n<li>supplier consolidation: fewer suppliers (possibly one exclusive)</li>\n<li>competitive bidding: two or more suppliers bid, lowering raw material prices</li>\n<li>low-cost country sourcing</li>\n<li>cutting supply chain intermediaries: buy direct from source</li>\n</ul></li>\n</ul><h3>Cost Controls: Implications (all 3 cost controls)</h3><ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces operating expenses, improves expense ratio (Efficiency)</li>\n<li>lower COGS raises gross profit, lower expenses raise net profit, improving GPR and NPR (Profitability)</li>\n<li>higher net profit supports retained profits, dividends, shareholder satisfaction and long-term growth (Growth)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>may hurt production or service quality, reducing sales (e.g. cheaper materials harm reputation) (Profitability)</li>\n<li>hurts morale and productivity (layoffs, reduced benefits), poor culture, lower service quality and sales (Profitability)</li>\n</ul></li>\n<li><span class=\"lb tip\">Note</span> detail a specific how, then elaborate to the points above</li>\n</ul><h3>Revenue Controls: Marketing Objectives</h3><p><span class=\"lb def\">Def</span> strategies to maximise sales revenue through clear marketing objectives</p>\n<p><span class=\"lb how\">How</span> adjust the Sales Mix, Pricing Policies and Sales Objectives</p>\n<ul>\n<li>Sales Mix:\n<ul>\n<li>how: change product strategy based on SWOT and market research, launching a new or complementary product</li>\n<li>effective: satisfies target market, increases sales revenue, improves GPR and NPR; fixed costs spread over more sales</li>\n<li>ineffective: new range may increase variable costs, harder to achieve economies of scale</li>\n</ul></li>\n<li>Pricing Policies:\n<ul>\n<li>how: price methods (cost, market, competition) or strategies (skimming, penetration, loss-leaders, price points)</li>\n<li>effective: lower penetration price attracts price-sensitive consumers, undercuts competitors, raises sales volume and market share</li>\n<li>ineffective: lower price may signal lower quality; hard to price some products, market research is time and cost intensive</li>\n</ul></li>\n<li>Sales Objectives:\n<ul>\n<li>how: clear benchmarks to cover fixed and variable costs to break even, then profit</li>\n<li>effective: sales exceed expenses (improves expense ratio); larger net profit means more retained cash and less debt (liquidity and solvency)</li>\n<li>ineffective: hard to set realistic objectives, especially for new products</li>\n</ul></li>\n</ul>", "related": []}, {"id": "finance-s4", "t": "Global financial management", "rest": "", "subs": ["exchange rates", "interest rates", "methods of international payment – payment in advance, letter of credit, clean payment, bill of exchange", "hedging", "derivatives"], "mn": "DHIME", "html": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> do not confuse GFM with Global Market Influences in Influences</p></div></div><h3>Exchange Rates</h3><p><span class=\"lb def\">Def</span> value of one currency in comparison to another</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>set by demand and supply from individuals, businesses and financial institutions\n<ul>\n<li>higher demand = appreciation (price rises); higher supply = depreciation (price falls)</li>\n</ul></li>\n<li>managers can hedge against movements, but it is difficult and expensive</li>\n</ul>\n<p><span class=\"lb k\">AUD appreciation</span> cheaper imports; negative for international competitiveness, likely fewer exports (AU products dearer overseas)</p>\n<p><span class=\"lb k\">AUD depreciation</span> dearer imports; positive for international competitiveness, likely more exports (AU products cheaper overseas)</p>\n<p><span class=\"lb k\">Importer vs exporter</span> importer prefers appreciated AUD (cheaper imports); exporter makes fewer sales when AUD is high. Decide whether the business is an importer OR exporter, otherwise marks may be capped</p><h3>Interest Rates (Global)</h3><p><span class=\"lb def\">Def</span> cost of borrowing in domestic and overseas financial markets</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>refers to interest rates globally/overseas</li>\n<li>vary by country with central bank actions and political and economic events</li>\n<li>cheaper overseas rates can give competitive advantage (lower borrowing cost)</li>\n</ul>\n<p><span class=\"lb k\">If lower overseas</span> cheaper funds (less interest); potentially borrow more (lending capacity up); exposed to exchange rate fluctuations, which may offset the advantage</p>\n<p><span class=\"lb k\">If higher overseas</span> less incentive to source funds overseas (cheaper locally); finance typically easier to acquire locally, fewer restrictions</p><h3>Methods of International Payment (PLBC)</h3><p><span class=\"lb k\">Characteristics and features</span> 4 methods: Payment in advance, Letter of credit, Bill of exchange, Clean payment; know the level of risk for all 4</p>\n<p><strong>Payment in Advance</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> exporter receives payment first, then arranges for goods to be sent</li>\n<li><span class=\"lb how\">How</span> exporters minimise risk and secure upfront payment, especially with new or high-risk customers</li>\n<li>Features: lowest risk for exporter; highest risk for importer (may pick a supplier with better terms); importers may accept short-term to build payment history or if poorly credit-rated</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>least risk for exporters, no non-payment or bad debts (Profitability)</li>\n<li>no costly instruments (letters of credit, bills of exchange), lower expenses (Profitability)</li>\n<li>better cash flow, budgeting and demand forecasting (Profitability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>potential loss of sales as importers prefer better terms (Profitability and Growth)</li>\n<li>importer has no guarantee of delivery: risk of non-delivery, poor quality, delay</li>\n</ul></li>\n</ul>\n<p><strong>Letter of Credit</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> document an importer requests from their bank guaranteeing payment to the exporter</li>\n<li><span class=\"lb how\">How</span> issued by the importer's bank to the exporter, promising payment once conditions are met (e.g. goods shipped); bank fee usually paid by importer</li>\n<li>Features: banks only issue if sure the importer can pay (some require full deposit or evidence of funds); protects both parties; lower risk for exporter but not as low as payment in advance</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>Exporter: bank guarantees payment, lowers non-payment risk; importer pays the fee (Profitability)</li>\n<li>Importer: reduces risk of not receiving goods, bank checks terms before funds move</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Exporter: time and cost intensive, strict documentation, discrepancies may delay or block payment (Profitability)</li>\n<li>Importer: pays bank fee, funds tied up, may need full deposit or evidence of funds (Profitability)</li>\n</ul></li>\n</ul>\n<p><strong>Bill of Exchange</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> document drawn up by the exporter requesting payment from the importer at a specified time, usually with international banks as intermediary</li>\n<li><span class=\"lb how\">How</span> organised by the exporter and issued to the importer, who accepts the obligation to pay by a date (e.g. 30, 60 or 90 days after shipment); legally enforceable; exporter pays costs</li>\n<li>Features: moderate risk protection for both; higher exporter risk than a letter of credit (bears costs, relies on importer's creditworthiness); like a letter of credit but organised by the exporter</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>Exporter: reduces non-payment risk, bank guarantees payment once conditions are met (Profitability)</li>\n<li>Importer: reduces risk of not receiving goods; fees paid by exporter (Profitability)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Exporter: time and cost intensive, pays fees, strict documentation (Profitability)</li>\n<li>Exporter: relies on importer's creditworthiness, enforcing across jurisdictions can be costly</li>\n<li>Importer: time and cost intensive, may need full deposit or evidence of funds (Profitability)</li>\n</ul></li>\n</ul>\n<p><strong>Clean Payment</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> exporter ships goods directly to the importer before payment is received</li>\n<li>Features: cheap, easy and quick; builds a trustworthy relationship (credit depends on relationship strength); highest risk for exporter</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>minimal paperwork, no intermediaries or fees (Profitability)</li>\n<li>Exporter: favourable terms may build a stronger trade relationship and more sales (Profitability)</li>\n<li>Importer: no risk of non-shipment, pays only after receiving goods</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Exporter: highest risk, may not be paid for shipped goods, higher bad debts expense (Profitability)</li>\n</ul></li>\n</ul><h3>Hedging</h3><p><span class=\"lb def\">Def</span> risk minimisation strategy protecting against exchange rate and currency fluctuations</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>lets global businesses operate without negative currency movements affecting plans</li>\n<li>can hedge exchange rates and/or interest rates</li>\n<li>spot exchange: two parties exchange currency at the spot rate (value of one currency in another that day); spot rate may be unfavourable, hedging reduces uncertainty</li>\n<li>hedging buys the RIGHT to buy at a set price in the future, not the product itself\n<ul>\n<li>example: corn $1/kg, 100 kg = $100; price rises to $1.50 ($150); derivative costs $10 to lock in $1.10 ($110 + $10 = $120), saves $30; if the price does not rise, choose not to use the right and buy on the market</li>\n</ul></li>\n</ul>\n<p><span class=\"lb how\">How</span></p>\n<ul>\n<li>Natural hedging (minimise FX exposure): offshore subsidiaries; payments in the same foreign currency; contracts in AUD; pricing pegged to a specific exchange rate</li>\n<li>Financial instrument hedging: derivatives (forward exchange contract or options contract)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>reduces risk from adverse rate movements: revenue maintained, costs stable (hedging cost is minor compared to the benefit)</li>\n<li>accurate budgeting and planning (rates locked in), supports long-term growth</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>time and cost intensive: complexity, expertise, ongoing monitoring, extra expenses</li>\n<li>cannot benefit from favourable rate movements (locked in)</li>\n</ul><h3>D
