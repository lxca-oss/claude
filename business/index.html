ation, pay transparency, address gender pay gaps</li>\n<li>HOW 2 (flexibility): legal: NES standard 2 right to request flexible work (parents and carers of children under 18); ethical: flexible arrangements for all (WFH, hybrid), considering the ageing workforce and family dynamics</li>\n<li>other: handle HR issues (bullying, stress, disputes) ethically; Code of Conduct and Code of Ethics for employees, customers and suppliers; support affirmative action, anti-discrimination and diversity programs</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>better community reputation, more candidates apply (acquisition)</li>\n<li>staff more motivated and valued, higher productivity and retention, lower turnover and costs</li>\n<li>higher satisfaction, lower absenteeism, better customer service and satisfaction (link to Marketing)</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>if the business does not go beyond legal compliance, the opposite of the positives occurs</li>\n</ul>", "related": []}]}, {"key": "P", "name": "Processes", "mn": "ADMS", "intro": "", "pts": [{"id": "hr-p1", "t": "Acquisition", "rest": "", "subs": [], "mn": "IRS", "html": "<p><span class=\"lb def\">Def</span> attracting and recruiting appropriate staff for roles</p>\n<p><span class=\"lb k\">Characteristics and features</span> 3 stages: identifying staffing needs, recruitment, selection</p>\n<p><strong>Identifying Staffing Needs</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> evaluating workforce requirements by analysing the internal and external environment</li>\n<li>Features: internal (goals and culture, customer service, expansion plans); external (economic conditions, competition, technology, political and social factors)</li>\n<li><span class=\"lb how\">How</span> job analysis and skills audit (examining activities, duties, environment); job description and specifications (tasks, responsibilities, qualifications, skills, experience)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>aligns staffing with business goals (corporate culture, worker satisfaction)</li>\n<li>efficient workforce planning, avoids understaffing or overstaffing (turnover, absenteeism)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time-consuming and resource-intensive (absenteeism, worker satisfaction)</li>\n<li>may rely on inaccurate data, causing hiring errors (turnover, disputes)</li>\n</ul></li>\n</ul>\n<p><strong>Recruitment</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> locating and attracting the right quantity and quality of staff, internally or externally</li>\n<li>Features:\n<ul>\n<li>Internal: appointing an existing employee (transfers, promotions)</li>\n<li>External: appointing from outside (job sites, agencies, universities, word-of-mouth)</li>\n<li>methods: online job sites (e.g. Seek), recruitment agencies, social networks (e.g. LinkedIn), internal notice boards</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>Internal: morale and motivation (career progression, positive culture)</li>\n<li>Internal: cost-effective and time efficient (no advertising or agency fees)</li>\n<li>External: wider talent pool, new perspectives and skills</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Internal: limited talent pool, may overlook better external candidates</li>\n<li>Internal: competitive culture and tension, staff feel overlooked</li>\n<li>External: higher costs and longer process (ads, agency fees, onboarding)</li>\n</ul></li>\n</ul>\n<p><strong>Selection</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> gathering information on each applicant and choosing the most appropriate</li>\n<li>Features: must be non-discriminatory and legally compliant; HOW: CVs and cover letters, interviews and assessments, references and background checks; WHY: improves productivity through employees who share goals and values</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces turnover and training costs (good fit)</li>\n<li>strengthens culture (aligned values)</li>\n<li>improves business performance (skilled, motivated staff)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost intensive (applications, interviews, references)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "hr-p2", "t": "Development", "rest": "", "subs": [], "mn": "ITOMP", "html": "<p><span class=\"lb def\">Def</span> improving skills, abilities and knowledge through induction, training, organisational development, mentoring/coaching and performance appraisals</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>WHY: higher productivity and efficiency; flexible multi-skilled workforce; motivation and commitment lower absenteeism; easier retention lowers turnover</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>employees: promotion, job satisfaction, challenge, adaptability, independence</li>\n<li>employers: higher productivity, ability to change, loyalty, lower turnover</li>\n<li>appraisals: feedback, pay and promotion opportunities, training needs identified</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>short-term cost and time intensive</li>\n<li>be specific to each HOW where possible; link to corporate culture, turnover, worker satisfaction</li>\n</ul>\n<p><strong>Induction</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> policies, procedures and strategies for a smooth transition of a new employee into the business</li>\n<li><span class=\"lb how\">How</span> onboarding sessions, review of culture and values, employee handbook, tools of trade (ID card, laptop), code of conduct</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>better understanding, fewer mistakes, productive faster</li>\n<li>satisfaction and retention (less anxiety, supported)</li>\n<li>smoother integration, better teamwork, fewer miscommunications and accidents</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>disrupts workflow as time and resources are diverted</li>\n<li>costly if comprehensive or uses external trainers</li>\n</ul></li>\n</ul>\n<p><strong>Training</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> procedures promoting long-term improvement in skills, knowledge and attributes to improve productivity</li>\n<li><span class=\"lb how\">How</span> on-the-job, off-the-job (outsourced), webinars, skills and management training, assessments, ongoing training</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>as for induction but for existing staff: fewer mistakes</li>\n<li>satisfaction and retention</li>\n<li>ongoing training reinforces culture, procedures and expectations, smoother teamwork, fewer errors or accidents</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>disrupts workflow</li>\n<li>costly (especially with external trainers or materials)</li>\n</ul></li>\n</ul>\n<p><strong>Organisational Development</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> developing skillset by differentiating an employee's role or responsibility</li>\n<li><span class=\"lb how\">How</span> job enlargement (more range and breadth of tasks); job rotation (variety of job experiences); job enrichment (more responsibility and challenge); job sharing (two or more people share a job part-time); self-managing teams (team members manage decisions)</li>\n</ul>\n<p><strong>Mentoring and Coaching</strong></p>\n<ul>\n<li>Mentoring: informal, a more experienced employee shares knowledge, skills and advice with a less experienced one</li>\n<li>Coaching: more formalised, improves an employee's skills and performance</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>targets individual development for productivity</li>\n<li>transfers skills and knowledge from mentor to mentee</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> time and cost intensive</li>\n</ul>\n<p><strong>Performance Appraisals</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> systematic analysis and evaluation of performance for strengths, weaknesses and development opportunities</li>\n<li>Features: gives feedback and recognition; poor results show a need for better acquisition, development and targeted training</li>\n<li><span class=\"lb how\">How (tools)</span> 360-degree feedback (anonymous, from managers and co-workers); behaviour observation scales (supervisor records behaviour over time); interviews; graphic rating scale (traits such as enthusiasm, reliability, quantity and quality); essay evaluation (supervisor report)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>improved performance through regular feedback and goals</li>\n<li>supports performance-based pay (links pay to performance)</li>\n<li>legal protection: records help defend unfair dismissal claims</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>demotivating if overly critical, unconstructive or unrepresentative</li>\n</ul></li>\n</ul>", "related": []}, {"id": "hr-p3", "t": "Maintenance", "rest": "", "subs": [], "mn": "FLECR", "html": "<p><span class=\"lb def\">Def</span> ongoing retention of staff through supporting wellbeing, motivation and commitment</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>HOW: monetary and non-monetary rewards, legal compliance and CSR, communication and workplace culture, employee participation, flexible work arrangements</li>\n<li>WHY: retains staff (lower turnover); manages wellbeing (lower absenteeism); rewards lift productivity; satisfaction improves customer service</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>rewards encourage productivity</li>\n<li>easier retention, lower turnover</li>\n<li>satisfaction improves customer service and customer satisfaction</li>\n</ul>\n<p><span class=\"lb neg\">Negatives (inflexible, not family-friendly workplace)</span></p>\n<ul>\n<li>lower morale from stress</li>\n<li>potential court action</li>\n<li>loss of return on training, higher turnover costs, increased absenteeism</li>\n</ul>\n<p><strong>Monetary and Non-Monetary Rewards</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> additional remuneration benefits, monetary or non-monetary, for providing labour</li>\n<li>Why: recognises productive staff; retains employees and attracts skilled applicants</li>\n<li>Monetary: financial (share purchase plans, bonuses, product discounts, travel allowance); non-monetary: non-financial (flexible arrangements, training opportunities, new office, certificates and awards)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>Monetary: incentivises targets, results-driven culture, productivity</li>\n<li>Monetary: attracts and retains talent</li>\n<li>Non-monetary: boosts morale and satisfaction (valued, loyal)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Monetary: unhealthy competition, less collaboration and team cohesion</li>\n<li>Monetary: high cost, unsustainable for small businesses or low profit periods</li>\n<li>Non-monetary: may not appeal to all, transactional relationship; inconsistent use creates perceptions of favouritism</li>\n</ul></li>\n</ul>\n<p><strong>Communication</strong></p>\n<ul>\n<li>Features: consistent and positive to build relationships; HOW: team meetings, newsletters, emails, surveys</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>employees feel heard and valued (satisfaction, lower turnover)</li>\n<li>better understanding of role and goals, productivity</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> poor communication causes dissatisfaction and high turnover</li>\n</ul>\n<p><strong>Workplace Culture</strong></p>\n<ul>\n<li>Features: supportive culture where staff feel valued through recognition and constructive feedback; HOW: recognition programs, team events, informal and formal feedback meetings</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>staff feel valued</li>\n<li>better wellbeing and productivity</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> group dynamics may make a positive culture harder, especially for new employees</li>\n</ul>\n<p><strong>Employee Participation</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> (empowerment and involvement) giving staff more responsibility and encouraging them in decision-making</li>\n<li><span class=\"lb how\">How</span> meetings including board of directors' representation; share purchase plans; collective bargaining; surveys and appraisal feedback</li>\n<li><span class=\"lb pos\">Positives</span> staff feel valued, improving workplace culture</li>\n</ul>\n<p><strong>Legal Compliance and CSR</strong></p>\n<ul>\n<li>Features: comply with IR legislation to avoid legal consequences and keep employee trust; exceed obligations where possible (spirit of the law); areas: sexual harassment, WHS, bullying</li>\n<li><span class=\"lb how\">How</span> clear corporate values and procedures on bullying; legal: periodic training (WHS, First Aid/CPR, required under WHS Act 2011); ethical: free counselling, improving wellbeing and mental health (worker satisfaction, culture, absenteeism, turnover)</li>\n</ul>\n<p><strong>Flexible Work Arrangements</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> agreement giving the employee flexibility in scheduling, number and location of hours</li>\n<li>Features: work from home, parental leave arrangements, flexible hours; right to request is in the NES</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>stimulates productivity and positive culture</li>\n<li>if accommodated, higher retention, lower turnover, positive corporate image (link to Marketing)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "hr-p4", "t": "Separation", "rest": "", "subs": [], "mn": "RRRV, CIDR, SUD", "html": "<p><span class=\"lb def\">Def</span> terminating employment, voluntary or involuntary</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Voluntary separation (RRRV)</th>\n<th>Involuntary separation (CIDR)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Def: employee chooses to leave of their own free will</td>\n<td>Def: employee is asked to leave against their will</td>\n</tr>\n<tr>\n<td>Retirement: leaving the labour force permanently, end of career</td>\n<td>Contract expiry: contractor's engagement for a specified period ends</td>\n</tr>\n<tr>\n<td>Resignation: leaving to join another business</td>\n<td>• Involuntary redundancy: positions or a department terminated as skills no longer needed (e.g. structural change)<br />\n• acceptable: site closure, technology, financial difficulty, structural change<br />\n• business may need to show the job was genuinely no longer needed and no work was available elsewhere</td>\n</tr>\n<tr>\n<td>Relocation: moving geographically, unable to keep employment</td>\n<td>Dismissal: poor performance or serious breach of contract</td>\n</tr>\n<tr>\n<td>• Voluntary redundancy: employee nominates themselves during a redundancy process<br />\n• appeals to older workers near retirement</td>\n<td>• Retrenchment: business cannot provide enough work, usually from a downturn<br />\n• must show evidence (e.g. financial statements)</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Dismissal types:\n<ul>\n<li>summary dismissal: instant, for a significant breach (theft, serious misconduct)</li>\n<li>dismissal on notice: consistently poor performance; requires written warning over time, advice, support and training, notice of the reason and chance to respond</li>\n<li>unfair dismissal: harsh, unjust or unreasonable; if upheld, employer can be ordered to reinstate and/or compensate</li>\n</ul></li>\n<li>Redundancy vs retrenchment: redundancy targets positions; retrenchment targets people</li>\n</ul>", "related": []}]}, {"key": "S", "name": "Strategies", "mn": "", "intro": "", "pts": [{"id": "hr-s1", "t": "Leadership style", "rest": "", "subs": [], "mn": "LAD", "html": "", "related": []}, {"id": "hr-s2", "t": "Job design", "rest": "general or specific tasks", "subs": [], "mn": "", "html": "", "related": []}, {"id": "hr-s3", "t": "Recruitment", "rest": "internal or external, general or specific skills", "subs": [], "mn": "", "html": "", "related": [["P", "Acquisition", "internal vs external recruitment"]]}, {"id": "hr-s4", "t": "Training and development", "rest": "current or future skills", "subs": [], "mn": "", "html": "", "related": [["P", "Development", "induction, training, organisational development, mentoring and coaching"]]}, {"id": "hr-s5", "t": "Performance management", "rest": "developmental or administrative", "subs": [], "mn": "", "html": "", "related": [["P", "Development", "performance appraisals"]]}, {"id": "hr-s6", "t": "Rewards", "rest": "monetary and non-monetary, individual or group, performance pay", "subs": [], "mn": "", "html": "", "related": [["P", "Maintenance", "monetary and non-monetary rewards"]]}, {"id": "hr-s7", "t": "Global", "rest": "costs, skills, supply", "subs": [], "mn": "", "html": "", "related": [["R", "Outsourcing", "global contractors"]]}, {"id": "hr-s8", "t": "Workplace disputes", "rest": "", "subs": ["resolution – negotiation, mediation, grievance procedures, involvement of courts and tribunals"], "mn": "", "html": "", "related": [["I", "Legal", "FWC mediation and conciliation, courts and tribunals, enterprise agreement dispute processes"]]}]}, {"key": "E", "name": "Effectiveness", "mn": "CAB CLAW", "intro": "", "pts": [{"id": "hr-e1", "t": "Indicators", "rest": "", "subs": ["corporate culture", "benchmarking key variables", "changes in staff turnover", "absenteeism", "accidents", "levels of disputation", "worker satisfaction"], "mn": "CLAW ABC", "html": "<p><span class=\"lb k\">Indicators of effectiveness</span></p>\n<ul>\n<li>7 indicators: corporate culture; absenteeism; benchmarking key variables; changes in staff turnover; levels of disputation; accidents; worker satisfaction</li>\n<li>Benchmarking key variables: measuring performance against established standards or best practice</li>\n\n</ul>", "related": []}]}]}];

const I = {
  page:'<svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 15.5h6"/></svg>',
  home:'<svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 10v9h12v-9"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  out:'<svg class="i" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  num:'<svg class="i" viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></svg>',
  tri:'<svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M4 2.5l4.5 3.5L4 9.5z"/></svg>'
};

const K = Object.fromEntries(KBFS.map(k => [k.id, k]));
const PT = {};   // point id -> {k, s, p}
KBFS.forEach(k => k.secs.forEach(s => s.pts.forEach(p => PT[p.id] = {k, s, p})));
const nPts = k => k.secs.reduce((n,s)=>n+s.pts.length,0);
const nDone = k => k.secs.reduce((n,s)=>n+s.pts.filter(p=>p.html).length,0);

function renderSide(kid, key){
  let h = `<a class="ws" href="#home"><span class="av">L</span>Luca’s Business</a>
    <button class="row" id="open-search">${I.search}Search<span class="kbd">Ctrl K</span></button>
    <a class="row" href="#home" ${kid==="home"?'aria-current="page"':''}>${I.home}<span class="pg">Overview</span></a>
    <div class="grp">Key business functions</div>`;
  for (const k of KBFS){
    h += `<a class="row" href="#${k.id}" ${kid===k.id && !key?'aria-current="page"':''}>${I.page}<span class="pg">${k.name}</span></a>`;
    if (kid === k.id) for (const s of k.secs)
      h += `<a class="row sub-row" href="#${k.id}-${s.key.toLowerCase()}" ${key===s.key?'aria-current="page"':''}><span class="ltr">${s.key}</span>${s.name}</a>`;
  }
  h += `<div class="grp">Other subjects</div><a class="row" href="${ENGLISH_URL}" target="_blank" rel="noopener">${I.out}<span class="pg">English hub</span></a>`;
  $("#side").innerHTML = h;
}

function renderCrumbs(kid, key){
  if (kid === "home"){ $("#crumbs").innerHTML = `<span class="cur">Overview</span>`; return; }
  const k = K[kid], s = k.secs.find(x=>x.key===key);
  $("#crumbs").innerHTML = `<a href="#home">Luca’s Business</a><span>/</span><a href="#${kid}">${k.name}</a><span>/</span><span class="cur">${s.key}: ${s.name}</span>`;
}

function renderHome(){
  let h = `<h1 class="title">HSC Business Studies</h1>
    <div class="props">
      <div class="prop"><span class="k">${I.list}Structure</span><span class="v">Syllabus order: Role, Influences, Processes, Strategies</span></div>
      <div class="prop"><span class="k">${I.num}Dot points</span><span class="v">${KBFS.reduce((n,k)=>n+nPts(k),0)}</span></div>
    </div>
    <div class="callout"><span class="ic">i</span><div class="ct"><p>Every syllabus dot point is a toggle. Open one to see its syllabus wording and your notes. Labels mark <span class="lb def">Def</span><span class="lb how">How</span><span class="lb pos">Positives</span><span class="lb neg">Negatives</span>. Press <b>Ctrl K</b> to search everything.</p></div></div>
    <h2>Key business functions</h2><div class="kgrid">`;
  for (const k of KBFS){
    const done = nDone(k), all = nPts(k);
    h += `<div class="kcard"><a href="#${k.id}" style="text-decoration:none" class="n">${k.name}</a>
      <div class="secs">${k.secs.map(s=>`<a href="#${k.id}-${s.key.toLowerCase()}" style="text-decoration:none">${tag(s.key+" · "+s.name, KCOL[k.id])}</a>`).join("")}</div>
      <span class="c">${all} dot points${done<all?` · ${all-done} without notes yet`:""}</span></div>`;
  }
  return h + `</div>`;
}

function renderPoint(k, s, p){
  let meta = p.mn ? tag(p.mn, "gray") : "";
  if (!p.html) meta += tag("No notes yet", "red");
  let b = "";
  if (p.subs.length) b += `<div class="syl"><div class="h">Syllabus sub-points</div><ul>${p.subs.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if (p.html) b += `<div class="notes">${p.html}</div>`;
  else {
    b += `<div class="gap"><p>No notes for this dot point yet. Send the slides or notes and they’ll go here.</p>`;
    for (const [key, title, what] of p.related){
      const sec = k.secs.find(x=>x.key===key), tp = sec && sec.pts.find(x=>x.t.startsWith(title));
      if (tp) b += `<p>Related: <a href="#${tp.id}">${key} · ${tp.t}</a> covers ${what}.</p>`;
    }
    b += `</div>`;
  }
  return `<details class="pt" id="${p.id}"><summary><span class="tri">${I.tri}</span><span class="st"><span class="t">${p.t}</span>${p.rest?`<span class="r">${p.rest}</span>`:""}${meta?`<span class="meta">${meta}</span>`:""}</span></summary><div class="pt-body">${b}</div></details>`;
}

function renderKbf(kid, key){
  const k = K[kid], s = k.secs.find(x=>x.key===key);
  let h = `<h1 class="title">${k.name}</h1>
    <nav class="tabs" role="tablist">${k.secs.map(x=>`<a role="tab" href="#${kid}-${x.key.toLowerCase()}" aria-selected="${x.key===key}"><b>${x.key}</b>${x.name}</a>`).join("")}</nav>`;
  if (s.mn) h += `<div class="props"><div class="prop"><span class="k">${I.list}Mnemonic</span><span class="v">${tag(s.mn,"gray")}</span></div></div>`;
  if (s.intro) h += `<div class="intro">${s.intro}</div>`;
  h += `<div class="tools"><span>${s.pts.length} dot point${s.pts.length===1?"":"s"}</span><span><button data-all="1">Expand all</button><button data-all="0">Collapse all</button></span></div>`;
  return h + s.pts.map(p=>renderPoint(k, s, p)).join("");
}

/* Search */
const INDEX = [];
for (const k of KBFS) for (const s of k.secs) for (const p of s.pts){
  INDEX.push({id:p.id, title:p.t, where:`${k.name} · ${s.key}: ${s.name}`, text:[p.rest, p.subs.join(" "), p.mn, strip(p.html)].join(" ")});
}
function hl(text, q){
  const t = esc(text); if (!q) return t;
  return t.replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig"),"<mark>$1</mark>");
}
function snippet(text, ql){
  const i = text.toLowerCase().indexOf(ql); if (i < 0) return text.slice(0, 140);
  const a = Math.max(0, i - 60); return (a ? "…" : "") + text.slice(a, i + ql.length + 90) + "…";
}
let sel = 0;
function renderResults(){
  const q = $("#q").value.trim(), ql = q.toLowerCase();
  if (!q){
    $("#res").innerHTML = `<div class="hd">Pages</div>` + KBFS.flatMap(k=>k.secs.map(s=>`<a class="hit" href="#${k.id}-${s.key.toLowerCase()}"><span class="t">${k.name} · ${s.key}: ${s.name}</span><span class="w">${s.pts.length} dot points</span></a>`)).join("");
  } else {
    const hits = INDEX.map(e => {
      const inT = e.title.toLowerCase().includes(ql), inX = e.text.toLowerCase().includes(ql);
      return (inT || inX) ? {...e, score: inT ? 0 : 1} : null;
    }).filter(Boolean).sort((a,b)=>a.score-b.score);
    $("#res").innerHTML = `<div class="hd">${hits.length} dot point${hits.length===1?"":"s"}</div>` + (hits.length ? hits.map(e=>`<a class="hit" href="#${e.id}"><span class="t">${hl(e.title,q)}</span><span class="w">${esc(e.where)}</span><span class="s">${hl(snippet(e.text, ql),q)}</span></a>`).join("")
      : `<p class="hit muted">No matches. Try a term like “factoring”, “JIT” or “awards”.</p>`);
  }
  sel = 0; markSel();
}
function markSel(){ const hs=[...document.querySelectorAll("#res a.hit")]; hs.forEach((h,i)=>h.classList.toggle("sel",i===sel)); if(hs[sel]) hs[sel].scrollIntoView({block:"nearest"}); }
function openSearch(){ $("#scrim").hidden = false; document.body.classList.remove("nav-open"); $("#q").value=""; renderResults(); $("#q").focus(); }
function closeSearch(){ $("#scrim").hidden = true; }

/* Routing: #home, #finance, #finance-p, #finance-p2 */
function route(){
  const h = location.hash.slice(1);
  let m = /^([a-z]+)(?:-([a-z])(\d+)?)?$/.exec(h), kid = "home", key = null, pid = null;
  if (m && K[m[1]]){
    kid = m[1];
    const s = m[2] && K[kid].secs.find(x=>x.key.toLowerCase()===m[2]);
    key = s ? s.key : K[kid].secs[0].key;
    if (s && m[3] && PT[h]) pid = h;
  }
  renderSide(kid, kid==="home" ? null : (m && m[2] ? key : null));
  renderCrumbs(kid, key);
  $("#main").innerHTML = kid === "home" ? renderHome() : renderKbf(kid, key);
  document.body.classList.remove("nav-open");
  const el = pid && document.getElementById(pid);
  if (el){ el.open = true; el.scrollIntoView(); } else window.scrollTo(0,0);
  try{ localStorage.setItem("biz-last", h || "home"); }catch(e){}
}

window.addEventListener("hashchange", route);
$("#q").addEventListener("input", renderResults);
$("#menu").addEventListener("click", e=>{ e.stopPropagation(); document.body.classList.toggle("nav-open"); });
document.addEventListener("click", e=>{
  if (e.target.closest("#open-search")){ openSearch(); return; }
  if (e.target === $("#scrim")){ closeSearch(); return; }
  const all = e.target.closest("[data-all]");
  if (all){ document.querySelectorAll("details.pt").forEach(d=>d.open = all.dataset.all === "1"); return; }
  const hit = e.target.closest("a.hit");
  if (hit){ closeSearch(); if (location.hash === hit.getAttribute("href")){ e.preventDefault(); route(); } return; }
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href") === location.hash){ e.preventDefault(); route(); return; }
  if (document.body.classList.contains("nav-open") && !e.target.closest("#side")) document.body.classList.remove("nav-open");
});
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#scrim").hidden ? openSearch() : closeSearch(); return; }
  if ($("#scrim").hidden) return;
  const hs = document.querySelectorAll("#res a.hit");
  if (e.key === "Escape") closeSearch();
  else if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(sel+1, hs.length-1); markSel(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(sel-1, 0); markSel(); }
  else if (e.key === "Enter" && hs[sel]){ e.preventDefault(); hs[sel].click(); }
});

if (!location.hash){ try{ const last = localStorage.getItem("biz-last"); if (last && last !== "home") history.replaceState(null,"","#"+last); }catch(e){} }
route();
</script>
