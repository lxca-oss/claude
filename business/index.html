erivatives</h3><p><span class=\"lb def\">Def</span> financial instrument (contract) used to minimise currency risk, a form of hedging</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>value derived from the value of another product</li>\n<li>2 main types: Forward exchange contract, Currency options contract</li>\n<li>exchange rate derivative: right to buy foreign currency in the future at a price agreed now</li>\n<li>interest rate derivative: right to borrow in the future at an interest rate agreed now</li>\n</ul>\n<p><strong>Forward Exchange Contract (FEC)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> agreement to exchange one currency for another at an agreed rate on a future date, usually after 30, 90 or 180 days</li>\n<li><span class=\"lb how\">How</span> usually between a business and a bank; bank guarantees the exporter a fixed rate, within the set time, for export sale money</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces risk from adverse rate moves (pre-agreed rate favourable if rates move badly) (Profitability)</li>\n<li>accurate budgeting, rates locked in (Growth)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost intensive (complexity, expertise, monitoring, expenses)</li>\n<li>cannot benefit from favourable movements</li>\n</ul></li>\n</ul>\n<p><strong>Currency Options Contract</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> gives the buyer (option holder) the right, but not the obligation, to buy or sell foreign currency at a specified future time</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reduces risk from adverse moves</li>\n<li>keeps the chance to benefit from favourable moves (can trade on the market at the better rate)</li>\n<li>assists budgeting and planning</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost intensive (complexity, expertise, monitoring, expenses)</li>\n<li>may go unused if markets move favourably, resources could have supported growth</li>\n</ul></li>\n</ul>", "related": []}]}]}, {"id": "marketing", "name": "Marketing", "short": "Marketing", "secs": [{"key": "R", "name": "Role", "mn": "", "intro": "", "pts": [{"id": "marketing-r1", "t": "Strategic role of marketing goods and services", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> total system of interacting activities designed to plan, price, promote and distribute (place) products to present and potential customers so business objectives are achieved</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>maximises profitability and competitive advantage by developing, implementing and coordinating Marketing Mix strategies (product design, pricing, promotion, distribution)</li>\n<li>assists marketing objectives such as increasing market share and sales</li>\n<li>use the key terminology explicitly</li>\n</ul><h3>Marketing Objectives (MSG-PCP)</h3><ul>\n<li>Increasing market share</li>\n<li>Increasing sales</li>\n<li>Expanding new geographic markets</li>\n<li>Expand product range</li>\n<li>Improving customer service</li>\n<li>Profit maximisation</li>\n<li>must be memorised and explicitly linked in SIII and SIV responses</li>\n</ul>", "related": []}, {"id": "marketing-r2", "t": "Interdependence with other key business functions", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> two-way relationship between Marketing and other KBFs (one-way detail is only dependence)</p>\n<ul>\n<li>Operations: manufacturing, services, turning raw materials into finished goods</li>\n<li>Marketing: product design, sales, advertising, strategies (4Ps, segmentation)</li>\n<li>Finance: administration, financial management, financial planning</li>\n<li>HR: industrial relations, HRM, recruitment</li>\n</ul><h3>Marketing and Operations</h3><ul>\n<li>Marketing to Operations:\n<ul>\n<li>market research and design specifications → Operations → product designs produced</li>\n<li>change in marketing strategy (packaging, product design) → Operations adjusts technology, process layout, QM</li>\n</ul></li>\n<li>Operations to Marketing:\n<ul>\n<li>sales forecasts → Operations acquires resources and sets product volumes</li>\n<li>Operations limits on design and specifications → Marketing must stay within them → failure risks legal issues (implied conditions) and ethical issues (truth in advertising)</li>\n<li>Operations' CSR → used in promotion → better PR → positive publicity</li>\n</ul></li>\n</ul><h3>Marketing and Finance</h3><ul>\n<li>Marketing to Finance:\n<ul>\n<li>Marketing helps determine cost of production → influences cost-based pricing</li>\n<li>Marketing needs funds → Finance provides budget for market research and promotion</li>\n</ul></li>\n<li>Finance to Marketing:\n<ul>\n<li>Finance budgets → may restrict promotion (e.g. TV advertising, sports sponsorships)</li>\n<li>cost controls (e.g. cost centres) → may affect distribution (channel choice) and advertising choice</li>\n<li>Marketing market research → Finance uses it → informs investment decisions</li>\n</ul></li>\n</ul><h3>Marketing and HR</h3><ul>\n<li>Marketing to HR:\n<ul>\n<li>new product range → HR hires (Acquisition) a new product manager and marketing staff</li>\n<li>Marketing needs skills → HR skills audit → training (Development)</li>\n</ul></li>\n<li>HR to Marketing:\n<ul>\n<li>Marketing role descriptions and requirements → HR sources skilled workers</li>\n<li>product deletion or decline stage of PLC → positions unnecessary → HR adjusts job design, uses separation (involuntary redundancy) or re-skills (Development)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "marketing-r3", "t": "Production, selling, marketing approaches", "rest": "", "subs": [], "mn": "", "html": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Tip:</b> stick to this for HSC questions</p></div></div>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Approach</th>\n<th>Period</th>\n<th>Def</th>\n<th>Features</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Production</td>\n<td>1820s to 1920s</td>\n<td>focus on producing goods and services, marketing a spin-off</td>\n<td>• \"if we make it, they will buy it\"<br />\n• mass production not consumer needs<br />\n• e.g. Henry Ford</td>\n</tr>\n<tr>\n<td>Selling</td>\n<td>1920s to 1960s</td>\n<td>focus on selling as supply outstripped demand</td>\n<td>• sales-orientated, advertising, personal and door-to-door selling<br />\n• more efficient, higher quality production<br />\n• most still neglected customer needs</td>\n</tr>\n<tr>\n<td>Marketing Stage 1</td>\n<td>1960s to 1980s</td>\n<td>investigate customer wants through market research, then satisfy them</td>\n<td>• focus moved from production to the consumer, marketing central to all functions<br />\n• started with post-WW2 boom (more discretionary income)</td>\n</tr>\n<tr>\n<td>Marketing Stage 2</td>\n<td>1980s to present</td>\n<td>Stage 1 plus 3 elements</td>\n<td>• CSR (triple bottom line)<br />\n• customer orientation (decisions on consumer wants, exceed expectations)<br />\n• relationship marketing (long-term, cost-effective relationships, customer retention and loyalty)</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Production: no advertising or market research</li>\n<li>Selling: advertising but no market research</li>\n<li>Marketing Stage 1: market research</li>\n<li>Marketing Stage 2: market research + CSR, relationship marketing, customer orientation</li>\n</ul>", "related": []}, {"id": "marketing-r4", "t": "Types of markets", "rest": "resource, industrial, intermediate, consumer, mass, niche", "subs": [], "mn": "CRIMIN", "html": "<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Market</th>\n<th>Def</th>\n<th>Features and examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Consumer</td>\n<td>individuals buying finished goods for personal use</td>\n<td>• clothes, computers, food<br />\n• divided into Mass and Niche</td>\n</tr>\n<tr>\n<td>Resource</td>\n<td>businesses in primary production and extraction of natural resources (mining, agriculture, forestry, fishing)</td>\n<td>BHP Billiton extracts iron ore, copper, nickel</td>\n</tr>\n<tr>\n<td>Industrial</td>\n<td>businesses buying raw materials/products to produce other products or for daily operations</td>\n<td>• manufacturers<br />\n• Coca-Cola buys cans from Alcoa<br />\n• Baker's Delight buys flour</td>\n</tr>\n<tr>\n<td>Mass</td>\n<td>products with mass appeal to every customer regardless of demographic</td>\n<td>• mass-produced, distributed and promoted<br />\n• lowest cost (economies of scale)<br />\n• paracetamol, toothpaste, petrol</td>\n</tr>\n<tr>\n<td>Intermediate</td>\n<td>businesses buying finished products and on-selling for profit</td>\n<td>• supermarket, wholesaler, retailer<br />\n• JB Hi-Fi buys iPhones from Apple<br />\n• Woolworths buys milk from farmers</td>\n</tr>\n<tr>\n<td>Niche</td>\n<td>concentrated, narrow segment with specific needs or wants</td>\n<td>high performance European cars, ultra-luxury artisanal watches</td>\n</tr>\n</tbody>\n</table></div>", "related": []}]}, {"key": "I", "name": "Influences", "mn": "", "intro": "", "pts": [{"id": "marketing-i1", "t": "Factors influencing customer choice", "rest": "psychological, sociocultural, economic, government", "subs": [], "mn": "PEGS, LAMPP, CRFS", "html": "<p><span class=\"lb k\">Characteristics and features</span> 4 key factors: Psychological, Economic, Government, Sociocultural</p><h3>Psychological Influences (LAMPP)</h3><p><span class=\"lb def\">Def</span> influences within an individual that affect buying behaviour</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>5 factors: Learning, Attitude, Motivation, Perception, Personality</li>\n<li>know the difference between perception, attitude and motivation</li>\n<li>link to Processes and Strategies</li>\n<li><span class=\"lb tip\">Tip</span> to cover it in one paragraph, cover 3 of the 5</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Factor</th>\n<th>Def</th>\n<th>Influence on marketing</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Perception</td>\n<td>how individuals view a brand and its products</td>\n<td>create a positive perception of quality, innovation, creativity, superiority</td>\n</tr>\n<tr>\n<td>Attitude</td>\n<td>overall feeling about a business or product</td>\n<td>adjust strategies to respond to negative attitudes</td>\n</tr>\n<tr>\n<td>Motive</td>\n<td>reason an individual purchases</td>\n<td>target motives such as comfort, safety, taste, fear, cleanliness</td>\n</tr>\n<tr>\n<td>Personality</td>\n<td>behaviours and characteristics that make up a person</td>\n<td>products must appeal to personality and self-image of the target market</td>\n</tr>\n<tr>\n<td>Learning</td>\n<td>changes in buying behaviour from information and experience</td>\n<td>• promotion improves awareness and knowledge<br />\n• can encourage brand loyalty</td>\n</tr>\n</tbody>\n</table></div>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>market research identifies psychological influences, minimises failure (strategies more appropriate)</li>\n<li>tailor advertising message and product features to psychological traits, more sales and positive publicity</li>\n<li>positive brand image creates positive attitudes that encourage sales</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>if ignored, strategies less effective, declining market share, sales, profit maximisation</li>\n<li>negative perceptions or attitudes hinder the product, poor consumer experience</li>\n<li>adjustments to product designs and promotion raise costs and hit profits</li>\n</ul><h3>Sociocultural Influences (SCRF)</h3><p><span class=\"lb def\">Def</span> forces from other people and groups that affect buying behaviour</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>4 factors: Social class, Culture and subculture, Family and role, Reference (peer) group</li>\n<li><span class=\"lb tip\">Tip</span> to cover it in one paragraph, cover 3 of the 4</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Factor</th>\n<th>Def</th>\n<th>Influence on marketing</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Social class</td>\n<td>relative rank in society (education, income, occupation)</td>\n<td>• research shapes strategies<br />\n• affects type, quality and quantity bought<br />\n• higher class buys prestige and status products</td>\n</tr>\n<tr>\n<td>Culture and subculture</td>\n<td>values, beliefs and traditions</td>\n<td>• affects lifestyle and product choices (e.g. vegan)<br />\n• market respectfully or damage brand image</td>\n</tr>\n<tr>\n<td>Family and roles</td>\n<td>individual's role in a family and influence on decisions</td>\n<td>market to needs and wants of specific family roles</td>\n</tr>\n<tr>\n<td>Reference (peer) groups</td>\n<td>group a person identifies with, adopting its attitudes and values</td>\n<td>target industry-related group leaders, low-cost opinion leader promotion</td>\n</tr>\n</tbody>\n</table></div>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>higher social class target → exclusive distribution creates luxury image → Profit Maximisation</li>\n<li>culture research → guides product (e.g. vegan) or branding, shows respect → Market Share</li>\n<li>introduction stage of PLC → low-cost promotion (word of mouth) via peer groups → Market Share</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>exclusive channel for luxury image → may deter low-income customers → lower sales → lower Market Share</li>\n<li>adapting product and branding to culture is cost-intensive → hinders Profit Maximisation</li>\n<li>word of mouth gives little control over the message → can hinder market share</li>\n</ul><h3>Economic Influences</h3><p><span class=\"lb def\">Def</span> changes in spending and income in the wider economy due to booms and busts</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Contractions: ↓ consumer spending, ↓ production, inflation may fall, interest and wage rates fall, unemployment rises</li>\n<li>Expansions: ↑ consumer spending, ↑ production, inflation may rise, interest and wage rates rise, unemployment falls</li>\n</ul>\n<p><span class=\"lb k\">Effects</span></p>\n<ul>\n<li>expansions: intensify promotion to increase sales and secure market share</li>\n<li>contractions: review pricing strategies to maintain sales and profits</li>\n</ul>\n<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Tip:</b> cover both where possible, but if the stimulus states a stage, make all 3 points relate to it</p></div></div><h3>Government Influences</h3><p><span class=\"lb def\">Def</span> economic (monetary and fiscal) and legal policies that influence consumer buying, consumption and the marketing plan</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Fiscal policy: federal Budget and taxation</li>\n<li>Monetary policy: RBA cash rate → interest rates → borrowing and spending</li>\n<li>Regulatory bodies: ACCC, ASIC</li>\n<li>Legislation: Competition and Consumer Act 2010 (Cth) including ACL; Fair Trading Act 1987 (NSW)</li>\n</ul>\n<p><span class=\"lb how\">How it influences marketing</span></p>\n<ul>\n<li>GST changes → price</li>\n<li>personal income tax changes → consumer purchasing power (sales)</li>\n<li>more regulation → less access to goods, or higher production costs passed on (cost-based pricing)</li>\n</ul>", "related": []}, {"id": "marketing-i2", "t": "Consumer laws", "rest": "", "subs": ["deceptive and misleading advertising", "price discrimination", "implied conditions", "warranties"], "mn": "WIPD", "html": "<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>main legislation: Competition and Consumer Act 2010 (Cth) (CCA); Schedule 2 is the Australian Consumer Law (ACL)</li>\n<li>purpose:\n<ul>\n<li>protect consumers against undesirable practices (e.g. misleading and deceptive conduct)</li>\n<li>regulate trade practices that restrict competition (e.g. monopolistic behaviour)</li>\n<li>create confidence in the market, fostering consumption</li>\n</ul></li>\n<li>regulator: ACCC monitors, investigates and enforces CCA/ACL\n<ul>\n<li>power to initiate Federal Court action</li>\n<li>fines for breaches (e.g. unconscionable conduct): up to $10m for businesses and $500,000 for individuals per breach</li>\n<li>unconscionable conduct: so harsh it goes against good conscience</li>\n</ul></li>\n<li>4 key laws: Misleading and deceptive advertising, Price discrimination, Implied conditions, Warranties</li>\n</ul>\n<p><span class=\"lb neg\">Common negative for all 4 laws if breached</span> ACCC investigation and Federal Court action → fines up to $10m (companies) and $500,000 (individuals) → damaged brand image, lost loyalty, lower sales and profitability</p><h3>Deceptive and Misleading Advertising</h3><p><span class=\"lb def\">Def</span> false or misleading claims that harm and deceive the consumer</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>the dominant image and overall impression cannot be deceptive or misleading</li>\n<li>examples: fine print conditions; distorted before and after images; unsubstantiated tests and surveys (e.g. \"9/10 prefer\"); wrong country of origin; packaging size or shape misleading; \"limited time\" offers always available; bait and switch (low price lure, stock runs out, redirected to dearer items); dishonest claims of a quality the product lacks</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>if compliant: protects consumers, maintains brand image, improves loyalty and sales</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>ACCC investigation; substantiation notice to prove claims within 21 days; if unable, fines</li>\n</ul><h3>Price Discrimination</h3><p><span class=\"lb def\">Def</span> different prices for the same product in separate markets</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>prohibited IF it could substantially reduce competition (barrier to entry, forcing competitors out)</li>\n<li>legal in some cases: transport costs where markets are geographically separated; market-specific tariffs or taxes</li>\n<li>can occur between retailer and consumer, and supplier and retailer</li>\n</ul><h3>Implied Conditions</h3><p><span class=\"lb def\">Def</span> unspoken and unwritten terms of a contract</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>ACL guarantees them on purchase</li>\n<li>Goods (G-FMP): merchantable quality (safe, durable, free from defects); fit for purpose; matches description</li>\n<li>Services (S-CFT): due care and skill; fit for purpose; completed in a reasonable timeframe</li>\n<li>businesses must honour a refund, repair or replacement for major or minor failure</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>compliant promotional material and product design may raise costs</li>\n<li>refunds, replacements or repairs raise costs and reduce profitability</li>\n</ul><h3>Warranties</h3><p><span class=\"lb def\">Def</span> promise to repair or replace defective products, giving customers protection</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>minor failure: business chooses repair, replacement or refund</li>\n<li>major failure: customer chooses</li>\n<li>must offer a refund if faulty within an unreasonable timeframe, does not match description, or fails to perform</li>\n<li>examples: Volkswagen (5-year unlimited km, sold after 1 Jan 2019); Kia (7-year unlimited km, sold after 1 Oct 2014)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>promotional tool giving assurance of quality; advertise a longer warranty than competitors</li>\n<li>more enticed consumers, higher market share, revenue and profitability</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>consistently poor quality: more complaints (bad word of mouth, lower sales and share) and more claims (repair, replacement and refund costs)</li>\n</ul>", "related": []}, {"id": "marketing-i3", "t": "Ethical", "rest": "truth, accuracy and good taste in advertising, products that may damage health, engaging in fair competition, sugging", "subs": [], "mn": "GTAPES", "html": "<p><span class=\"lb def\">Def</span> societal values and standards governing how businesses operate, decide and treat customers</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>5 influences: Truth, Accuracy and good taste, Products that may damage health, Engaging in fair competition, Sugging</li>\n<li>marketing should go above legal requirements and work in the spirit of the law</li>\n<li>ethical criticisms: creating materialism, stereotypes, using sex to sell, product placement, invasion of privacy</li>\n<li>Advertising Standards Bureau (ASB): national advertising self-regulation (Advertising Standards Board and Advertising Claims Board)</li>\n<li>AANA: Code of Ethics to regulate marketing</li>\n</ul><h3>Truth and Accuracy in Advertising</h3><p><span class=\"lb def\">Def</span> not conveying the complete truth or accurate information about a product</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>concealed facts: key information omitted on purpose</li>\n<li>puffery: extreme exaggeration no reasonable person takes as fact (e.g. \"best steaks on earth\")</li>\n<li>vague statements: ambiguous, letting marketer deny intent to mislead</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>submit material to ASB or AANA for approval: ensures compliance, maintains brand image and loyalty</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>damaged brand image and reputation, reduced loyalty, lower sales and profitability</li>\n</ul><h3>Good Taste in Advertising</h3><p><span class=\"lb def\">Def</span> societal norms and expectations about advertising content</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>tastes are subjective; objectively unethical themes include oversexualisation, discrimination, mature content shown to children</li>\n<li>consider characteristics of the target market</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>submit material to ASB or AANA for approval (as above)</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>bad taste has cut-through but customers generally respond poorly: damaged image, lost loyalty and market share</li>\n</ul><h3>Products That May Damage Health</h3><p><span class=\"lb def\">Def</span> products with a detrimental impact on health and quality of life</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>unethical to promote harmful products as harmless</li>\n<li>unethical to create demand for health-damaging products (e.g. vapes)</li>\n<li>children often targeted to influence parents' buying (e.g. digital junk food ads)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>marketing products that enhance wellbeing gives favourable image and publicity, loyalty and sales</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>health-damaging products viewed unfavourably in a health-conscious society: damaged perception, bad publicity, less loyalty and sales</li>\n<li>Federal Government restricts goods and services detrimental to health (cigarettes, vapes, alcohol, gambling)</li>\n</ul><h3>Engaging in Fair Competition</h3><p><span class=\"lb def\">Def</span> market practices that maintain competition and do not exploit consumers</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>ACCC promotes fair behaviour towards competitors and takes complaints about breaches of CCA/ACL</li>\n<li>anti-competitive behaviour:\n<ul>\n<li>cartel conduct/price collusion: businesses agree to act together instead of competing</li>\n<li>anti-competitive agreement: contracts that substantially lessen competition</li>\n<li>misuse of market power: dominant business damages competitors or blocks entry (e.g. lowering prices to eliminate competition)</li>\n<li>exclusive dealing: dominant business forces a supplier to be exclusive</li>\n<li>resale price maintenance: suppliers can only recommend a price, cannot stop resellers charging less</li>\n<li>mergers and acquisitions: ACCC prohibits those that substantially reduce competition</li>\n</ul></li>\n</ul><h3>Sugging</h3><p><span class=\"lb def\">Def</span> selling under the guise of market research (e.g. a survey)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>NOT illegal but raises ethical concerns (invasion of privacy, deception)</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>people wary of genuine market research in future</li>\n<li>damaged reputation, less loyalty and sales</li>\n</ul>", "related": []}]}, {"key": "P", "name": "Processes", "mn": "SMEIDI", "intro": "", "pts": [{"id": "marketing-p1", "t": "Situational analysis", "rest": "SWOT, product life cycle", "subs": [], "mn": "SP", "html": "<p><span class=\"lb def\">Def</span> precise understanding of a business's competitive position in its environment</p>\n<p><span class=\"lb k\">Characteristics and features</span> 2 components: SWOT analysis, Product life cycle</p><h3>SWOT Analysis</h3><p><span class=\"lb def\">Def</span> identifying the internal strengths and weaknesses and the external opportunities and threats</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Internal: Strengths (skilled workforce, strong finances); Weaknesses (technology nearing obsolescence, facilities in disrepair)</li>\n<li>External: Opportunities (falling interest rates, new technology); Threats (new laws, competitors gaining share)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>clear view of position against competitors</li>\n<li>modify plans to capitalise on strengths and opportunities</li>\n<li>modify plans to mitigate weaknesses and threats</li>\n</ul><h3>Product Life Cycle (PLC)</h3><p><span class=\"lb def\">Def</span> stages a product experiences over its life: introduction, growth, maturity, decline</p>\n<p><span class=\"lb k\">Characteristics and features</span> strategies differ at each stage to achieve marketing goals efficiently</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Stage</th>\n<th>Def</th>\n<th>Characteristics</th>\n<th>Strategies</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Introduction</td>\n<td>build awareness and market share</td>\n<td>limited awareness, slow sales, limited profit or loss</td>\n<td>• intensive promotion<br />\n• penetration or loss-leader pricing<br />\n• indirect channels (established retail networks)</td>\n</tr>\n<tr>\n<td>Growth</td>\n<td>brand acceptance and market share pursued</td>\n<td>rapid sales increase, rising share and profit</td>\n<td>• brand loyalty via relationship marketing<br />\n• maintain or raise prices<br />\n• geographic expansion or more channels</td>\n</tr>\n<tr>\n<td>Maturity</td>\n<td>sales plateau as market saturates</td>\n<td>sales level off, many competitors, profits begin to fall</td>\n<td>• redesign packaging<br />\n• new features to differentiate<br />\n• lower price to hold share</td>\n</tr>\n<tr>\n<td>Decline</td>\n<td>sales fall, options such as discontinuing</td>\n<td>sales decline, possible product deletion, new product introduction</td>\n<td>• narrow customer focus and channels<br />\n• limited production<br />\n• reduce price to clear stock<br />\n• stop promotion</td>\n</tr>\n</tbody>\n</table></div>", "related": []}, {"id": "marketing-p2", "t": "Market research", "rest": "", "subs": [], "mn": "DDD", "html": "<p><span class=\"lb def\">Def</span> systematic collecting, recording and analysing of information on a specific marketing issue</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>gives qualitative and quantitative data</li>\n<li>lets a business develop strategies and take corrective action</li>\n<li>3 steps: Determining information needs, Data collection, Data analysis and interpretation</li>\n</ul>\n<p><strong>Step 1: Determining information needs</strong></p>\n<ul>\n<li>identify the situation or problem to decide what to measure</li>\n<li>consider business goals or current problems</li>\n</ul>\n<p><strong>Step 2: Data collection</strong></p>\n<ul>\n<li>Primary data: facts from original sources for the specific problem\n<ul>\n<li>Survey: personal interviews, focus groups, telephone, questionnaires</li>\n<li>Observation: personal (mystery shopper), electronic (cameras, scanners recording sales and purchase patterns)</li>\n<li>Experiment: change variables to observe effects</li>\n</ul></li>\n<li>Secondary data: already collected for another purpose\n<ul>\n<li>Internal: customer feedback, sales reports, research reports</li>\n<li>External: news articles, research publications, ABS and government publications, industry reports</li>\n</ul></li>\n</ul>\n<p><strong>Step 3: Data analysis and interpretation</strong></p>\n<ul>\n<li>convert raw data into useful information</li>\n<li>statistical analysis finds trends and patterns so strategies and corrective action can follow</li>\n</ul>\n<p><span class=\"lb k\">Implications (as a whole)</span></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>better insight into consumer buying behaviour</li>\n<li>refines strategies to satisfy specific needs, helps achieve objectives</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>time and cost of collecting primary data</li>\n<li>potential bias and unreliable data (small samples)</li>\n</ul></li>\n</ul>", "related": []}, {"id": "marketing-p3", "t": "Establishing market objectives", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> realistic and measurable goals achieved through the marketing plan</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>follow the SMART framework (specific, measurable, achievable, realistic, timely)</li>\n<li>common objectives: increasing sales revenue; profit maximisation; new geographic markets; market share (share of total industry sales for a product); expanding product range/mix; improving quality of customer service (responding to customer needs and problems)</li>\n<li>customer service enhanced through staff training and customer-orientation (not sales-orientation)</li>\n</ul>", "related": []}, {"id": "marketing-p4", "t": "Identifying target markets", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> group of present and potential customers the business intends to sell to</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Primary target market: where most marketing resources go; Secondary: smaller, less important</li>\n<li>3 approaches:\n<ul>\n<li>Mass marketing: total market/entire population</li>\n<li>Market segmentation: subdividing the market into groups sharing characteristics (geographic, demographic, psychographic, behavioural)</li>\n<li>Niche market: narrowly selected segment</li>\n</ul></li>\n</ul>\n<p><span class=\"lb pos\">Positives (if appropriately identified)</span></p>\n<ul>\n<li>marketing resources used more efficiently</li>\n<li>promotional material more relevant to customer needs</li>\n<li>better understanding of the target market's buying behaviour</li>\n</ul>", "related": []}, {"id": "marketing-p5", "t": "Developing marketing strategies", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> actions to achieve marketing objectives through the marketing mix (7Ps)</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>P</th>\n<th>Def</th>\n<th>Features</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Product</td>\n<td>goods or services offered to satisfy a need or want</td>\n<td>branding, packaging, labelling</td>\n</tr>\n<tr>\n<td>Price</td>\n<td>amount a customer will offer in exchange</td>\n<td>• methods: cost, market, competition-based<br />\n• strategies: skimming, penetration, loss leader, price points</td>\n</tr>\n<tr>\n<td>Place</td>\n<td>making products available when and where customers want them</td>\n<td>distribution channels, channel choice, physical distribution</td>\n</tr>\n<tr>\n<td>Promotion</td>\n<td>informing, persuading, reminding a target market</td>\n<td>advertising, personal selling, relationship marketing, sales promotion, publicity and PR</td>\n</tr>\n<tr>\n<td>People</td>\n<td>quality of interaction between customer and those delivering the service</td>\n<td></td>\n</tr>\n<tr>\n<td>Processes</td>\n<td>flow of activities in delivering a service</td>\n<td></td>\n</tr>\n<tr>\n<td>Physical evidence</td>\n<td>environment where service is delivered, plus materials</td>\n<td>signage, brochures, letterheads</td>\n</tr>\n</tbody>\n</table></div>", "related": []}, {"id": "marketing-p6", "t": "Implementation, monitoring and controlling", "rest": "developing a financial forecast; comparing actual and planned results, revising the marketing strategy", "subs": [], "mn": "", "html": "<ul>\n<li>Implementation: putting the marketing plan and strategies into operation</li>\n<li>Monitoring: measuring actual results against planned performance</li>\n<li>Controlling: establishing a KPI and taking corrective action to achieve it and the objectives</li>\n</ul>\n<p><strong>Implementation: developing a financial forecast</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> detailed plan of cost and revenue projections, helps allocate marketing resources</li>\n<li>2 steps: cost estimate (market research, product development, promotion, distribution); revenue estimate (expected sales: how much consumers buy and at what price)</li>\n</ul>\n<p><strong>Monitoring: comparing actual vs planned results (SMM)</strong></p>\n<ul>\n<li>Sales analysis: actual vs planned by region, product category, retail/non-retail outlets</li>\n<li>Market share analysis: actual vs planned share against competitors</li>\n<li>Marketing profitability analysis: break expenses and results into activities to assess each activity's effectiveness</li>\n</ul>\n<p><strong>Controlling: revising the marketing strategy (NPC)</strong></p>\n<ul>\n<li>changes in the marketing mix (product, promotion, place, price)</li>\n<li>new product development to replace products in decline</li>\n<li>product deletion of outdated or non-performing products</li>\n</ul>", "related": []}]}, {"key": "S", "name": "Strategies", "mn": "", "intro": "<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> Marketing mix M PPPP PEG (Product, Price, Place, Promotion, People, Processes, Physical evidence); DGPB (segmentation variables)</p></div></div>", "pts": [{"id": "marketing-s1", "t": "Market segmentation, product/service differentiation and positioning", "rest": "", "subs": [], "mn": "DGPB", "html": "<h3>Market Segmentation (DGPB)</h3><p><span class=\"lb def\">Def</span> total market subdivided into groups sharing one or more characteristics (segments)</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>manager selects one segment as the target market</li>\n<li>4 variables (do not confuse with PEGS):\n<ul>\n<li>Demographic: age, gender, education, occupation, income, social class, religion, ethnicity</li>\n<li>Geographic: region, urban, suburban, rural, city size, climate, landforms</li>\n<li>Psychographic: lifestyle, personality, motives, socioeconomic group, opinions, interests</li>\n<li>Behavioural: purchase occasion, benefits sought, loyalty, usage rate, price sensitivity</li>\n</ul></li>\n<li>example (behavioural): Telstra and Optus price points by usage (calls and data plans)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>market research can then target buying behaviour</li>\n<li>strategies refined to satisfy specific needs and wants</li>\n<li>resources used more efficiently</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>without it: poor understanding of needs, resources and strategies used inefficiently</li>\n<li>segmentation research very expensive, especially for new businesses with no internal secondary data</li>\n</ul><h3>Product/Service Differentiation</h3><p><span class=\"lb def\">Def</span> developing and promoting differences between the business's products or services and competitors'</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>points of differentiation: customer service (personalised, after-sales); convenience (online, apps, home delivery); social and ethical issues (e.g. Fair Trade); environmentally friendly products; features and performance</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>positive publicity</li>\n<li>increases brand loyalty</li>\n<li>long-term sustainable competitive advantage</li>\n</ul><h3>Positioning</h3><p><span class=\"lb def\">Def</span> a consumer's perception of a brand or product relative to competitors</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>e.g. Rolex and Ferrari evoke quality and luxury</li>\n<li>variables: brand name, price, quality, packaging, channels of distribution</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>correct positioning induces sales (target market believes products suit them), long-term sustainable competitive advantage</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>incorrect positioning leads the target market to prefer competitors, lost sales</li>\n</ul>", "related": []}, {"id": "marketing-s2", "t": "Products", "rest": "goods and/or services", "subs": ["branding", "packaging"], "mn": "", "html": "<p><span class=\"lb def\">Def</span> products offered in exchange to satisfy a need or want</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>total product concept: tangible and intangible benefits</li>\n<li>tangible: features, quality, quantity, packaging</li>\n<li>intangible: pre-sale and after-sale service, reputation, warranty</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>better meeting target market needs than competitors gives long-term sustainable competitive advantage</li>\n</ul><h3>Branding</h3><p><span class=\"lb def\">Def</span> name, term, symbol, design or combination identifying a product and distinguishing it from competition</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>brand symbol/logo: graphic identifying a business or product</li>\n<li>trademark: registered brand name or logo for exclusive use</li>\n<li>significant funds spent so customers instantly recognise the brand</li>\n<li>how: recognisable colours and a distinct logo on website, store and product</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>repeat sales through brand loyalty, higher sales and profit</li>\n<li>higher prices charged (trust and familiarity)</li>\n<li>easier introduction of new products (lower perceived risk)</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>time and cost intensive</li>\n<li>vulnerable to negative publicity, hard to change public perception</li>\n</ul><h3>Packaging</h3><p><span class=\"lb def\">Def</span> developing a container and graphic design for a product</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>functional and marketing component, supports positioning</li>\n<li>aims: identification, containment, protection, safety, attractiveness</li>\n<li>consider colour, size, brand placement, shape, texture, graphics, labelling (truthful; link to deceptive advertising), government regulations</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>positive impression, encourages first-time customers (signals luxury or quality)</li>\n<li>preserves and protects product from damage or tampering</li>\n<li>easier, more efficient transport and storage</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>high quality packaging is expensive, hurts profitability</li>\n<li>excessive packaging damages brand image (environmental backlash)</li>\n<li>regulations may limit attractiveness and sales (e.g. plain packaging, health warnings)</li>\n</ul>", "related": []}, {"id": "marketing-s3", "t": "Price including pricing methods", "rest": "cost, market, competition-based", "subs": ["pricing strategies – skimming, penetration, loss leaders, price points", "price and quality interaction"], "mn": "CMC, PPPL", "html": "<h3>Price (CMC, SLPP)</h3><p><span class=\"lb def\">Def</span> amount a customer is prepared to offer in exchange for a product</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>too high: lost sales unless superior benefits; too low: impression of cheap, poor quality</li>\n<li>methods: cost-based (mark-up), market-based, competition-based</li>\n<li>strategies: skimming, penetration, loss leaders, price points</li>\n<li>influenced by: degree of competition, branding and positioning, cost of manufacturing, customer loyalty, product life cycle</li>\n<li>methods set the base price, a strategy then adapts to the market</li>\n<li>effects: creates customer perception and positioning; a point of differentiation; a promotional strategy; drives buying behaviour; determines profit</li>\n</ul><h4>Pricing Methods</h4><p><strong>Cost-based</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> cost of production plus a pre-determined mark-up/profit margin</li>\n<li>Features: direct material and labour plus overheads; mark-up usually a percentage</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>ensures profit on all units sold</li>\n<li>effective for new products with unknown demand</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> hard to determine an appropriate mark-up</li>\n</ul>\n<p><strong>Market-based</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> prices set by interaction of supply and demand</li>\n<li>Features: price at what the market will pay; often seasonal products (fruit, holiday accommodation)</li>\n<li><span class=\"lb pos\">Positives</span> low supply or high demand lets business maximise margins</li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high supply or low demand may force pricing below cost (especially perishables), hurts profit</li>\n<li>hard to apply as supply and demand constantly change</li>\n</ul></li>\n</ul>\n<p><strong>Competition-based</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> prices comparable to competitors (below, equal or above)</li>\n<li>Features: price leader (major business whose pricing heavily influences competitors); positioning and branding decide whether to price below, equal or above</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>below: gains share, attracts price-conscious consumers</li>\n<li>above: perceived as superior, builds competitive advantage</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>below: could hurt positioning, perception of inferior quality</li>\n<li>above: cannot attract price-conscious consumers</li>\n</ul></li>\n</ul><h4>Pricing Strategies</h4><p><strong>Price Skimming</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> highest possible price in the introduction stage</li>\n<li>Features: for innovative products, targets early buyers less sensitive to price</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>high margins offset large R&amp;D costs</li>\n<li>if demand is inelastic, maximises profit</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high margins attract competitors who undercut, lost share</li>\n<li>limits the consumer pool, lost sales</li>\n</ul></li>\n</ul>\n<p><strong>Price Penetration</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> lowest price possible to achieve large market share (mass-market pricing)</li>\n<li>Features: usually early in the product life cycle</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>larger market share</li>\n<li>discourages competitor entry</li>\n<li>encourages trial</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> hard to raise prices later (customers used to low price)</li>\n</ul>\n<p><strong>Loss Leader</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> product sold at or below cost price</li>\n<li>Features: for overstocked, soon-to-be discontinued or perishable items, or building a reputation for low prices</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>drives foot traffic, loss recovered by cross-selling</li>\n<li>sells perishables nearing expiry and overstock</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> short-term, hurts profit, does not support long-term sustainability</li>\n</ul>\n<p><strong>Price Points</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> selling only at certain pre-determined prices to appeal to a broad market</li>\n<li>Features: various prices for similar products with slight quality/feature differences; specific prices such as \".99\" appeal psychologically</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>reaches a broader group (low prices for price-conscious, high for higher socioeconomic)</li>\n<li>easier for customers to find the quality they want</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span> greater operational costs producing variations for each price point, lowers profitability</li>\n</ul><h3>Price and Quality Interaction</h3><p><span class=\"lb def\">Def</span> relationship between price and quality, consumers often judge quality by price</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>prestige/premium pricing: high price to signal quality and status (NOT a syllabus strategy)</li>\n<li>consumers expect price rises to match quality</li>\n<li>quality increases generally need price rises to cover costs and keep margins</li>\n</ul>", "related": []}, {"id": "marketing-s4", "t": "Promotion", "rest": "", "subs": ["elements of the promotion mix – advertising, personal selling and relationship marketing, sales promotions, publicity and public relations", "the communication process – opinion leaders, word of mouth"], "mn": "RAPPPS, OLWOM", "html": "<p><span class=\"lb def\">Def</span> strategies to inform, persuade and remind a target market about products</p>\n<p><span class=\"lb k\">Characteristics and features</span> promotional mix: Advertising, Personal selling, Relationship marketing, Sales promotion, Publicity, Public relations</p><h3>Advertising</h3><ul>\n<li><span class=\"lb def\">Def</span> paid communication about a product designed to persuade a target market</li>\n<li><span class=\"lb how\">How (types)</span> mass marketing (TV, radio, newspapers, magazines); direct marketing catalogues; telemarketing; e-marketing; social media (TikTok, Instagram, Facebook); billboards</li>\n<li>Features: type depends on product, target market size, budget, cost, PLC position</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>encourages repeat sales: reinforces brand awareness among existing customers</li>\n<li>strengthens brand loyalty and image: emotional connection</li>\n<li>educates consumers on features, benefits and value</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>costly forms (e.g. TV), wasteful if the message misses the target market</li>\n<li>advertisement fatigue: boredom or irritation, consumers tune out</li>\n<li>may be misinterpreted if poorly designed</li>\n</ul></li>\n</ul><h3>Personal Selling</h3><ul>\n<li><span class=\"lb def\">Def</span> direct, two-way communication between a sales representative and customer to make a sale</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>immediate feedback: addresses doubts in real time, secures sales</li>\n<li>customised message to each customer</li>\n<li>stronger relationships: trust, loyalty, repeat business</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cost intensive hiring and training of sales staff</li>\n<li>time-consuming, more time per customer</li>\n<li>limited reach: one customer at a time, customers may resist pitches</li>\n</ul></li>\n</ul><h3>Relationship Marketing</h3><ul>\n<li><span class=\"lb def\">Def</span> encouraging repeat business through long-term, strong relationships with individual customers</li>\n<li><span class=\"lb how\">How</span> loyalty programs, exclusive club memberships, targeted deals (rewards, points, cashback)</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>customer loyalty and repeat sales</li>\n<li>gathers consumer data (loyalty programs, apps) for analytics and trends, competitive advantage</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high initial and ongoing costs (CRM systems, programs, discounts, free rewards)</li>\n<li>privacy and data security concerns: ethical and legal issues, data leaks lose trust</li>\n</ul></li>\n</ul><h3>Sales Promotion</h3><ul>\n<li><span class=\"lb def\">Def</span> activities or materials used to attract direct consumer interest in the product</li>\n<li><span class=\"lb how\">How</span> discounts, coupons, cashback offers</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>increases awareness (incentives such as discounts or free trials for new products)</li>\n<li>temporary increase in market share, short-term customers may become loyal</li>\n<li>stimulates repeat purchases</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>encourages price sensitivity: consumers wait for discounts, delayed sales</li>\n<li>cost intensive: excess discounts reduce margins</li>\n<li>brand dilution: associated with discounts, reduced premium value</li>\n</ul></li>\n</ul><h3>Publicity and Public Relations</h3><ul>\n<li>Publicity: free news stories about a business's products, positive or negative (news, vlogs/blogs, reviews, social media comments)</li>\n<li>Public Relations: activities creating and maintaining favourable relations between a business and its customers; how: press releases, publicising CSR, donations and charity events, sponsorships</li>\n<li><span class=\"lb pos\">Positives (both)</span>\n<ul>\n<li>enhances brand image and credibility</li>\n<li>raises awareness at low cost</li>\n<li>helps repair or offset negative perception</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>Publicity: no control over the message (misinterpretation or backlash); unpredictable timing; short-term impact (replaced by newer headlines)</li>\n<li>PR: no guarantee of success, story may not be picked up, poor ROI</li>\n</ul></li>\n</ul><h3>The Communication Process</h3><ul>\n<li>Channel: any method of carrying a message (e.g. print and electronic advertising)</li>\n<li>Noise: interference at any stage of communication (faulty printing, inappropriate language or images, jargon, misinterpretation)</li>\n<li>Opinion leaders: significant people who influence others' decisions (actors, musicians, athletes)\n<ul>\n<li>Positive: increases trustworthiness of the communication and brand</li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>expensive to hire</li>\n<li>poor behaviour of the figure may damage reputation</li>\n</ul></li>\n</ul></li>\n<li>Word of mouth: people influencing each other in day-to-day conversation; growing in effectiveness via social media\n<ul>\n<li>Positive: more trusted (consumers trust peer groups more than businesses)</li>\n<li>Negative: negative brand image spreads very quickly</li>\n</ul></li>\n</ul>", "related": []}, {"id": "marketing-s5", "t": "Place/distribution", "rest": "", "subs": ["distribution channels", "channel choice – intensive, selective, exclusive", "physical distribution issues – transport, warehousing, inventory"], "mn": "ISE, WIT", "html": "<h3>Place/Distribution</h3><p><span class=\"lb def\">Def</span> activities making products available to customers when and where they want to buy them</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>distribution channels: routes from factory to customer</li>\n<li>direct can be cost-intensive (freight, warehousing, inventory); indirect gives greater reach (more retailers) and access</li>\n</ul>\n<p><strong>Direct Distribution</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> manufacturer to consumer, no intermediaries</li>\n<li><span class=\"lb how\">How</span> Manufacturer → Consumer</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>full control over brand and customer experience</li>\n<li>higher profit margin (no intermediary commission or markups)</li>\n<li>closer customer relationships: immediate feedback and insight</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>high operational costs (physical stores, sales staff, e-commerce platforms)</li>\n<li>limited reach compared to broader networks</li>\n<li>complex logistics (shipping, inventory, own stores), less focus on core activities</li>\n</ul></li>\n</ul>\n<p><strong>Indirect Distribution</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> manufacturer to intermediaries (retailers, wholesalers, agents), then consumer</li>\n<li><span class=\"lb how\">How (channels)</span>\n<ul>\n<li>Manufacturer → Retailer → Consumer</li>\n<li>Manufacturer → Wholesaler → Retailer → Consumer</li>\n<li>Manufacturer → Agent → Wholesaler → Retailer → Consumer</li>\n</ul></li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>broader market reach through intermediary networks</li>\n<li>reduces operational burden (logistics, inventory handled by 3rd parties)</li>\n<li>faster market penetration: established infrastructure and customers</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>reduced profit margin (shared with intermediaries)</li>\n<li>less control over customer experience, inconsistent messaging</li>\n<li>channel conflict: intermediaries compete, price discrepancies confuse customers</li>\n</ul></li>\n</ul><h3>Channel Choice (Market Coverage)</h3><p><span class=\"lb def\">Def</span> number of outlets a firm chooses for its product</p>\n<p><span class=\"lb k\">Characteristics and features</span> 3 methods: intensive (saturate the market), selective (moderate proportion of outlets), exclusive (single retailer)</p>\n<p><strong>Intensive</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> available at as many retail outlets as possible; suits low price, high turnover products</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>higher sales volume (convenience, impulse purchases)</li>\n<li>builds awareness and market share through in-store visibility</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>higher distribution costs and complexity</li>\n<li>hard to keep consistent pricing and image, channel conflict</li>\n<li>brand dilution (less exclusive)</li>\n</ul></li>\n</ul>\n<p><strong>Selective</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> available at some, but not all, outlets</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>uses retailer expertise, customer base and local knowledge (faster penetration)</li>\n<li>lower distribution costs than intensive</li>\n<li>better brand control (choose retailers matching image)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>hard to keep consistent pricing and image, channel conflict</li>\n<li>limited reach, lower potential sales</li>\n</ul></li>\n</ul>\n<p><strong>Exclusive</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> heavy restrictions on the number of retailers</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>enhances prestige (luxury and exclusivity)</li>\n<li>strong brand control</li>\n<li>simpler logistics</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>limited geographic coverage</li>\n<li>major risk from retailer dependence if they underperform or change strategy</li>\n</ul></li>\n</ul><h3>Physical Distribution Issues</h3><p><span class=\"lb def\">Def</span> all activities for the efficient movement of products from producer to customer</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Transportation: moving a product between locations; method depends on product and degree of service (rail, land, sea, air); needs an intricate network</li>\n<li>Warehousing: receiving, storing and dispatching goods; can be a central organising point</li>\n<li>Inventory control: stock held for sale; find the ideal balance (out of stock = lost sales and share; too much = high storage costs)</li>\n</ul>\n<p><span class=\"lb k\">Issues to consider</span></p>\n<ul>\n<li>perishables: temperature control, failure compromises quality and hurts sales</li>\n<li>delivery time: late delivery or mismanaged inventory means insufficient stock, missed demand, hurt sales</li>\n</ul>", "related": []}, {"id": "marketing-s6", "t": "People, processes and physical evidence", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb k\">Characteristics and features</span> the 3 additional Ps of the marketing mix for services</p>\n<p><strong>People</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> quality of interaction between the customer and those in the business delivering the service (e.g. hotel front office, McDonald's cashiers)</li>\n<li><span class=\"lb pos\">Positives (well-trained, qualified staff and extensive training)</span>\n<ul>\n<li>correct technical and working knowledge improves service quality</li>\n<li>stronger communication, higher-quality interactions</li>\n<li>more positive customer perception from good service and complaint handling</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>poorly trained staff give negative perceptions, damaging image through word of mouth and publicity</li>\n<li>damages the business-consumer relationship, reduces effectiveness of strategies such as relationship marketing</li>\n</ul></li>\n</ul>\n<p><strong>Processes</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> flow of activities followed in delivering a service</li>\n<li><span class=\"lb pos\">Positives (clear, well-planned processes)</span>\n<ul>\n<li>improved efficiency, maintains high quality</li>\n<li>customer needs better addressed, individual solutions found</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>inefficient processes cause frustration and dissatisfaction</li>\n<li>negative publicity and word of mouth (bad reviews)</li>\n</ul></li>\n</ul>\n<p><strong>Physical Evidence</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> environment in which the service is delivered</li>\n<li>Features: includes capital equipment for the service (interior design, websites, cutlery, brochures, signage)</li>\n<li><span class=\"lb pos\">Positives (high quality)</span>\n<ul>\n<li>stronger positive impression, may induce sales and repeat sales</li>\n<li>influences perception of value and quality, improves positioning</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>if it does not match positioning, mixed messages on price-quality</li>\n<li>low quality gives negative first impressions, lost sales</li>\n</ul></li>\n</ul>", "related": []}, {"id": "marketing-s7", "t": "E-marketing", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb def\">Def</span> using the internet to perform marketing activities</p>\n<p><span class=\"lb k\">Characteristics and features</span> technologies: websites, SMS, blogs, social media advertising (SMA), email</p>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>faster, more efficient, cost-effective, reaches wider domestic and global audiences</li>\n<li>increases exposure through online presence, more convenient for consumers</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>internet constantly evolving, difficult and expensive to keep up to date</li>\n<li>criticism online is visible to others, volatile strategy</li>\n</ul>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Technology</th>\n<th>How or feature</th>\n<th>Positive</th>\n<th>Negative</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Websites</td>\n<td>convey information, pictures, videos and text about the business and products</td>\n<td>customisable, extensive information</td>\n<td>must be continually updated, can be expensive</td>\n</tr>\n<tr>\n<td>SMS</td>\n<td></td>\n<td>effective way to reach a large audience</td>\n<td>may infringe privacy</td>\n</tr>\n<tr>\n<td>Blogs</td>\n<td></td>\n<td>consumers put forward new ideas, personal connection</td>\n<td>public forum, potential negative comments</td>\n</tr>\n<tr>\n<td>SMA</td>\n<td></td>\n<td>effective at targeting a younger demographic</td>\n<td>criticism visible to others, volatile</td>\n</tr>\n</tbody>\n</table></div>", "related": []}, {"id": "marketing-s8", "t": "Global marketing", "rest": "", "subs": ["global branding", "standardisation", "customisation", "global pricing", "competitive positioning"], "mn": "GCSCG", "html": "<p><span class=\"lb def\">Def</span> transnational corporations (TNCs) have production facilities in two or more countries and operate worldwide, engaging in global marketing</p>\n<p><span class=\"lb k\">Characteristics and features</span> considerations: Global branding, Standardisation, Customisation, Global pricing, Competitive positioning</p>\n<p><strong>Global Branding</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> international use of a name, term, symbol or logo to distinguish a business's products</li>\n<li><span class=\"lb how\">How</span> names, icons, terms, symbols, logos</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>brand familiarity: uniform worldwide image, more likely purchased over lesser-known brands</li>\n<li>consistent message: one global perception is stronger than varying perceptions by country</li>\n<li>cost-effective: lower cost than customising per country, no constant redesign</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cost and time intensive to develop (brand management staff across markets)</li>\n<li>ignores local customs: less effective, name or logo may offend in some regions</li>\n</ul></li>\n</ul>\n<p><strong>Standardisation</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> assumes product use and needs satisfied are consistent worldwide</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>same materials globally: consistent, recognised brand image</li>\n<li>economies of scale minimise costs (may influence cost-based pricing), price advantage</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cannot address each unique market: vulnerable to domestic competitors using locally relevant promotion, hurts market share</li>\n<li>ignores local conditions: limited customer access, regulations may limit effectiveness</li>\n</ul></li>\n</ul>\n<p><strong>Customisation</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> assumes product use and needs satisfied differ between countries</li>\n<li><span class=\"lb pos\">Positives</span> addresses the unique needs and wants of each market segment (local socioeconomic context, lifestyle, culture), strong satisfaction, more sales and market share</li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>cost intensive: targeted materials, market-specific marketing department, extensive research, lower profits</li>\n<li>if not adopted, reduces competitive advantage</li>\n</ul></li>\n</ul>\n<p><strong>Global Pricing (CMS)</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> how businesses coordinate pricing policy across countries</li>\n<li>Customised pricing: different prices for the same product in different countries; linked to cost-based pricing (transport, taxes, warehousing, tariffs); positives and negatives as for Customisation</li>\n<li>Standardised pricing: same price globally; linked to cost-based pricing (same costs); positives and negatives as for Standardisation (consistent image, economies of scale; cannot address each market or consumers' socioeconomic status)</li>\n<li>Market-customised pricing: prices set to local market conditions (lower with significant competition, higher with a monopoly; consider demand and exchange rates); positives and negatives as for Customised pricing</li>\n</ul>\n<p><strong>Competitive Positioning</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> how a business differentiates its products in the global market</li>\n<li><span class=\"lb how\">How</span> develop high quality products</li>\n<li><span class=\"lb pos\">Positives</span> strong customer loyalty and brand awareness</li>\n</ul>", "related": []}]}]}, {"id": "operations", "name": "Operations", "short": "Operations", "secs": [{"key": "R", "name": "Role", "mn": "", "intro": "", "pts": [{"id": "operations-r1", "t": "Strategic role of operations management", "rest": "cost leadership, good/service differentiation", "subs": [], "mn": "", "html": "<h3>Context: Performance Objectives of Operations (CDF CSQ)</h3><div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Objective</th>\n<th>Def</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cost</td>\n<td>minimising expenses so processes are as cheap as possible</td>\n</tr>\n<tr>\n<td>Dependability</td>\n<td>how consistent and reliable products are in performing their intended purpose (fit for purpose)</td>\n</tr>\n<tr>\n<td>Flexibility</td>\n<td>how quickly processes adjust to market changes (mix of products)</td>\n</tr>\n<tr>\n<td>Customisation</td>\n<td>individualised products for specific customer needs</td>\n</tr>\n<tr>\n<td>Speed</td>\n<td>time for production and operations to respond to changes in demand (volume of products)</td>\n</tr>\n<tr>\n<td>Quality</td>\n<td>standard of product design, manufacturing and service level</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>must be memorised and explicitly linked in SIII and SIV responses</li>\n</ul>\n<p><span class=\"lb k\">Key terminology (common effects across Operations)</span> establish competitive advantage; long-term sustainable competitive advantage; reducing lead times; increasing brand/customer loyalty; minimising wastage; reducing bottlenecks; establish product leadership; cost minimisation; encouraging repeat sales; minimising errors/defects; achieving cost leadership; increasing consumer trust; enhance customer satisfaction; increasing production speed; increasing production efficiency; improved productivity; minimise environmental impacts; increased business competitiveness</p><h3>Strategic Role of Operations Management</h3><p><span class=\"lb def\">Def</span> managing the operations process (production, quality and efficiency) to contribute to the goals and strategic direction of the business</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>achieved by focusing on cost leadership and differentiation of goods and services (quality or features); mention both</li>\n</ul><h4>Cost Leadership</h4><ul>\n<li><span class=\"lb def\">Def</span> outperforming competitors by offering the lowest price in the market, striving to be the lowest cost producer</li>\n<li>Features: costs include inputs, labour, inventory, quality management</li>\n<li><span class=\"lb how\">How</span> standardised goods/services; economies of scale; innovative, cost-efficient production methods; global sourcing or exclusive access to low-cost raw materials</li>\n</ul><h4>Good/Service Differentiation</h4><ul>\n<li><span class=\"lb def\">Def</span> modifying the product so it is unique from competitors' offerings</li>\n<li><span class=\"lb how\">How (goods)</span> features; quality; warranty/after-sales service; unique design/technology; level of customisation</li>\n<li><span class=\"lb how\">How (services)</span> time; expertise of provider; qualifications and experience of provider; level of customisation</li>\n<li><span class=\"lb tip\">Tip</span> always expand on SERVICES as well as goods</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>enhances competitiveness, sustainable long-term competitive advantage</li>\n<li>assists in achieving operational objectives</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>increased costs of differentiating products</li>\n</ul></li>\n</ul>", "related": []}, {"id": "operations-r2", "t": "Goods and/or services in different industries", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb k\">Characteristics and features</span> inputs and operational processes differ for service providers and goods producers</p>\n<p><span class=\"lb k\">Goods are generally</span> tangible; standardised; lengthy time between production and consumption; value more easily determined</p>\n<div class=\"tbl-wrap\"><table class=\"db\">\n<thead>\n<tr>\n<th>Type of good</th>\n<th>Features</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standardised</td>\n<td>• uniform quality, mass produced<br />\n• assists Cost, Quality and Speed, not Customisation</td>\n</tr>\n<tr>\n<td>Customised</td>\n<td>• customer-orientated, meets specific needs<br />\n• assists Customisation, not Speed and Cost</td>\n</tr>\n<tr>\n<td>Perishable</td>\n<td>• very short lead times, quick distribution<br />\n• spoilage/storage and quality are key issues</td>\n</tr>\n<tr>\n<td>Non-perishable</td>\n<td>longer lead times appropriate (do not spoil)</td>\n</tr>\n<tr>\n<td>Intermediate</td>\n<td>processed more than once</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>lead time = time between start of a process and its end</li>\n</ul>", "related": []}, {"id": "operations-r3", "t": "Interdependence with other key business functions", "rest": "", "subs": [], "mn": "", "html": "<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>two-way relationship required (one-way detail is only dependence)</li>\n<li>Operations: manufacturing, services, other value-adding, turning raw materials into finished goods</li>\n<li>Marketing: product design, sales, advertising, strategies (4Ps, segmentation)</li>\n<li>Finance: administration, financial management, financial planning</li>\n<li>HR: industrial relations, HRM, recruitment</li>\n</ul><h3>Operations and Marketing</h3><ul>\n<li>Marketing to Operations:\n<ul>\n<li>market research → target market needs and wants → Operations supplies a high-quality product with appropriate features</li>\n<li>poor quality → complaints → negative brand reputation → Marketing must resolve</li>\n</ul></li>\n<li>Operations to Marketing:\n<ul>\n<li>high-quality product → key point in promotion (advertising) → more sales → profit maximisation and market share</li>\n</ul></li>\n</ul><h3>Operations and Finance</h3><ul>\n<li>Finance to Operations:\n<ul>\n<li>budgets and funds → inputs, equipment, production costs → well-resourced Operations → quality products</li>\n</ul></li>\n<li>Operations to Finance:\n<ul>\n<li>quality, well-made products → higher profits → furthers Finance's ability to fund Operations and other KBFs</li>\n</ul></li>\n</ul><h3>Operations and HR</h3><ul>\n<li>HR to Operations:\n<ul>\n<li>training, development and recruiting of skilled workers → enhances 'transforming resources' → more efficient transformation of inputs into higher-quality goods and services</li>\n</ul></li>\n<li>Operations to HR:\n<ul>\n<li>sequencing and scheduling (Gantt charts, critical path analysis) → insights shared with HR → HR plans training and development → employees upskilled → projects completed on time per the Gantt chart</li>\n</ul></li>\n</ul>", "related": []}]}, {"key": "I", "name": "Influences", "mn": "TEGGL QC", "intro": "<p><span class=\"lb k\">Characteristics and features</span> 7 influences: Technology, Environmental sustainability, Globalisation, Government policies, Legal regulations, Quality expectations, Cost-based competition</p>", "pts": [{"id": "operations-i1", "t": "Globalisation, technology, quality expectations, cost-based competition, government policies, legal regulation, environmental sustainability", "rest": "", "subs": [], "mn": "TEGGLQC, RAGGG", "html": "<h3>Globalisation (RAGGG)</h3><p><span class=\"lb def\">Def</span> removal of trade barriers between countries and greater transfer of capital, labour and resources</p>\n<p><span class=\"lb how\">How (be specific)</span> global sourcing of inputs; global web of suppliers; relocation of manufacturing; global outsourcing; access to global consumers</p>\n<div class=\"callout\"><span class=\"ic\">!</span><div class=\"ct\"><p><b>Note:</b> overlaps with Global Sourcing (Strategies); link to objectives (CDF CSQ)</p></div></div>\n<p><strong>Global Sourcing of Inputs</strong></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>access to unique inputs not available domestically</li>\n<li>higher quality inputs</li>\n<li>lower cost inputs</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>unfavourable exchange rates could cut savings</li>\n<li>cheaper inputs may be inferior</li>\n<li>exposed to transport/shipping delays</li>\n</ul></li>\n</ul>\n<p><strong>Global Web of Suppliers</strong></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>suppliers in different locations (more low-cost or unique inputs)</li>\n<li>manages delays and shortages (switch suppliers)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>logistical complexity across locations</li>\n<li>overseas suppliers vary in reliability and responsiveness</li>\n<li>exposed to transport/shipping delays</li>\n</ul></li>\n</ul>\n<p><strong>Relocation of Manufacturing</strong></p>\n<ul>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>lower labour costs</li>\n<li>reduced compliance costs</li>\n<li>more skilled workforce</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>communication hindered (language, miscommunication)</li>\n<li>bad publicity if domestic jobs lost</li>\n</ul></li>\n</ul>\n<p><strong>Global Outsourcing</strong></p>\n<ul>\n<li><span class=\"lb def\">Def</span> overseas contractor manufactures the business's product</li>\n<li><span class=\"lb pos\">Positives</span>\n<ul>\n<li>cost savings (cheaper labour, lower compliance costs)</li>\n<li>efficiency and speed (superior overseas technology and skills)</li>\n</ul></li>\n<li><span class=\"lb neg\">Negatives</span>\n<ul>\n<li>quality concerns (less oversight)</li>\n<li>communication and language barriers</li>\n<li>brand image tied to the contractor's ethical actions and domestic job losses</li>\n</ul></li>\n</ul>\n<p><strong>Access to Global Consumers</strong></p>\n<ul>\n<li>sell to more consumers, higher demand may lead to economies of scale</li>\n</ul><h3>Technology</h3><p><span class=\"lb def\">Def</span> design or application of innovative devices and systems in the operations process</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Leading-edge: 3D printing, drone delivery, machine learning/AI, robotics</li>\n<li>Established: x-rays, CAD/CAM, barcoding, EFT, data analytics</li>\n<li>used in inventory management, manufacturing, quality management, supply chain management (logistics)</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>minimises long-term costs: robotics replace labour, lower ongoing labour expenses</li>\n<li>improved flexibility and speed: robotics run 24/7 with no absenteeism, fatigue or human error, consistent output, shorter lead times</li>\n<li>increased quality: x-rays scan internals, detect invisible faults, fewer defects, lower warranty and after-sales costs</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>additional costs: large upfront capital, maintenance, staff training</li>\n<li>over-reliance: single point of failure (outages, cyberattacks, malfunctions) halts production, cuts speed and flexibility</li>\n<li>becomes outdated: rapid innovation, ongoing capital expenditure to upgrade</li>\n</ul><h3>Quality Expectations</h3><p><span class=\"lb def\">Def</span> level of quality, durability and benefits of a good or service that appropriately satisfies consumers</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>Goods (G-QFD): Quality of design (materials, aesthetics, innovation), Fit for purpose (ease of use, functional), Durability (reliable, long-lasting)</li>\n<li>Services (S-RPL): Professionalism (cleanliness, layout, courtesy), Reliability of provider (efficiency, competence), Level of customisation</li>\n<li>cover BOTH goods and services in large short answers, SIII and SIV</li>\n</ul>\n<p><span class=\"lb how\">How to improve quality</span></p>\n<ul>\n<li>inputs: quality improvement (QI) strategies, higher quality raw materials</li>\n<li>transformation: supervisors inspecting (QC), established technologies (robotics)</li>\n<li>outputs: quality assurance (ISO 9000 and 9001) on finished products, training for stronger customer service</li>\n</ul>\n<p><span class=\"lb pos\">Positives (if met)</span></p>\n<ul>\n<li>increased customer satisfaction, fewer complaints</li>\n<li>reduced defects, lower warranty and repair/replacement costs</li>\n</ul>\n<p><span class=\"lb neg\">Negatives (if not met, or when meeting them)</span></p>\n<ul>\n<li>costs rise further (defects, warranties, repairs) if not met</li>\n<li>decreased speed if processes take longer to meet expectations</li>\n</ul><h3>Cost-based Competition</h3><p><span class=\"lb def\">Def</span> increased competition on cost, driven by globalisation</p>\n<p><span class=\"lb k\">Characteristics and features</span> lower production costs allow lower prices, pressuring others to follow</p>\n<p><span class=\"lb how\">How (cost reduction)</span> standardised products; economies of scale (bulk buying); cheaper suppliers; automated production systems</p>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>lower cost of production (inputs and labour)</li>\n<li>automation improves efficiency, reduces wastage, improves quality</li>\n<li>achieves cost leadership and long-term sustainable competitive advantage</li>\n</ul>\n<p><span class=\"lb neg\">Negatives</span></p>\n<ul>\n<li>cost-cutting may hurt quality</li>\n<li>standardised products do not satisfy the need for customisation</li>\n<li>cost-reducing technology needs large upfront capital</li>\n</ul><h3>Government Policies</h3><p><span class=\"lb def\">Def</span> announced government intentions and political decisions that affect operations as businesses prepare for impending legal regulation</p>\n<p><span class=\"lb k\">Characteristics and features</span></p>\n<ul>\n<li>examples: NSW Plastic Reduction Act 2017, Light Bulb Act 2007</li>\n<li>COVID-19: public health orders (closed stores, capacity limits, distancing, store layout, sanitiser); lockdown work from home mandate (Zoom)</li>\n<li>others: national energy efficiency strategy, WH&amp;S regulations, carbon tax, Fair Work Act, anti-discrimination laws</li>\n<li>think about which operations processes/strategies each policy influences</li>\n</ul>\n<p><span class=\"lb pos\">Positives</span></p>\n<ul>\n<li>government incentives: grants, subsidies or tax concessions for exceeding energy efficiency and environmental policies</li>\n<li>
