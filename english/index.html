<title>HSC English Hub</title>
<meta name="description" content="Luca's HSC Standard English notes: Paper 1 and Paper 2 in one place.">
<style>
/* Layout: Notion-style workspace. Quiet grey sidebar page tree, white page with a
   centred 720px reading column, page properties, callouts, toggles and table views. */
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --hover:rgba(55,53,47,.06); --active:rgba(55,53,47,.09);
  --line:rgba(55,53,47,.12); --ink:#37352F; --muted:rgba(55,53,47,.62); --faint:rgba(55,53,47,.42);
  --callout:#F1F1EF; --link:#2F6E9E; --shadow:rgba(15,15,15,.12);
  /* Notion-style tag colours: background / text */
  --t-gray:#E3E2E0;   --tx-gray:#32302C;
  --t-brown:#EEE0DA;  --tx-brown:#442A1E;
  --t-orange:#FADEC9; --tx-orange:#49290E;
  --t-yellow:#FDECC8; --tx-yellow:#402C1B;
  --t-green:#DBEDDB;  --tx-green:#1C3829;
  --t-blue:#D3E5EF;   --tx-blue:#183347;
  --t-purple:#E8DEEE; --tx-purple:#412454;
  --t-pink:#F5E0E9;   --tx-pink:#4C2337;
  --t-red:#FFE2DD;    --tx-red:#5D1715;
  --f-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
  --f-quote: "Iowan Old Style", Charter, "Bitstream Charter", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09); --ink:rgba(255,255,255,.86); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.34);
  --callout:#252525; --link:#79B4E0; --shadow:rgba(0,0,0,.5);
  --t-gray:#373737;   --tx-gray:rgba(255,255,255,.86);
  --t-brown:#4A3A31;  --tx-brown:#E6D3C7;
  --t-orange:#5C3B23; --tx-orange:#F2CDAE;
  --t-yellow:#564328; --tx-yellow:#F1DFB4;
  --t-green:#243D30;  --tx-green:#C3E3CC;
  --t-blue:#143A4E;   --tx-blue:#BDDCEE;
  --t-purple:#3C2D49; --tx-purple:#DCCBEB;
  --t-pink:#4E2C3C;   --tx-pink:#F0C9DA;
  --t-red:#522E2A;    --tx-red:#F5C9C2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09); --ink:rgba(255,255,255,.86); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.34);
  --callout:#252525; --link:#79B4E0; --shadow:rgba(0,0,0,.5);
  --t-gray:#373737;   --tx-gray:rgba(255,255,255,.86);
  --t-brown:#4A3A31;  --tx-brown:#E6D3C7;
  --t-orange:#5C3B23; --tx-orange:#F2CDAE;
  --t-yellow:#564328; --tx-yellow:#F1DFB4;
  --t-green:#243D30;  --tx-green:#C3E3CC;
  --t-blue:#143A4E;   --tx-blue:#BDDCEE;
  --t-purple:#3C2D49; --tx-purple:#DCCBEB;
  --t-pink:#4E2C3C;   --tx-pink:#F0C9DA;
  --t-red:#522E2A;    --tx-red:#F5C9C2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--link);outline-offset:1px;border-radius:4px}
mark{background:var(--t-yellow);color:inherit;border-radius:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:10px 8px 24px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;border-radius:6px}
.ws .av{width:22px;height:22px;border-radius:4px;background:var(--t-brown);color:var(--tx-brown);display:grid;place-items:center;font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:4px 8px;border-radius:6px;text-decoration:none;color:var(--muted);text-align:left}
.row:hover{background:var(--hover)}
.row[aria-current="page"]{background:var(--active);color:var(--ink);font-weight:500}
.row .kbd{margin-left:auto;font-size:12px;color:var(--faint)}
.row .sw{margin-left:auto;width:26px;height:15px;border-radius:999px;background:var(--active);position:relative;transition:background .15s}
.row .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px var(--shadow);transition:transform .15s}
.row[aria-pressed="true"] .sw{background:var(--link)}
.row[aria-pressed="true"] .sw::after{transform:translateX(11px)}
.grp{font-size:12px;font-weight:500;color:var(--faint);padding:14px 8px 4px}
.row .pg{color:var(--ink)}
.row .sub{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:4;background:var(--bg);height:45px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{text-decoration:none;padding:2px 6px;border-radius:4px}
.crumbs a:hover{background:var(--hover)}
.crumbs .cur{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;padding:4px;border-radius:4px;color:var(--muted)}
.menu-btn:hover{background:var(--hover)}

/* Page */
.page{max-width:720px;margin:0 auto;padding:56px 24px 120px}
.page h1.title{font-size:40px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
.props{display:grid;gap:2px;margin-bottom:20px;font-size:14px}
.prop{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:34px}
.prop .k{display:flex;align-items:center;gap:6px;color:var(--muted)}
.prop .k svg.i{width:15px;height:15px}
.prop .v{padding:4px 6px;min-width:0}
.divider{border:0;border-top:1px solid var(--line);margin:8px 0 22px}

.page h2{font-size:24px;margin:32px 0 6px;scroll-margin-top:60px}
.page h3{font-size:19px;margin:22px 0 4px}
.page p{margin:3px 0}
.muted{color:var(--muted)}

.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:13px;line-height:1;white-space:nowrap;margin:2px 4px 2px 0}

.callout{display:flex;gap:10px;background:var(--callout);border-radius:4px;padding:16px 16px 16px 12px;margin:10px 0}
.callout .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted)}
.callout .ct{min-width:0;display:grid;gap:4px}
.callout b.lbl{font-weight:600}

.quote{border-left:3px solid currentColor;padding:2px 14px;margin:8px 0;font-family:var(--f-quote);font-size:18px}

ol.num{margin:6px 0 4px;padding-left:26px;display:grid;gap:4px}
ol.num li::marker{color:var(--muted)}

/* Toggle blocks */
details.tg{margin:2px 0;border-radius:4px}
details.tg>summary{list-style:none;display:flex;gap:6px;align-items:flex-start;cursor:pointer;padding:3px 2px;border-radius:4px}
details.tg>summary::-webkit-details-marker{display:none}
details.tg>summary:hover{background:var(--hover)}
details.tg>summary .tri{flex:none;width:22px;height:24px;display:grid;place-items:center;color:var(--ink);transition:transform .15s}
details.tg[open]>summary .tri{transform:rotate(90deg)}
details.tg>summary .sm{min-width:0}
details.tg>summary .sm b{font-weight:600}
details.tg>summary .sm .q{font-family:var(--f-quote);font-size:17px}
details.tg>.body{padding:2px 0 10px 30px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:15px}
.kv .k{color:var(--muted);font-size:14px;padding-top:1px}
.line{font-family:var(--f-quote);font-size:17px;background:var(--callout);border-radius:4px;padding:10px 14px}

/* Table view */
.tbl-wrap{overflow-x:auto;margin:8px 0 4px}
table.db{width:100%;border-collapse:collapse;font-size:14px}
table.db th{font-weight:400;color:var(--muted);text-align:left;padding:7px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.db th svg.i{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
table.db td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.db th+th,table.db td+td{border-left:1px solid var(--line)}
table.db td.q{font-family:var(--f-quote);font-size:15.5px;width:38%}
table.db td.e{width:38%}
table.db .ctx{display:block;margin-top:4px;color:var(--muted);font-size:13px}
table.db tbody tr:hover{background:var(--hover)}

/* Home: database list */
.list{border-top:1px solid var(--line);margin:6px 0 4px}
.list a{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.list a:hover{background:var(--hover)}
.list .nm{font-weight:500;flex:none}
.list .ds{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.list .tag{flex:none}

/* Empty */
.empty{color:var(--faint);padding:6px 2px}

/* Recall mode: blur analysis until clicked */
body.recall .rv{filter:blur(5px);opacity:.6;cursor:pointer;transition:filter .15s,opacity .15s;user-select:none}
body.recall .rv.shown{filter:none;opacity:1;user-select:auto}

/* Search modal */
.scrim[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(15,15,15,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.modal{background:var(--bg);width:100%;max-width:620px;border-radius:10px;box-shadow:0 12px 40px var(--shadow),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.modal .inp{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.modal input{flex:1;min-width:0;font:17px var(--f-ui);color:var(--ink);background:none;border:0;outline:none}
.modal .res{overflow-y:auto;padding:6px}
.modal .hd{font-size:12px;color:var(--faint);padding:8px 10px 4px}
.hit{display:grid;gap:2px;padding:8px 10px;border-radius:6px;text-decoration:none}
.hit:hover,.hit.sel{background:var(--hover)}
.hit .t{font-weight:500;font-size:14.5px}
.hit .w{font-size:12px;color:var(--faint)}
.hit .s{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,85vw);z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
  body.nav-open .side{transform:none}
  .menu-btn{display:block}
  .topbar{top:env(safe-area-inset-top,0px)}
  .page{padding:28px 16px 100px}
  .page h1.title{font-size:32px}
  .prop{grid-template-columns:110px minmax(0,1fr)}
  table.db thead{display:none}
  table.db,table.db tbody,table.db tr,table.db td{display:block;width:auto!important}
  table.db tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.db td{border:0!important;padding:3px 0}
  .list .ds{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Pages"></aside>
  <div>
    <div class="topbar">
      <button class="menu-btn" id="menu" aria-label="Open sidebar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    </div>
    <main class="page" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-label="Search notes">
    <div class="inp"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Search quotes, techniques, ideas…" autocomplete="off" aria-label="Search all notes"></div>

<script>
/* ============================================================
   NOTES DATA — add new notes here. Each module has `parts`;
   each part can hold: claim, ctx, items[], model, table.
   An item: { ttl, quote | scene, tech:[...], effect, ctx, line }
   ============================================================ */
const PAPERS = [
  { id:1, name:"Paper 1", meta:"1 hr 30 min + 10 min reading · 40 marks", mods:["short","common"] },
  { id:2, name:"Paper 2", meta:"2 hr + 10 min reading · 60 marks", mods:["mod-a","mod-b","mod-c"] }
];

const MODS = {
  "short": {
    code:"Sec I", color:"--c-short", name:"Short Answer", sub:"Unseen texts",
    rubric:"Section I · 20 marks. Short-answer questions on unseen texts linked to the Common Module: Texts and Human Experiences.",
    empty:true
  },

  "common": {
    code:"Sec II", color:"--c-common", name:"Common Module", sub:"Texts and Human Experiences",
    text:"Nineteen Eighty-Four · George Orwell", kind:"Essay plan",
    rubric:"Section II · 20 marks. Extended response on how your prescribed text represents individual and collective human experiences.",
    thesis:{
      label:"Line of argument",
      text:"Totalitarian control dismantles the fundamental mechanisms of the human experience by weaponising language, suppressing instinctual defiance and psychologically converting individual devotion into ideological subservience."
    },
    prose:[
      "<b>Context.</b> In <i>Nineteen Eighty-Four</i>, George Orwell draws upon the historical realities of Stalinist Russia and Nazi Germany to construct a dystopian satire, focalising Oceania’s totalising oppression through Winston’s limited, destabilised consciousness."
    ],
    roadmap:[
      ["Epistemological control", "The Party manipulates language and history to destroy the objective reality necessary for autonomous thought."],
      ["Anomalous resistance", "Winston’s instinctual defiance emerges through private authorship and bodily intimacy."],
      ["Psychological conversion", "Total power culminates not in mere compliance, but in the psychological subversion of love and trust into absolute submission."]
    ],
    parts:[
      { id:"p1", tag:"Body 1", h:"Epistemological control and language",
        claim:"Total power reconstructs the human experience by monopolising how truth is perceived.",
        ctx:"Orwell’s exposure to Spanish Civil War propaganda and Stalinist revisionism.",
        items:[
          { ttl:"Doublethink", tech:["Neologism"], quote:"hold simultaneously two opinions… contradictory and believing both",
            effect:"Citizens are required to accept contradiction, so objective truth loses its authority." },
          { ttl:"Newspeak", tech:["Invented language"], quote:"narrow the range of human thought",
            effect:"Truncates vocabulary to make independent thought virtually impossible." },
          { ttl:"Comrade Ogilvy", tech:["Metafiction"], quote:"had never existed … exists as authentically as Charlemagne or Julius Caesar",
            effect:"Winston’s forged character is a metafictional act of authorship, showing how state-manufactured realities displace empirical history." }
        ] },
      { id:"p2", tag:"Body 2", h:"Private expression and resistance",
        claim:"Humanity possesses an instinctual drive to preserve authentic selfhood against enforced conformity.",
        ctx:"Post-war disillusionment with authoritarian control over private life.",
        items:[
          { ttl:"The Diary", tech:["Embedded form"], quote:"to mark the paper was the decisive act",
            effect:"Transforms private authorship into an anomalous political act, defiant despite panoptic surveillance where “if detected… he would be punished by death.”" },
          { ttl:"Intimacy with Julia", tech:["Juxtaposition"], quote:"the sexual act, successfully performed, was rebellion",
            effect:"Set against his sterile marriage with Katharine, it reclaims primal physical desire from institutional control." },
          { ttl:"Glass paperweight", tech:["Motif", "Symbolism"], quote:"tiny world",
            effect:"Encloses their lives, symbolically insulating their private sphere and interiority from the collective state." }
        ] },
      { id:"p3", tag:"Body 3", h:"Psychological conversion and betrayal",
        claim:"Totalitarian dominance seeks active psychological conversion rather than mere compliance, turning human instinct against the self.",
        ctx:"Subverts the Bildungsroman arc, drawing on the coerced confessions of the Moscow Show Trials.",
        items:[
          { ttl:"O’Brien", tech:["Characterisation"], quote:"someone who could be talked to",
            effect:"Winston’s view of his torturer shows how totalitarianism co-opts innate human trust to engineer psychological surrender." },
          { ttl:"Room 101", tech:["Frantic parataxis"], quote:"Do it to Julia! Do it to Julia! Not me! Julia!",
            effect:"Extreme terror exposes behavioural inconsistency; survival instinct forces him to sacrifice moral loyalty and love." },
          { ttl:"Resolution", tech:["Bathetic paradox"], quote:"He had won the victory over himself. He loved Big Brother.",
            effect:"Devotion is redirected toward the oppressor rather than destroyed." }
        ] }
    ]
  },

  "mod-a": {
    code:"Mod A", color:"--c-a", name:"Module A", sub:"Language, Identity and Culture",
    text:"Six poems", kind:"Quote bank",
    rubric:"Section I · 20 marks. How language shapes and reflects individual and collective identity and culture.",
    parts:[
      { id:"oombulgari", tag:"BEF", h:"Oombulgari", items:[
        { quote:"Blue pattern dresses / drift down empty streets", tech:["Symbolism","Visual imagery"],
          effect:"Discarded assimilation and state policing.", ctx:"2011 forced closure of Oombulgari and eviction of its community." },
        { quote:"Empty now, as empty as the promises", tech:["Repetition","Simile"],
          effect:"Bitter condemnation of hollow land rights policies." },
        { quote:"Fortress to guard the perimeter … Creak of gate is silent", tech:["Extended metaphor","Oxymoron"],
          effect:"The patient land awaits the community’s return; Country guarding itself." }
      ]},
      { id:"unearth", tag:"LBB", h:"Unearth", items:[
        { quote:"Let’s dig up the soil", tech:["Inclusive imperative"],
          effect:"Urgent collective call to action and recovery of discarded memory.", ctx:"1963 Yirrkala Bark Petitions and truth-telling." },
        { quote:"Boomerangs will rattle in unison", tech:["Auditory imagery"],
          effect:"Cultural resistance and spiritual awakening." },
        { quote:"Blood on the truth", tech:["Symbolic motif"],
          effect:"The violent colonial history that must be faced." }
      ]},
      { id:"eyes", tag:"EES", h:"Eyes", items:[
        { quote:"eyes stare to challenge her / from a plate", tech:["Domestic motif","Surreal imagery"],
          effect:"The home as a place of stress; wearing fake masks to survive." },
        { quote:"eyes of terror she has thrown away", tech:["Anaphora","High modality"],
          effect:"A conscious decision to reject fear, subservience and victimhood." },
        { quote:"she picks the eyes filled with rage", tech:["Active syntax","Climactic resolution"],
          effect:"Using anger as a protective shield to reclaim personal control." }
      ]},
      { id:"trance", tag:"HSB", h:"Trance", items:[
        { quote:"hunched in her possum skin cloak", tech:["Cultural symbolism","Visual imagery"],
          effect:"Ancestral warmth and protection provide comfort during grief." },
        { quote:"she floats in a pituri haze", tech:["Cultural allusion","Metaphor"],
          effect:"Stepping beyond ordinary time to commune with her husband’s spirit." },
        { quote:"branches uplift his bark-bound body", tech:["Alliteration","Personification"],
          effect:"Traditional bark burials; nature gently welcoming the spirit home." }
      ]},
      { id:"key", tag:"OTT", h:"Key", items:[
        { quote:"on the rim where light and shadow meet", tech:["Spatial metaphor","Contrast"],
          effect:"Trapped in a liminal space between two cultures; fractured identity.",
          ctx:"Children of the Stolen Generations caught between Aboriginal origins and white adoptive families." },
        { quote:"their time is sparse like a dying tree", tech:["Simile","Natural imagery"],
          effect:"Urgency of reconnecting with ageing Elders before ancestral wisdom vanishes." },
        { quote:"there is no keyhole to the future / and no vision to the past", tech:["Metaphor","Repetition"],
          effect:"Disconnection from roots; total loss of control over destiny." }
      ]},
      { id:"leaves", tag:"THI", h:"Leaves", items:[
        { quote:"that lone tree on the ridge / is that my father?", tech:["Extended metaphor","Hypophora"],
          effect:"Nature replaces absent family; seeking identity through landscape." },
        { quote:"he did not know me / yet gave me leaves", tech:["Paradox","Symbolism"],
          effect:"An unconditional gift of culture and kinship received from Country." },
        { quote:"if I climb to him now / and lie in his limbs / will our story unite?", tech:["Personification","Rhetorical question"],
          effect:"Tender longing to heal family trauma and unite with ancestral lineage." }
      ]}
    ]
  },

  "mod-b": {
    code:"Mod B", color:"--c-b", name:"Module B", sub:"Close Study of Literature",
    text:"The Truman Show · Peter Weir (1998)", kind:"Essay",
    rubric:"Section II · 20 marks. The distinctive qualities of your prescribed text and the ideas it explores.",
    thesis:{
      label:"Introduction",
      text:"In Peter Weir’s postmodern film <i>The Truman Show</i>, he explores the distinctive qualities of a society consumed by commercialism and the ethical erosion of the digital age. Through the construction of a hyperreal setting, Weir critiques the blurring of boundaries between authentic existence and manufactured “reality”. Furthermore, by examining the manipulative nature of the media, the film challenges the morality of a voyeuristic culture that prioritises entertainment over human dignity. Ultimately, Weir’s cinematic work serves as a cautionary tale regarding the preservation of truth in a scripted world."
    },
    parts:[
      { id:"bp1", tag:"Body 1", h:"The construction of the hyperreal",
        claim:"Weir establishes the distinctive qualities of Seahaven by creating a “hyperreal” environment where commercial interests dictate the parameters of human life.",
        ctx:"Jean Baudrillard’s theory of simulation and simulacra: Seahaven is not a real place but a sterile copy of 1950s Americana designed to sell the “American Dream”.",
        items:[
          { ttl:"The irony of entrapment", scene:"Truman pinned against the Kaiser Chicken poster", quote:"free range",
            tech:["Mise-en-scène","Satirical irony"],
            effect:"The framing places him in front of a sign reading “free range”. He is literally being “farmed” like a commodity for a global audience rather than living as a free man." },
          { ttl:"The erosion of intimacy", scene:"Meryl holds up Mococoa and smiles into empty space in the kitchen",
            tech:["Direct address","Product placement"],
            effect:"Looking into the integrated lenses, Meryl shows how commercial priorities have infiltrated the most private spheres of family life. Her robotic delivery shows her role as ‘wife’ is purely performative." },
          { ttl:"Cinematic artifice", scene:"Recurring “hidden camera” shots",
            tech:["Anamorphic vignetting"],
            effect:"A constant reminder to the extra-diegetic audience that Truman’s perceived reality is a broadcast simulation, stripping him of autonomy for the sake of profit." }
        ],
        model:"Thus, the <span class=\"slot\">keyword, e.g. artificiality</span> of Seahaven reveals the “distinctive quality” of a world where human experience is secondary to the bottom line." },
      { id:"bp2", tag:"Body 2", h:"The ethics of media manipulation",
        claim:"Beyond the physical setting, Weir explores the ethical decay inherent in media manipulation, personified through the “God-like” figure of Christof, whose omniscient control is a scathing critique of a voyeuristic culture that treats human suffering as a scripted narrative.",
        items:[
          { ttl:"Metacinematic manipulation", scene:"The “reunion” with Truman’s father on the pier, directed from the Lunar Room",
            tech:["Film-within-a-film"],
            effect:"Showing Christof actively directing the emotional beats exposes the cold artifice of the soap-opera genre." },
          { ttl:"Auditory control", quote:"Cue the music",
            tech:["Non-diegetic orchestral swell"],
            effect:"The media scripts and manufactures human emotion to force an empathetic response from viewers." },
          { ttl:"The betrayal of connection", scene:"Marlon’s “nothing is real” speech, fed through an earpiece while facing a hidden camera",
            tech:["Medial staging"],
            effect:"Marlon’s loyalty is to the ratings, not his friend. Christof’s world totally replaces authentic connection with scripted performance." }
        ],
        model:"Consequently, Weir suggests that when <span class=\"slot\">keyword, e.g. power / influence</span> is left unchecked, the media becomes an instrument of psychological imprisonment." }
    ]
  },

  "mod-c": {
    code:"Mod C", color:"--c-c", name:"Module C", sub:"The Craft of Writing",
    text:"Imaginative piece · inspired by Ray Bradbury’s “The Pedestrian”", kind:"Story plan + reflection",
    rubric:"Section III · 20 marks. Imaginative, discursive or persuasive writing, often with a reflection on your choices.",
    parts:[
      { id:"s1", tag:"Section 1", h:"Departure",
        claim:"He leaves the city behind and steps into the real world.",
        items:[
          { ttl:"Technique 1", tech:["Extended tomb metaphor"], effect:"Describes the cityscape he is leaving behind.",
            line:"He left behind the towers, monolithic mausoleums where thousands sat entombed by the blue-lit anaesthesia of their personal feeds." },
          { ttl:"Technique 2", tech:["Olfactory and sensory grounding"], effect:"Grounds the transition into the real world immediately.",
            line:"Stepping into the alley, he swallowed the sharp vinegar tang of unfiltered air, and the biting wind chapping his lips." }
        ] },
      { id:"s2", tag:"Section 2", h:"Atmosphere",
        claim:"The protagonist feels the simple joy of walking and observing something real, but the environment itself is uncomfortable with his non-compliance.",
        items:[
          { ttl:"Technique 3", tech:["Subversive verbs"], effect:"Makes the city hostile and complicit.",
            line:"Around him, the glass facades of corporate buildings crouch like silent sentinels, while the doors hiss shut like guillotines." }
        ] },
      { id:"s3", tag:"Section 3", h:"Climax and resolution",
        claim:"A security drone or city system catches him off-route. The story ends on a chilling note of entrapment.",
        items:[
          { ttl:"Technique 4", tech:["Chiaroscuro","Saccadic rhythm"], effect:"Violent light against dark, then short clipped sentences.",
            line:"The soft darkness was violently shattered; a blinding, sweeping LED beam pinned him to the concrete. A lens clicked. Caught." },
          { ttl:"Technique 5", tech:["Irony of automation"], effect:"The machine’s flat, unemotional response.",
            line:"A flat electronic voice emitted from the chassis: ‘Route deviation detected. Return to designated transit corridor.’" }
        ] },
      { id:"reflection", tag:"Reflection", h:"Reflection: links to “The Pedestrian”",
        table:{ head:["Technique","How Bradbury uses it"], rows:[
          ["Olfactory sensory grounding<small>Non-visual sensory grounding</small>","Establishes Leonard Mead’s human vitality: “smelling the rusty smell of cold” and the “silent wind”."],
          ["Extended tomb metaphor<small>Socio-cultural critique</small>","Houses depicted as “tombs” and “graveyards” lit by the ghostly glow of screens."],
          ["Chiaroscuro<small>Visual contrast and pace</small>","The jarring intrusion of the car’s “fierce white cone of light” shatters the natural dark."],
          ["Irony of automation<small>Sterile vs human voice</small>","The police car speaks in a “metallic whisper”, unable to comprehend human creativity."],
          ["Subversive verbs<small>Atmospheric hostility</small>","Windows “like phantoms”, homes that “groan”: the landscape is complicit in isolation."]
        ]} }
    ]
  }
};


/* ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");

/* Module colours use the Notion tag palette */
const MCOL = { "short":"gray", "common":"blue", "mod-a":"green", "mod-b":"purple", "mod-c":"orange" };
const TAGS = ["brown","orange","yellow","green","blue","purple","pink","red","gray"];
function tag(text, c){
  if (!c){ let h = 0; for (const ch of text.toLowerCase()) h = (h*31 + ch.charCodeAt(0)) >>> 0; c = TAGS[h % TAGS.length]; }
  return `<span class="tag" style="background:var(--t-${c});color:var(--tx-${c})">${text}</span>`;
}
const modTag = id => tag(MODS[id].code, MCOL[id]);
const paperOf = id => PAPERS.find(p => p.mods.includes(id));

const I = {
  page:'<svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 15.5h6"/></svg>',
  home:'<svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 10v9h12v-9"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  text:'<svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>',
  num:'<svg class="i" viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  tri:'<svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M4 2.5l4.5 3.5L4 9.5z"/></svg>'
};

function stats(m){
  if (m.empty) return "No notes yet";
  const items = m.parts.reduce((n,p)=>n+(p.items?p.items.length:0),0);
  if (m === MODS["mod-a"]) return `${m.parts.length} poems · ${items} quotes`;
  if (m === MODS["mod-c"]) return `3 sections · ${items} techniques · reflection`;
  return `${m.parts.length} body paragraphs · ${items} pieces of evidence`;
}

function renderSide(active){
  let h = `<a class="ws" href="#home"><span class="av">L</span>Luca’s English</a>
    <button class="row" id="open-search">${I.search}Search<span class="kbd">Ctrl K</span></button>
    <button class="row" id="recall" aria-pressed="${document.body.classList.contains("recall")}">${I.eye}Recall mode<span class="sw"></span></button>
    <a class="row" href="#home" ${active==="home"?'aria-current="page"':''}>${I.home}<span class="pg">Overview</span></a>`;
  for (const p of PAPERS){
    h += `<div class="grp">${p.name}</div>`;
    for (const id of p.mods){
      const m = MODS[id];
      h += `<a class="row" href="#${id}" ${active===id?'aria-current="page"':''}>${I.page}<span class="pg">${m.name}</span><span class="sub">${m.empty?"empty":m.code}</span></a>`;
    }
  }
  $("#side").innerHTML = h;
}

function renderCrumbs(id){
  if (id === "home"){ $("#crumbs").innerHTML = `<span class="cur">Overview</span>`; return; }
  const m = MODS[id], p = paperOf(id);
  $("#crumbs").innerHTML = `<a href="#home">Luca’s English</a><span>/</span><span>${p.name}</span><span>/</span><span class="cur">${m.name}</span>`;
}

function renderHome(){
  let h = `<h1 class="title">HSC English</h1>
    <div class="props">
      <div class="prop"><span class="k">${I.list}Course</span><span class="v">${tag("English Standard","brown")}</span></div>
      <div class="prop"><span class="k">${I.clock}Exam year</span><span class="v">2026</span></div>
    </div>
    <div class="callout"><span class="ic">i</span><div class="ct"><p>Open a module from the list below or the sidebar. Press <b>Ctrl K</b> to search every quote and technique. Turn on <b>Recall mode</b> to blur the analysis and test yourself.</p></div></div>`;
  for (const p of PAPERS){
    h += `<h2>${p.name}</h2><p class="muted" style="font-size:14px">${p.meta}</p><div class="list">`;
    for (const id of p.mods){
      const m = MODS[id];
      h += `<a href="#${id}">${I.page}<span class="nm">${m.name}</span><span class="ds">${m.sub}${m.text?" · "+strip(m.text):""}</span>${tag(stats(m), m.empty?"gray":MCOL[id])}</a>`;
    }
    h += `</div>`;
  }
  return h;
}

function renderToggle(it){
  const head = it.ttl
    ? `<b>${it.ttl}</b>${it.quote?` <span class="q">“${it.quote}”</span>`:""}`
    : `<span class="q">“${it.quote}”</span>`;
  let b = "";
  if (it.scene) b += `<div class="kv"><span class="k">Scene</span><span>${it.scene}</span></div>`;
  if (it.line) b += `<div class="line rv">${it.line}</div>`;
  if (it.tech) b += `<div class="kv"><span class="k">Technique</span><span class="rv">${it.tech.map(t=>tag(t)).join("")}</span></div>`;
  if (it.effect) b += `<div class="kv"><span class="k">Effect</span><span class="rv">${it.effect}</span></div>`;
  if (it.ctx) b += `<div class="kv"><span class="k">Context</span><span class="rv">${it.ctx}</span></div>`;
  return `<details class="tg" open><summary><span class="tri">${I.tri}</span><span class="sm">${head}</span></summary><div class="body">${b}</div></details>`;
}

function renderTable(items){
  return `<div class="tbl-wrap"><table class="db"><thead><tr><th>${I.text}Quote</th><th>${I.list}Technique</th><th>${I.text}Effect</th></tr></thead><tbody>${
    items.map(it=>`<tr><td class="q">“${it.quote}”</td><td><span class="rv">${it.tech.map(t=>tag(t)).join("")}</span></td><td class="e"><span class="rv">${it.effect}${it.ctx?`<span class="ctx">Context: ${it.ctx}</span>`:""}</span></td></tr>`).join("")
  }</tbody></table></div>`;
}

function renderModule(id){
  const m = MODS[id], p = paperOf(id);
  let h = `<h1 class="title">${m.name}: ${m.sub}</h1><div class="props">
    <div class="prop"><span class="k">${I.list}Paper</span><span class="v">${tag(p.name,"gray")} ${modTag(id)}</span></div>`;
  if (m.text) h += `<div class="prop"><span class="k">${I.text}Text</span><span class="v">${m.text}</span></div>`;
  if (m.kind) h += `<div class="prop"><span class="k">${I.list}Type</span><span class="v">${tag(m.kind)}</span></div>`;
  h += `<div class="prop"><span class="k">${I.num}Marks</span><span class="v">${m.rubric.split(".")[0]}</span></div></div>
    <p class="muted">${m.rubric.split(". ").slice(1).join(". ")}</p><hr class="divider">`;

  if (m.empty){
    return h + `<p class="empty">No notes yet. Send your short-answer notes and they’ll go here.</p>
      <div class="callout"><span class="ic">?</span><div class="ct"><b class="lbl">Worth adding</b><p>Your technique list with definitions. A structure for 3, 4, 5 and 6-mark answers. Practice answers on unseen texts.</p></div></div>`;
  }
  if (m.parts.length > 1) h += `<p class="muted" style="font-size:14px">On this page: ${m.parts.map(p=>`<a href="#${id}" data-jump="${p.id}" style="color:var(--link);text-decoration:none">${p.h.replace(/^Reflection:.*/,"Reflection")}</a>`).join(" · ")}</p>`;
  if (m.thesis) h += `<div class="callout"><span class="ic">“</span><div class="ct"><b class="lbl">${m.thesis.label}</b><p>${m.thesis.text}</p></div></div>`;
  if (m.prose) h += m.prose.map(x=>`<p>${x}</p>`).join("");
  if (m.roadmap) h += `<h3>Roadmap</h3><ol class="num">${m.roadmap.map(([a,b])=>`<li><b>${a}.</b> ${b}</li>`).join("")}</ol>`;

  const isTable = id === "mod-a";
  for (const pt of m.parts){
    h += `<h2 id="${pt.id}">${pt.h}${pt.tag && isTable ? ` <span class="tag" style="background:var(--t-gray);color:var(--tx-gray);vertical-align:4px">${pt.tag}</span>`:""}</h2>`;
    if (pt.tag && !isTable) h += `<p class="muted" style="font-size:13px;margin-top:-2px">${pt.tag}</p>`;
    if (pt.claim) h += `<p>${pt.claim}</p>`;
    if (pt.ctx) h += `<div class="callout"><span class="ic">C</span><div class="ct"><b class="lbl">Context</b><p>${pt.ctx}</p></div></div>`;
    if (pt.items) h += isTable ? renderTable(pt.items) : `<div style="margin-top:8px">${pt.items.map(renderToggle).join("")}</div>`;
    if (pt.model) h += `<div class="callout"><span class="ic">✎</span><div class="ct"><b class="lbl">Linking sentence (adapt the bold bit)</b><p>${pt.model.replace(/<span class="slot">(.*?)<\/span>/g,"<b>[$1]</b>")}</p></div></div>`;
    if (pt.table) h += `<div class="tbl-wrap"><table class="db"><thead><tr>${pt.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${pt.table.rows.map(r=>`<tr><td><b>${r[0].split("<small>")[0]}</b><span class="ctx">${strip(r[0].split("<small>")[1]||"")}</span></td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return h;
}

/* Search index */
const INDEX = [];
for (const [id,m] of Object.entries(MODS)){
  if (m.empty) continue;
  if (m.thesis) INDEX.push({id, where:`${m.name} · ${m.thesis.label}`, title:m.thesis.label, text:strip(m.thesis.text)});
  (m.roadmap||[]).forEach(([a,b])=>INDEX.push({id, where:`${m.name} · Roadmap`, title:a, text:b}));
  for (const p of m.parts){
    if (p.claim) INDEX.push({id, part:p.id, where:`${m.name} · ${p.h}`, title:p.h, text:[p.claim,p.ctx||""].join(" ")});
    (p.items||[]).forEach(it=>INDEX.push({id, part:p.id, where:`${m.name} · ${p.h}`, title:it.ttl||(it.quote?`“${it.quote}”`:p.h),
      text:[it.quote,it.scene,it.line,(it.tech||[]).join(", "),it.effect,it.ctx].filter(Boolean).map(strip).join(" · ")}));
    if (p.model) INDEX.push({id, part:p.id, where:`${m.name} · ${p.h}`, title:"Linking sentence", text:strip(p.model)});
    if (p.table) p.table.rows.forEach(r=>INDEX.push({id, part:p.id, where:`${m.name} · Reflection`, title:strip(r[0].split("<small>")[0]), text:strip(r[1])}));
  }
}
function hl(text, q){
  const t = esc(text); if (!q) return t;
  return t.replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig"),"<mark>$1</mark>");
}
let sel = 0;
function renderResults(){
  const q = $("#q").value.trim(), ql = q.toLowerCase();
  if (!q){
    $("#res").innerHTML = `<div class="hd">Pages</div>` + Object.keys(MODS).map(id=>`<a class="hit" href="#${id}" data-part=""><span class="t">${MODS[id].name}: ${MODS[id].sub}</span><span class="w">${paperOf(id).name}</span></a>`).join("");
  } else {
    const hits = INDEX.filter(e => (e.title+" "+e.text+" "+e.where).toLowerCase().includes(ql));
    $("#res").innerHTML = `<div class="hd">${hits.length} result${hits.length===1?"":"s"}</div>` + (hits.length ? hits.map(e=>`<a class="hit" href="#${e.id}" data-part="${e.part||""}"><span class="t">${hl(e.title,q)}</span><span class="w">${esc(e.where)}</span><span class="s">${hl(e.text,q)}</span></a>`).join("")
      : `<p class="hit muted">No matches. Try a technique like “metaphor”, a character like “Meryl”, or an idea like “identity”.</p>`);
  }
  sel = 0; markSel();
}
function markSel(){ const hs=[...document.querySelectorAll("#res a.hit")]; hs.forEach((h,i)=>h.classList.toggle("sel",i===sel)); if(hs[sel]) hs[sel].scrollIntoView({block:"nearest"}); }
function openSearch(){ $("#scrim").hidden = false; document.body.classList.remove("nav-open"); $("#q").value=""; renderResults(); $("#q").focus(); }
function closeSearch(){ $("#scrim").hidden = true; }

let pendingPart = null;
function route(){
  let id = location.hash.slice(1);
  if (!MODS[id]) id = "home";
  renderSide(id); renderCrumbs(id);
  $("#main").innerHTML = id === "home" ? renderHome() : renderModule(id);
  document.body.classList.remove("nav-open");
  if (pendingPart){ const el = document.getElementById(pendingPart); pendingPart = null; if (el) el.scrollIntoView(); }
  else window.scrollTo(0,0);
  try{ localStorage.setItem("eng-last", id); }catch(e){}
}
function setRecall(on){
  document.body.classList.toggle("recall", on);
  const b = $("#recall"); if (b) b.setAttribute("aria-pressed", on);
  document.querySelectorAll(".rv.shown").forEach(x=>x.classList.remove("shown"));
  try{ localStorage.setItem("eng-recall", on ? "1" : "0"); }catch(e){}
}

window.addEventListener("hashchange", route);
$("#q").addEventListener("input", renderResults);
$("#menu").addEventListener("click", e=>{ e.stopPropagation(); document.body.classList.toggle("nav-open"); });
document.addEventListener("click", e=>{
  if (e.target.closest("#open-search")){ openSearch(); return; }
  if (e.target.closest("#recall")){ setRecall(!document.body.classList.contains("recall")); return; }
  if (e.target === $("#scrim")){ closeSearch(); return; }
  const hit = e.target.closest("a.hit");
  if (hit){ closeSearch(); pendingPart = hit.dataset.part || null; if (location.hash === hit.getAttribute("href")){ e.preventDefault(); route(); } return; }
  const j = e.target.closest("[data-jump]");
  if (j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const rv = e.target.closest(".rv");
  if (rv && document.body.classList.contains("recall")){ e.preventDefault(); rv.classList.add("shown"); return; }
  if (document.body.classList.contains("nav-open") && !e.target.closest("#side")) document.body.classList.remove("nav-open");
});
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#scrim").hidden ? openSearch() : closeSearch(); return; }
  if ($("#scrim").hidden) return;
  const hs = document.querySelectorAll("#res a.hit");
  if (e.key === "Escape") closeSearch();
  else if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(sel+1, hs.length-1); markSel(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(sel-1, 0); markSel(); }
  else if (e.key === "Enter" && hs[sel]){ e.preventDefault(); hs[sel].click(); }
});

try{ if (localStorage.getItem("eng-recall") === "1") document.body.classList.add("recall"); }catch(e){}
if (!location.hash){ try{ const last = localStorage.getItem("eng-last"); if (last && MODS[last]) history.replaceState(null,"","#"+last); }catch(e){} }
route();
</script>
